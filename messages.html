<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rprofiles - Messages</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #ffffff; color: #111; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; display: flex; flex-direction: column; min-height: 100vh; padding-top: 48px; padding-bottom: 54px; }
        header, footer { background: #ffffff; border-color: #e5e5e5; position: fixed; left: 0; width: 100%; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
        header { border-bottom: 1px solid #e5e5e5; height: 48px; top: 0; }
        footer { border-top: 1px solid #e5e5e5; height: 50px; bottom: 0; justify-content: space-around; }
        .brand { font-size: 18px; font-weight: bold; color: #111; text-decoration: none; }
        .wrapper { width: 100%; max-width: 680px; margin: 0 auto; padding: 16px; flex-grow: 1; }
        
        /* Footer Nav Tab SVGs */
        .footer-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; text-decoration: none; font-size: 10px; font-weight: 600; gap: 2px; }
        .footer-tab.active { color: #000; }
        .footer-icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .footer-tab.active .footer-icon { stroke: #000; }

        /* Inbox list items */
        .inbox-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #e5e5e5; cursor: pointer; text-decoration: none; color: inherit; }
        .inbox-item:hover { background: #fafafa; }
        .inbox-avatar { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #e5e5e5; object-fit: cover; background: #f0f0f0; }
        .inbox-info { flex-grow: 1; min-width: 0; }
        .inbox-name { font-weight: bold; font-size: 13px; margin-bottom: 2px; }
        .inbox-preview { color: #666; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .loading-spinner { text-align: center; padding: 20px; color: #666; font-weight: 600; }

        /* Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 14px; }
        .modal-window { width: 100%; max-width: 440px; background: #fff; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; max-height: 85vh; }
        .modal-header { background: #f0f0f0; padding: 10px 14px; font-weight: bold; display: flex; justify-content: space-between; border-bottom: 1px solid #e5e5e5; }
        .modal-body { padding: 14px; display: flex; flex-direction: column; flex-grow: 1; min-height: 0; }
        .chat-container { height: 280px; overflow-y: auto; border: 1px solid #e5e5e5; padding: 10px; margin-bottom: 10px; border-radius: 4px; display: flex; flex-direction: column; gap: 6px; background: #fafafa; flex-grow: 1; }
        .chat-bubble { max-width: 80%; padding: 8px 12px; border-radius: 6px; font-size: 12px; word-break: break-word; }
        .chat-bubble.sent { align-self: flex-end; background: #000; color: #fff; }
        .chat-bubble.received { align-self: flex-start; background: #eee; color: #111; }
    </style>
</head>
<body>
    <header><a href="feed.html" class="brand">rprofiles</a></header>

    <div class="wrapper">
        <div style="font-size: 16px; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid #e5e5e5; padding-bottom: 6px;">Messages</div>
        <div id="inbox-container"><div class="loading-spinner">Loading conversations...</div></div>
    </div>

    <footer>
        <a href="feed.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Home
        </a>
        <a href="feed.html" onclick="openModal('post-modal'); return false;" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Post
        </a>
        <a href="messages.html" class="footer-tab active">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Messages
        </a>
        <a href="profile.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Profile
        </a>
    </footer>

    <!-- DM CHAT MODAL -->
    <div id="dm-modal" class="modal">
        <div class="modal-window">
            <div class="modal-header">
                <span id="dm-title">Chat</span>
                <span style="cursor: pointer;" onclick="closeModal('dm-modal')">✕</span>
            </div>
            <div class="modal-body">
                <div class="chat-container" id="chat-messages">Loading...</div>
                <form onsubmit="sendDm(event)" style="display: flex; gap: 6px;">
                    <input type="text" id="dm-input" placeholder="Type a message..." required style="flex-grow: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px;">
                    <button type="submit" style="background: #000; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-weight: 600; cursor: pointer;">Send</button>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const currentUser = requireAuth();
        let activePeer = null;

        async function loadInbox() {
            const container = document.getElementById('inbox-container');
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/messages/inbox?email=${encodeURIComponent(currentUser.email)}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                if (!data.conversations.length) {
                    container.innerHTML = '<p style="color: #666; text-align: center; padding: 20px;">No conversations yet.</p>';
                    return;
                }

                container.innerHTML = '';
                for (const conv of data.conversations) {
                    const peer = conv.peer;
                    const el = document.createElement('div');
                    el.className = 'inbox-item';
                    el.onclick = () => openChat(peer);
                    el.innerHTML = `
                        <img class="inbox-avatar" src="${peer.pfp_url || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'40\' height=\'40\'><rect width=\'100%\' height=\'100%\' fill=\'%23f0f0f0\'/></svg>'}">
                        <div class="inbox-info">
                            <div class="inbox-name">${peer.username ? '@' + escapeHtml(peer.username) : escapeHtml(peer.email)}</div>
                            <div class="inbox-preview">${escapeHtml(conv.last_message)}</div>
                        </div>
                    `;
                    container.appendChild(el);
                }
            } catch (err) {
                container.innerHTML = '<p style="color: red; text-align: center;">Failed to load inbox.</p>';
            }
        }

        async function openChat(peer) {
            activePeer = peer;
            document.getElementById('dm-title5' || 'dm-title').innerText = `Chat with @${peer.username || peer.email}`;
            openModal('dm-modal');
            loadThread();
        }

        async function loadThread() {
            const chatContainer = document.getElementById('chat-messages');
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/messages/thread?user1=${encodeURIComponent(currentUser.email)}&user2=${encodeURIComponent(activePeer.email)}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                if (!data.messages.length) {
                    chatContainer.innerHTML = '<p style="color: #666; text-align: center; font-size: 11px; margin: auto;">No messages yet.</p>';
                    return;
                }

                chatContainer.innerHTML = data.messages.map(m => {
                    const isSent = m.sender_email.toLowerCase() === currentUser.email.toLowerCase();
                    return `<div class="chat-bubble ${isSent ? 'sent' : 'received'}">${escapeHtml(m.content)}</div>`;
                }).join('');
                chatContainer.scrollTop = chatContainer.scrollHeight;
            } catch (err) {
                chatContainer.innerHTML = '<p style="color: red; font-size: 11px;">Failed to load thread.</p>';
            }
        }

        async function sendDm(e) {
            e.preventDefault();
            const input = document.getElementById('dm-input');
            const content = input.value.trim();
            if (!content || !activePeer) return;

            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/messages/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ senderEmail: currentUser.email, receiverEmail: activePeer.email, content })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                input.value = '';
                loadThread();
            } catch (err) {
                alert(err.message);
            }
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        loadInbox();
    </script>
</body>
</html>
