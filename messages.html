<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nvaritia - Messages</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #ffffff; color: #111; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; display: flex; flex-direction: column; min-height: 100vh; padding-top: 48px; padding-bottom: 54px; }
        header, footer { background: #ffffff; border-color: #e5e5e5; position: fixed; left: 0; width: 100%; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
        header { border-bottom: 1px solid #e5e5e5; height: 48px; top: 0; }
        footer { border-top: 1px solid #e5e5e5; height: 50px; bottom: 0; justify-content: space-around; }
        .brand { font-size: 18px; font-weight: bold; color: #111; text-decoration: none; }
        .wrapper { width: 100%; max-width: 680px; margin: 0 auto; padding: 16px; flex-grow: 1; }
        .footer-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; text-decoration: none; font-size: 10px; font-weight: 600; gap: 2px; }
        .footer-tab.active { color: #000; }
        .footer-icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .footer-icon.icon-filled { fill: currentColor; stroke: none; }
        .footer-tab.active .footer-icon { stroke: #000; }
        .footer-tab.active .footer-icon.icon-filled { fill: #000; stroke: none; }

        .inbox-item { display: flex; align-items: center; gap: 12px; padding: 12px 8px; border-bottom: 1px solid #e5e5e5; cursor: pointer; }
        .inbox-item:hover { background: #fafafa; }
        .avatar { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #e5e5e5; object-fit: cover; background: #f0f0f0; flex-shrink: 0; }
        .inbox-info { flex-grow: 1; min-width: 0; }
        .inbox-name { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 4px; }
        .inbox-preview { color: #666; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

        .chat-drawer { position: fixed; top: 0; right: -100%; width: 100%; height: 100vh; height: 100dvh; background: #fff; z-index: 2000; transition: right 0.25s ease; display: flex; flex-direction: column; }
        .chat-drawer.open { right: 0; }
        .drawer-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #e5e5e5; background: #fff; }
        .chat-header-title { font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
        .chat-container { flex-grow: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #fafafa; }
        .chat-bubble { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.4; word-break: break-word; }
        .chat-bubble.sent { background: #000; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-bubble.received { background: #e5e5ea; color: #111; align-self: flex-start; border-bottom-left-radius: 4px; }
        .chat-form { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #e5e5e5; background: #fff; }
        .chat-form input { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; font-size: 14px; outline: none; }
        .btn-app { background: #000; border: 1px solid #000; border-radius: 18px; color: #fff; font-weight: 600; padding: 0 16px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <a href="feed.html" class="brand">Nvaritia</a>
    </header>

    <div class="wrapper">
        <div id="inbox-list"><p style="color:#666;text-align:center;padding:20px;">Loading messages...</p></div>
    </div>

    <div id="chat-drawer" class="chat-drawer">
        <div class="drawer-header">
            <button type="button" style="background:none;border:none;font-size:18px;cursor:pointer;color:inherit;" onclick="closeChatDrawer()">←</button>
            <img id="chat-peer-avatar" class="avatar" style="width:34px;height:34px;" src="" alt="">
            <span id="chat-peer-name" class="chat-header-title"></span>
        </div>
        <div id="chat-messages" class="chat-container"></div>
        <form id="chat-form" class="chat-form" onsubmit="sendChatMessage(event)">
            <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" required>
            <button type="submit" class="btn-app">Send</button>
        </form>
    </div>

    <footer>
        <a href="feed.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Home
        </a>
        <a href="feed.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            Search
        </a>
        <a href="create-post.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Post
        </a>
        <a href="messages.html" class="footer-tab active">
            <svg class="footer-icon icon-filled" viewBox="0 0 122.56 122.88"><path d="M112.27,10.31l-99,38.07,30,14.37L89.21,33.18,60.44,80.53l14,29.06,37.81-99.28ZM2.42,44.49,117.16.37a3.73,3.73,0,0,1,3-.12,3.78,3.78,0,0,1,2.19,4.87L78.4,120.45a3.78,3.78,0,0,1-6.92.3l-22.67-47L2.14,51.39a3.76,3.76,0,0,1,.28-6.9Z"/></svg>
            Messages
        </a>
        <a href="profile.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Profile
        </a>
    </footer>

    <script src="app.js?v=5"></script>
    <script>
        const currentUser = requireAuth(false);
        const DEFAULT_PFP = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44'><rect width='100%' height='100%' fill='%23f0f0f0'/></svg>";
        let activePeer = null;
        let pollTimer = null;

        function openChatWithPeer(peer) {
            activePeer = peer;
            const peerName = getDisplayName(peer, peer.username || peer.email);
            document.getElementById('chat-peer-avatar').src = peer.pfp_url || DEFAULT_PFP;
            const nameEl = document.getElementById('chat-peer-name');
            nameEl.innerHTML = `${escapeHtml(peerName)}${renderVerifiedBadge(peer.verified)}`;
            nameEl.onclick = () => {
                window.location.href = `profile.html?user=${encodeURIComponent(peer.username || peer.email)}`;
            };
            document.getElementById('chat-drawer').classList.add('open');
            loadThread();
            clearInterval(pollTimer);
            pollTimer = setInterval(loadThread, 4000);
        }

        function closeChatDrawer() {
            clearInterval(pollTimer);
            activePeer = null;
            document.getElementById('chat-drawer').classList.remove('open');
            loadInbox();
        }

        async function loadThread() {
            if (!currentUser || !activePeer) return;
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/messages/thread?user1=${encodeURIComponent(currentUser.email)}&user2=${encodeURIComponent(activePeer.email)}`);
                const data = await res.json();
                const container = document.getElementById('chat-messages');
                const msgs = data.messages || [];

                container.innerHTML = msgs.map(m => {
                    const isSent = m.sender_email && m.sender_email.toLowerCase() === currentUser.email.toLowerCase();
                    const shared = parseSharedPostContent(m.content);
                    if (shared) {
                        return renderSharedPostBubbleHtml(shared, isSent);
                    }
                    return `<div class="chat-bubble ${isSent ? 'sent' : 'received'}">${escapeHtml(m.content || '')}</div>`;
                }).join('') || `<p style="color:#666;text-align:center;margin:auto;">No messages yet.</p>`;

                container.scrollTop = container.scrollHeight;
            } catch (e) {}
        }

        async function sendChatMessage(e) {
            e.preventDefault();
            if (!activePeer) return;
            const input = document.getElementById('chat-input');
            const content = input.value.trim();
            if (!content) return;
            input.value = '';
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/messages/send`, {
                    method: 'POST',
                    headers: authHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ receiverEmail: activePeer.email, content })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to send');
                await loadThread();
            } catch (err) {
                showToast(err.message);
            }
        }

        async function loadInbox() {
            if (!currentUser || !currentUser.email) return;
            const listEl = document.getElementById('inbox-list');
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/messages/inbox`, { headers: authHeaders() });
                const data = await res.json();
                const convos = data.conversations || [];

                if (!convos.length) {
                    listEl.innerHTML = '<p style="color:#666;text-align:center;padding:24px;">No conversations yet.</p>';
                    return;
                }

                listEl.innerHTML = '';
                for (const c of convos) {
                    const peer = c.peer;
                    const peerName = getDisplayName(peer, peer.username || peer.email);
                    const row = document.createElement('div');
                    row.className = 'inbox-item';
                    row.innerHTML = `
                        <img class="avatar" src="${peer.pfp_url || DEFAULT_PFP}" alt="">
                        <div class="inbox-info">
                            <div class="inbox-name">${escapeHtml(peerName)}${renderVerifiedBadge(peer.verified)}</div>
                            <div class="inbox-preview">${escapeHtml(formatInboxPreviewText(c.last_message))}</div>
                        </div>
                    `;
                    row.addEventListener('click', () => openChatWithPeer(peer));
                    listEl.appendChild(row);
                }

                const params = new URLSearchParams(window.location.search);
                const openPeerParam = params.get('peer');
                if (openPeerParam) {
                    const match = convos.find(c =>
                        c.peer.email.toLowerCase() === openPeerParam.toLowerCase() ||
                        (c.peer.username && c.peer.username.toLowerCase() === openPeerParam.toLowerCase())
                    );
                    if (match) {
                        openChatWithPeer(match.peer);
                    }
                }
            } catch (err) {
                listEl.innerHTML = '<p style="color:#ef4444;text-align:center;padding:20px;">Failed to load messages.</p>';
            }
        }

        loadInbox();
    </script>
</body>
</html>
