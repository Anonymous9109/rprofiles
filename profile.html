<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nvaritia - Profile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #ffffff; color: #111; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; display: flex; flex-direction: column; min-height: 100vh; padding-top: 48px; padding-bottom: 54px; }
        header, footer { background: #ffffff; border-color: #e5e5e5; position: fixed; left: 0; width: 100%; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
        header { border-bottom: 1px solid #e5e5e5; height: 48px; top: 0; }
        footer { border-top: 1px solid #e5e5e5; height: 50px; bottom: 0; justify-content: space-around; }
        .brand { font-size: 18px; font-weight: bold; color: #111; text-decoration: none; }
        .wrapper { width: 100%; max-width: 680px; margin: 0 auto; padding: 16px; flex-grow: 1; }
        .footer-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; text-decoration: none; font-size: 10px; font-weight: 600; gap: 2px; }
        .footer-tab.active { color: #000; }
        .footer-icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .footer-tab.active .footer-icon { stroke: #000; }
        .profile-header-card { display: flex; gap: 16px; align-items: center; background: #fff; border: 1px solid #e5e5e5; border-radius: 6px; padding: 16px; margin-bottom: 12px; }
        .pfp-container { position: relative; width: 86px; height: 86px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .story-ring-wrapper { position: relative; width: 82px; height: 82px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .story-ring-wrapper.has-story { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); padding: 3px; }
        .profile-pfp { width: 76px; height: 76px; object-fit: cover; border-radius: 50%; border: 1px solid #e5e5e5; background: #f0f0f0; display: block; }
        .add-story-badge { position: absolute; bottom: 0px; left: 0px; width: 26px; height: 26px; background: #000; color: #fff; border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; cursor: pointer; z-index: 10; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        .profile-info { display: flex; flex-direction: column; gap: 6px; flex-grow: 1; min-width: 0; }
        .profile-name { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 6px; color: #111; }
        .profile-stats { display: flex; gap: 16px; font-size: 13px; color: #333; margin: 2px 0; }
        .profile-stats div { cursor: pointer; }
        .profile-stats strong { font-weight: bold; color: #111; }
        .users-drawer { position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100dvh; background: #fff; border-left: 1px solid #e5e5e5; box-shadow: -4px 0 16px rgba(0,0,0,0.1); z-index: 2000; transition: right 0.3s ease-in-out; display: flex; flex-direction: column; }
        .users-drawer.open { right: 0; }
        .users-drawer-header { height: 48px; padding: 0 16px; background: #fafafa; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; font-weight: bold; font-size: 15px; }
        .users-drawer-body { flex-grow: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .user-row-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 6px; text-decoration: none; color: inherit; border-bottom: 1px solid #eee; }
        .user-row-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid #e5e5e5; background: #f0f0f0; flex-shrink: 0; }
        .user-row-name { font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 4px; }
        .upload-progress-panel { background: #fff; border: 1px solid #e5e5e5; border-radius: 6px; padding: 12px; margin-bottom: 12px; display: none; }
        .upload-progress-text { font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #111; }
        .upload-progress-track { width: 100%; height: 6px; background: #e5e5e5; border-radius: 3px; overflow: hidden; }
        .upload-progress-fill { width: 0%; height: 100%; background: #000; transition: width 0.15s ease; }
        .panel { border: 1px solid #e5e5e5; border-radius: 6px; margin-bottom: 12px; overflow: hidden; }
        .panel-header { background: #fafafa; border-bottom: 1px solid #e5e5e5; padding: 6px 10px; font-weight: bold; }
        .panel-content { padding: 10px; }
        .btn-app { background: #000; border: 1px solid #000; border-radius: 4px; color: #fff; font-weight: 600; padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
        .btn-app-secondary { background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 6px 12px; cursor: pointer; text-align: center; font-weight: 600; text-decoration: none; display: inline-block; color: #111; }
        .post-box { border-top: 1px solid #e5e5e5; padding: 12px 0; }
        .post-box:first-child { border-top: none; }
        .post-header-line { display: flex; align-items: center; gap: 10px; margin-top: 8px; margin-bottom: 8px; }
        .feed-avatar-container { position: relative; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .feed-avatar-container.has-story { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); padding: 2px; }
        .post-avatar { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #e5e5e5; object-fit: cover; display: block; background: #f0f0f0; }
        .post-meta { font-weight: 600; color: #111; text-decoration: none; display: inline-block; padding: 2px 0; }
        .post-meta:hover { text-decoration: underline; }
        .post-text { font-size: 13px; margin-top: 6px; margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; }
        .post-timestamp { color: #666; font-size: 10px; }
        .post-media { max-width: 100%; max-height: 350px; border-radius: 6px; border: 1px solid #e5e5e5; margin-bottom: 4px; display: block; }
        .post-actions { display: flex; justify-content: space-between; margin-top: 8px; align-items: center; font-size: 12px; }
        .reaction-group { display: flex; gap: 10px; align-items: center; }
        .reaction-btn { background: #ffffff; border: 1px solid #cccccc; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: #111111; user-select: none; }
        .reaction-icon { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .reaction-btn.active-like { background: #000000; color: #ffffff; border-color: #000000; }
        .reaction-btn.active-like .reaction-icon { fill: #ffffff; stroke: #ffffff; }
        .reaction-btn.active-dislike { background: #ef4444; color: #ffffff; border-color: #ef4444; }
        .reaction-btn.active-dislike .reaction-icon { fill: #ffffff; stroke: #ffffff; }
        .safety-actions { display: flex; gap: 8px; align-items: center; }
        .safety-btn { background: none; border: none; color: #777; cursor: pointer; font-size: 11px; font-weight: 600; padding: 2px 4px; user-select: none; }
        .safety-btn:hover { color: #ef4444; text-decoration: underline; }
        .delete-btn { color: #ef4444; cursor: pointer; font-size: 11px; font-weight: 600; user-select: none; }
        .loading-spinner { text-align: center; padding: 20px; color: #666; font-weight: 600; }
        .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 14px; }
        .modal-window { width: 100%; max-width: 440px; background: #fff; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; max-height: 85vh; }
        .modal-header { background: #f0f0f0; padding: 10px 14px; font-weight: bold; display: flex; justify-content: space-between; border-bottom: 1px solid #e5e5e5; }
        .modal-body { padding: 14px; display: flex; flex-direction: column; flex-grow: 1; min-height: 0; }
        .form-row { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
        .form-row textarea, .form-row input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .error-msg { background: #fee2e2; border: 1px solid #ef4444; color: #b91c1c; padding: 8px; border-radius: 4px; margin-bottom: 12px; font-weight: 600; display: none; }
        .mutual-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 4px; }
        .mutual-item { display: flex; flex-direction: column; align-items: center; width: 58px; flex-shrink: 0; text-decoration: none; color: inherit; }
        .mutual-pfp { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 1px solid #e5e5e5; background: #f0f0f0; }
        .mutual-name { font-size: 10px; font-weight: 600; margin-top: 4px; max-width: 58px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
        .pfp-pick-btn { display: inline-block; background: #000; color: #fff; border: 1px solid #000; border-radius: 8px; padding: 10px 14px; font-weight: 600; font-size: 13px; text-align: center; cursor: pointer; user-select: none; }
        .pfp-pick-btn input[type="file"] { display: none; }
    </style>
</head>
<body>
    <input type="file" id="story-file-input" accept="video/*" style="display: none;" onchange="handleStoryUpload(this)">
    <header><a href="feed.html" class="brand">Nvaritia</a></header>
    <div class="wrapper">
        <div class="profile-header-card">
            <div class="pfp-container">
                <div id="story-ring-container" class="story-ring-wrapper" onclick="openProfileStory()">
                    <img id="pfp-img" class="profile-pfp" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'></svg>">
                </div>
                <div id="add-story-btn" class="add-story-badge" title="Post a Story" onclick="triggerStoryUpload()">+</div>
            </div>
            <div class="profile-info">
                <div class="profile-name" id="username-display">Loading profile...</div>
                <div class="profile-stats">
                    <div onclick="openUsersDrawer('followers')"><strong id="followers-count">0</strong> followers</div>
                    <div onclick="openUsersDrawer('following')"><strong id="following-count">0</strong> following</div>
                </div>
                <div id="verification-btn-container"></div>
            </div>
        </div>
        <div id="story-upload-progress" class="upload-progress-panel">
            <div id="story-upload-status-text" class="upload-progress-text">Uploading story... (0%)</div>
            <div class="upload-progress-track">
                <div id="story-upload-bar" class="upload-progress-fill"></div>
            </div>
        </div>
        <div class="panel">
            <div class="panel-header">Bio</div>
            <div class="panel-content" id="bio-display">No bio provided.</div>
        </div>
        <div id="owner-controls" style="display: none; gap: 8px; margin-bottom: 12px;"></div>
        <div id="mutual-friends" style="display: none;"></div>
        <div class="panel">
            <div class="panel-header" id="posts-header">Posts</div>
            <div class="panel-content" id="posts-container"><div class="loading-spinner">Loading posts...</div></div>
        </div>
    </div>
    <div id="users-drawer" class="users-drawer">
        <div class="users-drawer-header">
            <span id="users-drawer-title">Users</span>
            <span style="cursor: pointer; font-size: 18px;" onclick="closeUsersDrawer()">✕</span>
        </div>
        <div class="users-drawer-body" id="users-drawer-list"><div class="loading-spinner">Loading...</div></div>
    </div>
    <footer>
        <a href="feed.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Home
        </a>
        <a href="create-post.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Post
        </a>
        <a href="messages.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Messages
        </a>
        <a href="profile.html" class="footer-tab active">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Profile
        </a>
    </footer>
    <div id="edit-modal" class="modal">
        <div class="modal-window">
            <div class="modal-header">
                <span>Edit Profile</span>
                <span style="cursor: pointer;" onclick="closeModal('edit-modal')">✕</span>
            </div>
            <div class="modal-body">
                <div id="edit-error" class="error-msg"></div>
                <form onsubmit="saveProfile(event)">
                    <div class="form-row">
                        <label>Username:</label>
                        <input type="text" id="edit-username" required>
                    </div>
                    <div class="form-row">
                        <label>Bio:</label>
                        <textarea id="edit-bio"></textarea>
                    </div>
                    <div class="form-row">
                        <label>PFP Image (Max 25MB):</label>
                        <label class="pfp-pick-btn">
                            Choose Image
                            <input type="file" id="edit-pfp" accept="image/*" onchange="document.getElementById('pfp-file-name').innerText = this.files[0] ? this.files[0].name : ''">
                        </label>
                        <span id="pfp-file-name" style="font-size: 11px; color: #666;"></span>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button type="submit" class="btn-app-secondary" style="flex: 1; background: #000; color: #fff;">Save</button>
                        <button type="button" class="btn-app-secondary" onclick="closeModal('edit-modal')">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="app.js?v=4"></script>
    <script>
        const loggedUser = requireAuth(true);
        const urlParams = new URLSearchParams(window.location.search);
        const guestNoTarget = loggedUser.guest && !urlParams.get('user');
        if (guestNoTarget) promptSignup('view your profile');
        const targetIdentifier = urlParams.get('user') || loggedUser.username || loggedUser.email;
        let activeProfileUser = null;
        let activeStory = null;
        let isFollowingActiveUser = false;
        let profileFollowData = { followers: [], following: [] };

        async function loadProfile() {
            document.getElementById('mutual-friends').style.display = 'none';
            try {
                const viewerParam = loggedUser && !loggedUser.guest ? `?viewer=${encodeURIComponent(loggedUser.email)}` : '';
                const res = await fetch(`${WORKER_ORIGIN}/api/profile/${encodeURIComponent(targetIdentifier)}${viewerParam}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                activeProfileUser = data.user;
                activeStory = data.story || null;
                isFollowingActiveUser = data.is_following;
                profileFollowData = {
                    followers: data.followers || [],
                    following: data.following || []
                };

                document.getElementById('username-display').innerHTML = `<span>@${escapeHtml(activeProfileUser.username || activeProfileUser.email)}</span>${renderVerifiedBadge(activeProfileUser.verified)}`;
                document.getElementById('bio-display').innerText = activeProfileUser.bio || 'No bio provided.';
                if (activeProfileUser.pfp_url) document.getElementById('pfp-img').src = activeProfileUser.pfp_url;

                document.getElementById('followers-count').innerText = data.followers_count;
                document.getElementById('following-count').innerText = data.following_count;

                const isOwner = !loggedUser.guest && activeProfileUser.email.toLowerCase() === loggedUser.email.toLowerCase();
                document.getElementById('add-story-btn').style.display = isOwner ? 'flex' : 'none';

                const ringContainer = document.getElementById('story-ring-container');
                if (activeStory) ringContainer.classList.add('has-story');
                else ringContainer.classList.remove('has-story');

                const verificationBtnContainer = document.getElementById('verification-btn-container');
                const controlsEl = document.getElementById('owner-controls');
                controlsEl.style.display = 'flex';

                if (isOwner) {
                    applyTheme(activeProfileUser.theme);
                    
                    // Hide external payment verification button inside the Android WebView app
                    const isNativeApp = navigator.userAgent.includes("NvaritiaApp");
                    if (!activeProfileUser.verified && !isNativeApp) {
                        verificationBtnContainer.innerHTML = `<a href="verify.html" class="btn-app" style="background:#3b82f6; border-color:#3b82f6; font-size:11px; padding:4px 10px; display:inline-block; text-align:center; width:fit-content;">Get Verified</a>`;
                    } else {
                        verificationBtnContainer.innerHTML = '';
                    }

                    controlsEl.innerHTML = `
                        <button type="button" class="btn-app-secondary" style="flex: 1;" onclick="openModal('edit-modal')">Edit Profile</button>
                        <a href="settings.html" class="btn-app-secondary" style="flex: 1; text-align: center;">Settings</a>
                    `;
                    document.getElementById('edit-username').value = activeProfileUser.username || '';
                    document.getElementById('edit-bio').value = activeProfileUser.bio || '';
                } else {
                    verificationBtnContainer.innerHTML = '';
                    if (data.isBlocked) {
                        controlsEl.innerHTML = `<button type="button" class="btn-app-secondary" style="width: 100%; padding: 8px;" onclick="unblockUser('${escapeHtml(activeProfileUser.email)}')">Unblock User</button>`;
                        document.getElementById('posts-container').innerHTML = '<p style="color: #666; padding: 10px;">You have blocked this user.</p>';
                        return;
                    } else {
                        let fStatus = 'none';
                        if (!loggedUser.guest) {
                            try {
                                const fr = await fetch(`${WORKER_ORIGIN}/api/friends/status?viewer=${encodeURIComponent(loggedUser.email)}&target=${encodeURIComponent(activeProfileUser.email)}`);
                                if (fr.ok) fStatus = (await fr.json()).status;
                            } catch (e) {}
                        }
                        const followBtnText = isFollowingActiveUser ? 'Unfollow' : 'Follow';
                        const followBtnStyle = isFollowingActiveUser ? 'background: #fff; color: #111; border: 1px solid #ccc;' : 'background: #000; color: #fff; border: 1px solid #000;';

                        controlsEl.innerHTML = `
                            <button type="button" id="friend-btn" class="btn-app" style="flex: 1; padding: 8px;">Friend Request</button>
                            <button type="button" id="follow-btn" class="btn-app" style="flex: 1; padding: 8px; ${followBtnStyle}" onclick="toggleFollow()">${followBtnText}</button>
                            <button type="button" class="btn-app-secondary" style="padding: 8px; color: #ef4444;" onclick="blockUser('${escapeHtml(activeProfileUser.email)}', '${escapeHtml(activeProfileUser.username || '')}', loadProfile)">Block</button>
                        `;
                        setFriendButton(fStatus);
                        if (!loggedUser.guest) loadMutualFriends();
                    }
                }

                document.getElementById('posts-header').innerText = isOwner ? 'My Posts' : `${activeProfileUser.username || 'User'}'s Posts`;
                const container = document.getElementById('posts-container');
                await renderPosts(data.posts, container, {
                    clear: true,
                    fallbackAuthor: activeProfileUser
                });
            } catch (e) {
                document.getElementById('username-display').innerText = 'User not found or offline';
                document.getElementById('posts-container').innerHTML = '';
            }
        }

        async function openUsersDrawer(type) {
            const drawer = document.getElementById('users-drawer');
            const titleEl = document.getElementById('users-drawer-title');
            const listEl = document.getElementById('users-drawer-list');
            titleEl.innerText = type === 'followers' ? 'Followers' : 'Following';
            drawer.classList.add('open');
            listEl.innerHTML = '<div class="loading-spinner">Loading...</div>';
            const emailArray = profileFollowData[type] || [];
            if (!emailArray.length) { listEl.innerHTML = `<p style="color: #666; text-align: center; padding: 20px; font-size: 13px;">No ${type} yet.</p>`; return; }
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/users/list?emails=${encodeURIComponent(emailArray.join(','))}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                const users = data.users || [];
                const placeholder = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><rect width='100%' height='100%' fill='%23f0f0f0'/></svg>";
                listEl.innerHTML = users.map(u => `
                    <a class="user-row-item" href="profile.html?user=${encodeURIComponent(u.username)}">
                        <img class="user-row-avatar" src="${u.pfp_url || placeholder}">
                        <div class="user-row-name">@${escapeHtml(u.username)}${renderVerifiedBadge(u.verified)}</div>
                    </a>
                `).join('');
            } catch (err) { listEl.innerHTML = '<p style="color: red; text-align: center; padding: 20px; font-size: 13px;">Failed to load list.</p>'; }
        }

        function closeUsersDrawer() { document.getElementById('users-drawer').classList.remove('open'); }

        async function toggleFollow() {
            if (loggedUser.guest) return promptSignup('follow users');
            const endpoint = isFollowingActiveUser ? '/api/users/unfollow' : '/api/users/follow';
            try {
                const res = await fetch(`${WORKER_ORIGIN}${endpoint}`, {
                    method: 'POST',
                    headers: authHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ targetEmail: activeProfileUser.email })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                isFollowingActiveUser = data.is_following;
                const btn = document.getElementById('follow-btn');
                if (isFollowingActiveUser) {
                    btn.innerText = 'Unfollow';
                    btn.style.background = '#fff'; btn.style.color = '#111'; btn.style.border = '1px solid #ccc';
                    if (!profileFollowData.followers.includes(loggedUser.email.toLowerCase())) profileFollowData.followers.push(loggedUser.email.toLowerCase());
                } else {
                    btn.innerText = 'Follow';
                    btn.style.background = '#000'; btn.style.color = '#fff'; btn.style.border = '1px solid #000';
                    profileFollowData.followers = profileFollowData.followers.filter(e => e !== loggedUser.email.toLowerCase());
                }
                const countElem = document.getElementById('followers-count');
                let current = parseInt(countElem.innerText, 10) || 0;
                countElem.innerText = isFollowingActiveUser ? current + 1 : Math.max(0, current - 1);
            } catch (err) { showToast(err.message); }
        }

        function triggerStoryUpload() {
            if (loggedUser.guest) return promptSignup('post a story');
            document.getElementById('story-file-input').click();
        }

        function uploadStoryWithProgress(file, onProgress) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', `${WORKER_ORIGIN}/api/stories/create`);
                const headers = authHeaders();
                for (const key in headers) xhr.setRequestHeader(key, headers[key]);
                xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100)); };
                xhr.onload = () => {
                    try {
                        const data = JSON.parse(xhr.responseText);
                        if (xhr.status >= 200 && xhr.status < 300) resolve(data);
                        else reject(new Error(data.error || 'Failed'));
                    } catch (err) { reject(new Error('Invalid response')); }
                };
                xhr.onerror = () => reject(new Error('Network error'));
                const formData = new FormData();
                formData.append('media', file);
                xhr.send(formData);
            });
        }

        async function handleStoryUpload(input) {
            let file = input.files[0];
            if (!file) return;
            if (!file.type.startsWith('video/')) { showToast("Stories must be video files."); input.value = ''; return; }
            const video = document.createElement('video');
            video.preload = 'metadata'; video.muted = true; video.playsInline = true;
            video.onloadedmetadata = async function() {
                window.URL.revokeObjectURL(video.src);
                if (video.duration > 30.5) { showToast("Story video cannot exceed 30 seconds."); input.value = ''; return; }
                const progressBox = document.getElementById('story-upload-progress');
                const progressBar = document.getElementById('story-upload-bar');
                const progressText = document.getElementById('story-upload-status-text');
                progressBox.style.display = 'block'; progressBar.style.width = '0%'; progressText.innerText = 'Uploading story... (0%)';
                try {
                    await uploadStoryWithProgress(file, (p) => { progressBar.style.width = p + '%'; progressText.innerText = `Uploading story... (${p}%)`; });
                    showToast("Story posted successfully!");
                    loadProfile();
                } catch (err) { showToast(err.message); }
                finally { progressBox.style.display = 'none'; input.value = ''; }
            };
            video.onerror = function() { window.URL.revokeObjectURL(video.src); showToast("Could not read video."); input.value = ''; };
            video.src = URL.createObjectURL(file);
        }

        function openProfileStory() {
            if (!activeStory) {
                if (!loggedUser.guest && activeProfileUser && activeProfileUser.email.toLowerCase() === loggedUser.email.toLowerCase()) triggerStoryUpload();
                return;
            }
            openStory({ mediaUrl: activeStory.media_url, createdAt: activeStory.created_at, ownerEmail: activeProfileUser.email, onDeleted: loadProfile });
        }

        function setFriendButton(status) {
            const btn = document.getElementById('friend-btn');
            if (!btn || !activeProfileUser) return;
            btn.disabled = false; btn.style.opacity = '1';
            if (status === 'friends') {
                btn.innerText = 'Message';
                btn.onclick = () => { location.href = `messages.html?user=${encodeURIComponent(activeProfileUser.username || activeProfileUser.email)}`; };
            } else if (status === 'sent') {
                btn.innerText = 'Request Sent'; btn.disabled = true; btn.style.opacity = '0.6'; btn.onclick = null;
            } else if (status === 'received') {
                btn.innerText = 'Respond to Request'; btn.onclick = () => { location.href = 'messages.html'; };
            } else {
                btn.innerText = 'Friend Request'; btn.onclick = sendFriendRequest;
            }
        }

        async function sendFriendRequest() {
            if (loggedUser.guest) return promptSignup('send friend requests');
            const btn = document.getElementById('friend-btn');
            btn.disabled = true; btn.style.opacity = '0.6';
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/friends/request`, {
                    method: 'POST',
                    headers: authHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ addresseeEmail: activeProfileUser.email })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                setFriendButton(data.status);
                if (data.status === 'friends') loadMutualFriends();
            } catch (err) { setFriendButton('none'); showToast(err.message); }
        }

        async function loadMutualFriends() {
            const box = document.getElementById('mutual-friends');
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/friends/mutual?viewer=${encodeURIComponent(loggedUser.email)}&target=${encodeURIComponent(activeProfileUser.email)}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                const list = data.mutual || [];
                const placeholder = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44'><rect width='100%' height='100%' fill='%23f0f0f0'/></svg>";
                box.innerHTML = `
                    <div class="panel">
                        <div class="panel-header">Mutual Friends (${list.length})</div>
                        <div class="panel-content">
                            ${list.length ? `<div class="mutual-row">${list.map(f => `
                                <a class="mutual-item" href="profile.html?user=${encodeURIComponent(f.username)}">
                                    <img class="mutual-pfp" src="${f.pfp_url || placeholder}">
                                    <span class="mutual-name">${escapeHtml(f.username)}</span>
                                </a>`).join('')}</div>` : '<span style="color: #666;">No mutual friends yet.</span>'}
                        </div>
                    </div>
                `;
                box.style.display = 'block';
            } catch (e) { box.style.display = 'none'; }
        }

        async function unblockUser(targetEmail) {
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/users/unblock`, {
                    method: 'POST',
                    headers: authHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ blockedEmail: targetEmail })
                });
                if (!res.ok) throw new Error('Failed');
                showToast("User unblocked");
                loadProfile();
            } catch (err) { showToast(err.message); }
        }

        async function saveProfile(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('username', document.getElementById('edit-username').value.trim());
            formData.append('bio', document.getElementById('edit-bio').value.trim());
            const file = document.getElementById('edit-pfp').files[0];
            if (file) formData.append('pfp', typeof compressImage === 'function' ? await compressImage(file, 512) : file);
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/profile/update`, { method: 'POST', headers: authHeaders(), body: formData });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                setSessionUser(data.user, data.token);
                closeModal('edit-modal');
                window.location.href = `profile.html?user=${encodeURIComponent(data.user.username || data.user.email)}`;
            } catch (err) {
                const el = document.getElementById('edit-error');
                el.innerText = err.message; el.style.display = 'block';
            }
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        if (!guestNoTarget) loadProfile();
    </script>
</body>
</html>
