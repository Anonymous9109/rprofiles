<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rprofiles - Settings</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #ffffff; color: #111; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; display: flex; flex-direction: column; min-height: 100vh; padding-top: 48px; padding-bottom: 54px; }
        header, footer { background: #ffffff; border-color: #e5e5e5; position: fixed; left: 0; width: 100%; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
        header { border-bottom: 1px solid #e5e5e5; height: 48px; top: 0; }
        footer { border-top: 1px solid #e5e5e5; height: 50px; bottom: 0; justify-content: space-around; }
        .brand { font-size: 18px; font-weight: bold; color: #111; text-decoration: none; }
        .wrapper { width: 100%; max-width: 680px; margin: 0 auto; padding: 16px; flex-grow: 1; display: flex; flex-direction: column; gap: 12px; }
        
        .footer-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; text-decoration: none; font-size: 10px; font-weight: 600; gap: 2px; }
        .footer-tab.active { color: #000; }
        .footer-icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .footer-tab.active .footer-icon { stroke: #000; }

        .settings-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid #e5e5e5; padding-bottom: 4px; }
        .btn-app-secondary { background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 12px; cursor: pointer; text-align: center; font-weight: 600; width: 100%; font-size: 13px; }
        .btn-app-secondary:hover { background: #fafafa; }
        
        /* Modal for blocked users */
        .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 14px; }
        .modal-window { width: 100%; max-width: 440px; background: #fff; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; max-height: 85vh; }
        .modal-header { background: #f0f0f0; padding: 10px 14px; font-weight: bold; display: flex; justify-content: space-between; border-bottom: 1px solid #e5e5e5; }
        .modal-body { padding: 14px; display: flex; flex-direction: column; flex-grow: 1; min-height: 0; overflow-y: auto; }
    </style>
</head>
<body>
    <header><a href="feed.html" class="brand">rprofiles</a></header>

    <div class="wrapper">
        <div class="settings-title">Account Settings</div>
        <button id="theme-btn" class="btn-app-secondary" onclick="toggleTheme()">🌙 Switch to Dark Mode</button>
        <button class="btn-app-secondary" onclick="openBlockedUsersModal()">Manage Blocked Users</button>
        <button class="btn-app-secondary" onclick="logout()">Logout</button>
        <hr style="border:none; border-top:1px solid #e5e5e5; margin: 8px 0;">
        <button class="btn-app-secondary" style="background: #ef4444; color: #fff; border-color: #ef4444;" onclick="deleteAccount()">Delete Account & Data</button>
    </div>

    <!-- BLOCKED USERS MODAL -->
    <div id="blocked-modal" class="modal">
        <div class="modal-window">
            <div class="modal-header">
                <span>Blocked Users</span>
                <span style="cursor: pointer;" onclick="closeBlockedModal()">✕</span>
            </div>
            <div class="modal-body" id="blocked-list">Loading...</div>
        </div>
    </div>

    <footer>
        <a href="feed.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Home
        </a>
        <a href="create-post.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Post
        </a>
        <a href="messages.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Messages
        </a>
        <a href="profile.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Profile
        </a>
    </footer>

    <script src="app.js"></script>
    <script>
        const loggedUser = requireAuth();

        async function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            const next = isDark ? 'light' : 'dark';
            try {
                await saveTheme(loggedUser.email, next);
                loggedUser.theme = next;
                setSessionUser({ ...loggedUser, theme: next });
            } catch (err) {
                applyTheme(isDark ? 'dark' : 'light');
                showToast(err.message);
            }
        }

        async function openBlockedUsersModal() {
            document.getElementById('blocked-modal').style.display = 'flex';
            const list = document.getElementById('blocked-list');
            list.innerHTML = 'Loading...';
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/users/blocked?email=${encodeURIComponent(loggedUser.email)}`);
                const data = await res.json();
                if (!data.blocked.length) {
                    list.innerHTML = '<p style="color:#666;">No blocked users.</p>';
                    return;
                }
                list.innerHTML = data.blocked.map(u => `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #eee;">
                        <span>@${escapeHtml(u.username || u.email)}</span>
                        <button class="btn-app-secondary" style="width: auto; padding: 6px 12px;" onclick="unblockUser('${escapeHtml(u.email)}')">Unblock</button>
                    </div>
                `).join('');
            } catch (e) {
                list.innerHTML = '<p style="color:red;">Failed to load blocked users.</p>';
            }
        }

        function closeBlockedModal() {
            document.getElementById('blocked-modal').style.display = 'none';
        }

        async function unblockUser(targetEmail) {
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/users/unblock`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ blockerEmail: loggedUser.email, blockedEmail: targetEmail })
                });
                if (!res.ok) throw new Error('Failed to unblock');
                showToast("User unblocked");
                openBlockedUsersModal();
            } catch (err) {
                showToast(err.message);
            }
        }

        async function deleteAccount() {
            if (!confirm("Are you sure you want to permanently delete your account, posts, photos, and messages? This action cannot be undone.")) return;
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/account/delete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: loggedUser.email })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to delete account');
                showToast("Account deleted.");
                logout();
            } catch (err) {
                showToast(err.message);
            }
        }
    </script>
</body>
</html>
