<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nvaritia - Home Feed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #ffffff; color: #111; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; display: flex; flex-direction: column; min-height: 100vh; padding-top: 56px; padding-bottom: 54px; }
        header, footer { background: #ffffff; border-color: #e5e5e5; position: fixed; left: 0; width: 100%; z-index: 100; padding: 0 16px; }
        header { border-bottom: 1px solid #e5e5e5; top: 0; display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; padding-top: 8px; }
        .header-top { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        footer { border-top: 1px solid #e5e5e5; height: 50px; bottom: 0; display: flex; align-items: center; justify-content: space-around; }
        .brand { font-size: 18px; font-weight: bold; color: #111; text-decoration: none; }
        .wrapper { width: 100%; max-width: 680px; margin: 0 auto; padding: 16px; flex-grow: 1; }
        
        .footer-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; text-decoration: none; font-size: 10px; font-weight: 600; gap: 2px; background: none; border: none; cursor: pointer; }
        .footer-tab.active { color: #000; }
        .footer-icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .footer-tab.active .footer-icon { stroke: #000; }

        /* Search Slide-out Drawer Styles */
        .search-drawer { position: fixed; top: 0; right: -100%; width: 100%; height: 100vh; background: #fff; z-index: 2000; transition: right 0.3s ease-in-out; display: flex; flex-direction: column; }
        .search-drawer.open { right: 0; }
        .search-drawer-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #e5e5e5; }
        .search-back-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; padding: 4px; color: inherit; }
        .search-drawer-input { flex-grow: 1; border: none; font-size: 14px; outline: none; background: transparent; }
        
        .search-filters { display: flex; border-bottom: 1px solid #e5e5e5; background: #fafafa; }
        .filter-tab { flex: 1; text-align: center; padding: 10px; font-weight: 600; font-size: 12px; color: #666; cursor: pointer; border-bottom: 2px solid transparent; user-select: none; }
        .filter-tab.active { color: #000; border-bottom-color: #000; background: #fff; }
        
        .search-results-body { flex-grow: 1; overflow-y: auto; padding: 16px; }

        .post-box, .user-result-box { border-top: 1px solid #e5e5e5; padding: 12px 0; }
        .post-box.highlighted { background: #fafafa; border: 1px solid #ccc; border-radius: 6px; padding: 12px; }
        .post-header-line { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        
        .feed-avatar-container { position: relative; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .feed-avatar-container.has-story { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); padding: 2px; }
        .post-avatar { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #e5e5e5; object-fit: cover; display: block; background: #f0f0f0; }
        
        .post-meta { font-weight: 600; color: #111; text-decoration: none; display: inline-block; padding: 2px 0; }
        .post-meta:hover { text-decoration: underline; }
        .post-timestamp { color: #666; font-size: 10px; }
        .post-text { font-size: 13px; margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; }
        .post-media { max-width: 100%; max-height: 400px; border-radius: 6px; border: 1px solid #e5e5e5; margin-top: 6px; }
        
        .post-actions { display: flex; justify-content: space-between; margin-top: 8px; align-items: center; font-size: 12px; }
        .reaction-group { display: flex; gap: 10px; align-items: center; }
        .reaction-btn { background: #ffffff; border: 1px solid #cccccc; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: #111111; user-select: none; }
        .reaction-icon { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .reaction-btn.active-like { background: #000000; color: #ffffff; border-color: #000000; }
        .reaction-btn.active-like .reaction-icon { fill: #ffffff; stroke: #ffffff; }
        .reaction-btn.active-dislike { background: #ef4444; color: #ffffff; border-color: #ef4444; }
        .reaction-btn.active-dislike .reaction-icon { fill: #ffffff; stroke: #ffffff; }

        .safety-actions { display: flex; gap: 8px; align-items: center; }
        .safety-btn { background: none; border: none; color: #777; cursor: pointer; font-size: 11px; font-weight: 600; padding: 2px 4px; user-select: none; }
        .safety-btn:hover { color: #ef4444; text-decoration: underline; }

        .delete-btn { color: #ef4444; cursor: pointer; font-size: 11px; font-weight: 600; user-select: none; }

        .btn-app { background: #000; border: 1px solid #000; border-radius: 4px; color: #fff; font-weight: 600; padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
        .loading-spinner { text-align: center; padding: 20px; color: #666; font-weight: 600; }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <a href="feed.html" class="brand">Nvaritia</a>
        </div>
    </header>

    <div class="wrapper">
        <div id="feed-container"><div class="loading-spinner">Loading posts...</div></div>
    </div>

    <!-- Sliding Search Drawer -->
    <div id="search-drawer" class="search-drawer">
        <div class="search-drawer-header">
            <button type="button" class="search-back-btn" onclick="closeSearchDrawer()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            <input type="text" id="drawer-search-input" class="search-drawer-input" placeholder="Search Nvaritia..." oninput="handleSearch(this.value)">
        </div>
        <div class="search-filters">
            <div class="filter-tab active" id="filter-posts-tab" onclick="setSearchFilter('posts')">Posts</div>
            <div class="filter-tab" id="filter-users-tab" onclick="setSearchFilter('users')">Users</div>
        </div>
        <div class="search-results-body" id="search-results-container">
            <p style="color: #666; text-align: center; padding-top: 20px;">Type something to search...</p>
        </div>
    </div>

    <footer>
        <a href="feed.html" class="footer-tab active">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Home
        </a>
        <a href="create-post.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Post
        </a>
        <button type="button" class="footer-tab" onclick="openSearchDrawer()">
            <svg class="footer-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            Search
        </button>
        <a href="messages.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Messages
        </a>
        <a href="profile.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Profile
        </a>
    </footer>

    <script src="app.js?v=2"></script>
    <script>
        const currentUser = requireAuth(true);
        let currentSearchFilter = 'posts';
        let lastSearchQuery = '';

        function goToProfile(url, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            window.location.href = url;
        }

        function openSearchDrawer() {
            document.getElementById('search-drawer').classList.add('open');
            document.getElementById('drawer-search-input').focus();
        }

        function closeSearchDrawer() {
            document.getElementById('search-drawer').classList.remove('open');
        }

        function setSearchFilter(filter) {
            currentSearchFilter = filter;
            document.getElementById('filter-posts-tab').className = `filter-tab ${filter === 'posts' ? 'active' : ''}`;
            document.getElementById('filter-users-tab').className = `filter-tab ${filter === 'users' ? 'active' : ''}`;
            if (lastSearchQuery.trim()) {
                handleSearch(lastSearchQuery);
            }
        }

        const activeViewTimers = new Map();
        const postObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const postId = entry.target.getAttribute('data-post-id');
                if (!postId) return;

                if (entry.isIntersecting && entry.intersectionRatio >= 0.75) {
                    if (!activeViewTimers.has(postId)) {
                        activeViewTimers.set(postId, {
                            startTime: Date.now(),
                            timer: setTimeout(() => {
                                recordPostView(postId, 3000, true);
                            }, 3000)
                        });
                    }
                } else {
                    if (activeViewTimers.has(postId)) {
                        const data = activeViewTimers.get(postId);
                        clearTimeout(data.timer);
                        const durationMs = Date.now() - data.startTime;
                        if (durationMs > 500) {
                            recordPostView(postId, durationMs, durationMs >= 3000);
                        }
                        activeViewTimers.delete(postId);
                    }
                }
            });
        }, { threshold: [0.75] });

        async function recordPostView(postId, durationMs, completed) {
            if (!navigator.onLine) return;
            try {
                await fetch(`${WORKER_ORIGIN}/api/posts/view`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: currentUser ? currentUser.email : null,
                        postId: postId,
                        durationMs: durationMs,
                        completed: completed
                    })
                });
            } catch (err) {}
        }

        const LIKE_SVG = `<svg class="reaction-icon" viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>`;
        const DISLIKE_SVG = `<svg class="reaction-icon" viewBox="0 0 24 24"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg>`;
        const COMMENT_SVG = `<svg class="reaction-icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>`;

        async function loadFeed() {
            const container = document.getElementById('feed-container');
            container.innerHTML = '<div class="loading-spinner">Loading posts...</div>';
            try {
                const feedUrl = currentUser && currentUser.email 
                    ? `${WORKER_ORIGIN}/api/posts/feed?email=${encodeURIComponent(currentUser.email)}`
                    : `${WORKER_ORIGIN}/api/posts/feed`;

                const res = await fetch(feedUrl);
                const data = await res.json();
                try { localStorage.setItem('rprofiles_cached_feed', JSON.stringify(data.posts)); } catch (e) {}
                renderPosts(data.posts);
            } catch (e) {
                const cached = localStorage.getItem('rprofiles_cached_feed');
                if (cached) {
                    renderPosts(JSON.parse(cached));
                } else {
                    container.innerHTML = '<p style="color: #666; padding: 16px; text-align: center;">You are currently offline. Connect to the internet to load new articles and posts.</p>';
                }
            }
        }

        async function handleSearch(query) {
            lastSearchQuery = query;
            const container = document.getElementById('search-results-container');
            if (!query.trim()) {
                container.innerHTML = '<p style="color: #666; text-align: center; padding-top: 20px;">Type something to search...</p>';
                return;
            }
            container.innerHTML = '<div class="loading-spinner">Searching...</div>';
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/search?q=${encodeURIComponent(query)}&email=${encodeURIComponent(currentUser.email)}`);
                const data = await res.json();
                
                container.innerHTML = '';
                
                if (currentSearchFilter === 'users') {
                    if (!data.users || !data.users.length) {
                        container.innerHTML = '<p style="color: #666; padding: 12px; text-align: center;">No users found.</p>';
                        return;
                    }
                    for (const u of data.users) {
                        const profileUrl = `profile.html?user=${encodeURIComponent(u.username)}`;
                        const avatarClickAttr = u.has_story
                            ? `onclick="event.stopPropagation(); viewUserStory('${escapeHtml(u.email)}', '${escapeHtml(u.story_created_at || '')}')"`
                            : `onclick="goToProfile('${profileUrl}', event)"`;

                        const uEl = document.createElement('div');
                        uEl.className = 'user-result-box';
                        uEl.innerHTML = `
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <div class="feed-avatar-container ${u.has_story ? 'has-story' : ''}" ${avatarClickAttr} title="${u.has_story ? 'View Story' : 'View Profile'}">
                                    <img class="post-avatar" src="${u.pfp_url || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'36\' height=\'36\'><rect width=\'100%\' height=\'100%\' fill=\'%23f0f0f0\'/></svg>'}">
                                </div>
                                <span><a href="${profileUrl}" class="post-meta" onclick="goToProfile('${profileUrl}', event)">@${escapeHtml(u.username)}</a>${renderVerifiedBadge(u.verified)}</span>
                            </div>
                        `;
                        container.appendChild(uEl);
                    }
                } else {
                    if (!data.posts || !data.posts.length) {
                        container.innerHTML = '<p style="color: #666; padding: 12px; text-align: center;">No posts found.</p>';
                        return;
                    }
                    renderPosts(data.posts, container, true, true);
                }
            } catch (e) {
                container.innerHTML = '<p style="color: #666; padding: 12px; text-align: center;">Search unavailable offline.</p>';
            }
        }

        async function renderPosts(posts, container = document.getElementById('feed-container'), clear = true, isSearchContext = false) {
            if (clear) container.innerHTML = '';
            if (!posts || (!posts.length && clear)) {
                container.innerHTML = '<p style="color: #666; padding: 12px; text-align: center;">No posts recorded.</p>';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const highlightPostId = urlParams.get('highlight');

            for (const post of posts) {
                const isOwner = currentUser && !currentUser.guest && post.user_email.toLowerCase() === currentUser.email.toLowerCase();
                let rxData = { likes: post.likes_count || 0, dislikes: post.dislikes_count || 0, userReaction: null };
                try {
                    const rxRes = await fetch(`${WORKER_ORIGIN}/api/reactions/get?postId=${post.id}&email=${encodeURIComponent(currentUser.email)}`);
                    if (rxRes.ok) rxData = await rxRes.json();
                } catch (e) {}

                const isHighlighted = highlightPostId === post.id;
                const postEl = document.createElement('div');
                postEl.className = `post-box ${isHighlighted ? 'highlighted' : ''}`;
                postEl.id = `post-${post.id}`;
                postEl.setAttribute('data-post-id', post.id);
                postEl.setAttribute('data-author', post.user_email.toLowerCase());
                
                const formattedContent = escapeHtml(post.content).replace(/@([a-zA-Z0-9_]+)/g, '<a href="profile.html?user=$1" onclick="goToProfile(\'profile.html?user=$1\', event)" style="font-weight:600; color:#000; text-decoration:underline;">@$1</a>');

                const ownerOrSafetyControls = isOwner
                    ? `<div class="delete-btn" onclick="event.stopPropagation(); deletePost('${post.id}')">Delete</div>`
                    : `<div class="safety-actions" onclick="event.stopPropagation()">
                        <div class="safety-btn" onclick="reportPost('${post.id}')">Report</div>
                        <div class="safety-btn" onclick="blockAuthorFromFeed('${escapeHtml(post.user_email)}', '${escapeHtml(post.username || '')}')">Block</div>
                       </div>`;

                const profileUrl = `profile.html?user=${encodeURIComponent(post.username || post.user_email)}`;
                const hasStoryClass = post.has_story ? 'has-story' : '';
                const avatarClickAttr = post.has_story
                    ? `onclick="event.stopPropagation(); viewUserStory('${escapeHtml(post.user_email)}', '${escapeHtml(post.story_created_at || '')}')"`
                    : `onclick="goToProfile('${profileUrl}', event)"`;

                postEl.innerHTML = `
                    <div class="post-header-line">
                        <div class="feed-avatar-container ${hasStoryClass}" ${avatarClickAttr} title="${post.has_story ? 'View Story' : 'View Profile'}">
                            <img class="post-avatar" src="${post.pfp_url || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'36\' height=\'36\'><rect width=\'100%\' height=\'100%\' fill=\'%23f0f0f0\'/></svg>'}">
                        </div>
                        <div style="flex-grow: 1;">
                            <a href="${profileUrl}" class="post-meta" onclick="goToProfile('${profileUrl}', event)">${post.username ? '@' + escapeHtml(post.username) : escapeHtml(post.user_email)}</a>${renderVerifiedBadge(post.verified)}
                            <br><span class="post-timestamp">${new Date(post.created_at).toLocaleString()}</span>
                        </div>
                        ${ownerOrSafetyControls}
                    </div>
                    ${post.content ? `<div class="post-text">${formattedContent}</div>` : ''}
                    ${post.media_url ? `<img class="post-media" src="${post.media_url}">` : ''}
                    <div class="post-actions">
                        <div class="reaction-group">
                            <div class="reaction-btn ${rxData.userReaction === 'like' ? 'active-like' : ''}" onclick="event.stopPropagation(); toggleReaction('${post.id}', 'like')">
                                ${LIKE_SVG} <span id="likes-${post.id}">${rxData.likes}</span>
                            </div>
                            <div class="reaction-btn ${rxData.userReaction === 'dislike' ? 'active-dislike' : ''}" onclick="event.stopPropagation(); toggleReaction('${post.id}', 'dislike')">
                                ${DISLIKE_SVG} <span id="dislikes-${post.id}">${rxData.dislikes}</span>
                            </div>
                        </div>
                        <div class="reaction-btn" onclick="event.stopPropagation(); openCommentsDrawer('${post.id}')">
                            ${COMMENT_SVG} Comments
                        </div>
                    </div>
                `;
                container.appendChild(postEl);
                if (!isSearchContext) {
                    postObserver.observe(postEl);
                }
            }

            if (highlightPostId && !isSearchContext) {
                const target = document.getElementById(`post-${highlightPostId}`);
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        async function viewUserStory(email, createdAt) {
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/stories/get?email=${encodeURIComponent(email)}`);
                const data = await res.json();
                if (res.ok && data.story) {
                    openStory({
                        mediaUrl: data.story.media_url,
                        createdAt: data.story.created_at || createdAt,
                        ownerEmail: email,
                        onDeleted: loadFeed
                    });
                } else {
                    showToast("No active story found.");
                }
            } catch (err) {
                showToast("Failed to load story.");
            }
        }

        function blockAuthorFromFeed(authorEmail, authorUsername) {
            blockUser(authorEmail, authorUsername, () => {
                document.querySelectorAll(`[data-author="${authorEmail.toLowerCase()}"]`).forEach(el => el.remove());
            });
        }

        async function toggleReaction(postId, reactionType) {
            if (currentUser.guest) return promptSignup('like or dislike posts');
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/reactions/toggle`, {
                    method: 'POST',
                    headers: authHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ postId, reaction: reactionType })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                document.getElementById(`likes-${postId}`).innerText = data.likes;
                document.getElementById(`dislikes-${postId}`).innerText = data.dislikes;

                const parent = document.getElementById(`post-${postId}`);
                const buttons = parent.querySelectorAll('.reaction-btn');
                buttons[0].className = `reaction-btn ${data.userReaction === 'like' ? 'active-like' : ''}`;
                buttons[1].className = `reaction-btn ${data.userReaction === 'dislike' ? 'active-dislike' : ''}`;
            } catch (err) {
                showToast(err.message);
            }
        }

        async function deletePost(postId) {
            showConfirmDialog("Delete Post", "Delete this post?", "Delete", async () => {
                try {
                    const res = await fetch(`${WORKER_ORIGIN}/api/posts/delete`, {
                        method: 'POST',
                        headers: authHeaders({ 'Content-Type': 'application/json' }),
                        body: JSON.stringify({ postId })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Failed to delete');
                    document.getElementById(`post-${postId}`)?.remove();
                    showToast("Post deleted");
                } catch (err) {
                    showToast(err.message);
                }
            });
        }

        loadFeed();
    </script>
</body>
</html>
