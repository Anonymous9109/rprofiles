<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rprofiles - Home Feed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #ffffff; color: #111; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; display: flex; flex-direction: column; min-height: 100vh; padding-top: 96px; padding-bottom: 54px; }
        header, footer { background: #ffffff; border-color: #e5e5e5; position: fixed; left: 0; width: 100%; z-index: 100; padding: 0 16px; }
        header { border-bottom: 1px solid #e5e5e5; top: 0; display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; padding-top: 8px; }
        .header-top { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .search-bar { width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
        footer { border-top: 1px solid #e5e5e5; height: 50px; bottom: 0; display: flex; align-items: center; justify-content: space-around; }
        .brand { font-size: 18px; font-weight: bold; color: #111; text-decoration: none; }
        .wrapper { width: 100%; max-width: 680px; margin: 0 auto; padding: 16px; flex-grow: 1; }
        
        .footer-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; text-decoration: none; font-size: 10px; font-weight: 600; gap: 2px; }
        .footer-tab.active { color: #000; }
        .footer-icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .footer-tab.active .footer-icon { stroke: #000; }

        .post-box, .user-result-box { border-top: 1px solid #e5e5e5; padding: 12px 0; }
        .post-box.highlighted { background: #fafafa; border: 1px solid #ccc; border-radius: 6px; padding: 12px; }
        .post-header-line { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .post-avatar { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #e5e5e5; object-fit: cover; }
        .post-meta { font-weight: 600; color: #111; text-decoration: none; }
        .post-meta:hover { text-decoration: underline; }
        .post-timestamp { color: #666; font-size: 10px; }
        .post-text { font-size: 13px; margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; }
        .post-media { max-width: 100%; max-height: 400px; border-radius: 6px; border: 1px solid #e5e5e5; margin-top: 6px; }
        
        .post-actions { display: flex; gap: 10px; margin-top: 8px; align-items: center; font-size: 12px; }
        .reaction-btn { background: #ffffff; border: 1px solid #cccccc; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: #111111; }
        .reaction-icon { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .reaction-btn.active-like { background: #000000; color: #ffffff; border-color: #000000; }
        .reaction-btn.active-like .reaction-icon { fill: #ffffff; stroke: #ffffff; }
        .reaction-btn.active-dislike { background: #ef4444; color: #ffffff; border-color: #ef4444; }
        .reaction-btn.active-dislike .reaction-icon { fill: #ffffff; stroke: #ffffff; }

        .btn-app { background: #000; border: 1px solid #000; border-radius: 4px; color: #fff; font-weight: 600; padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
        .loading-spinner { text-align: center; padding: 20px; color: #666; font-weight: 600; }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <a href="feed.html" class="brand">rprofiles</a>
            <a href="create-post.html" class="btn-app">+ Create Post</a>
        </div>
        <input type="text" id="search-input" class="search-bar" placeholder="Search users or posts..." oninput="handleSearch(this.value)">
    </header>

    <div class="wrapper">
        <div id="feed-container"><div class="loading-spinner">Loading posts...</div></div>
    </div>

    <footer>
        <a href="feed.html" class="footer-tab active">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Home
        </a>
        <a href="create-post.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Post
        </a>
        <a href="messages.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Messages
        </a>
        <a href="profile.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Profile
        </a>
    </footer>

    <script src="app.js"></script>
    <script>
        const currentUser = requireAuth();
        const LIKE_SVG = `<svg class="reaction-icon" viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>`;
        const DISLIKE_SVG = `<svg class="reaction-icon" viewBox="0 0 24 24"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg>`;

        async function loadFeed() {
            const container = document.getElementById('feed-container');
            container.innerHTML = '<div class="loading-spinner">Loading posts...</div>';
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/posts/feed`);
                const data = await res.json();
                renderPosts(data.posts);
            } catch (e) {
                container.innerHTML = '<p style="color: red; padding: 12px;">Failed to load posts.</p>';
            }
        }

        async function handleSearch(query) {
            const container = document.getElementById('feed-container');
            if (!query.trim()) {
                loadFeed();
                return;
            }
            container.innerHTML = '<div class="loading-spinner">Searching...</div>';
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                
                container.innerHTML = '';
                if (!data.users.length && !data.posts.length) {
                    container.innerHTML = '<p style="color: #666; padding: 12px;">No results found.</p>';
                    return;
                }

                if (data.users.length) {
                    const userHeader = document.createElement('div');
                    userHeader.style.cssText = "font-weight: bold; margin-bottom: 8px; color: #666;";
                    userHeader.innerText = "Users";
                    container.appendChild(userHeader);

                    for (const u of data.users) {
                        const uEl = document.createElement('div');
                        uEl.className = 'user-result-box';
                        uEl.innerHTML = `
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <img class="post-avatar" src="${u.pfp_url || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'36\' height=\'36\'><rect width=\'100%\' height=\'100%\' fill=\'%23f0f0f0\'/></svg>'}">
                                <a href="profile.html?user=${encodeURIComponent(u.username)}" class="post-meta">@${escapeHtml(u.username)}</a>
                            </div>
                        `;
                        container.appendChild(uEl);
                    }
                }

                if (data.posts.length) {
                    const postHeader = document.createElement('div');
                    postHeader.style.cssText = "font-weight: bold; margin: 16px 0 8px 0; color: #666;";
                    postHeader.innerText = "Posts";
                    container.appendChild(postHeader);
                    renderPosts(data.posts, container, false);
                }
            } catch (e) {
                container.innerHTML = '<p style="color: red; padding: 12px;">Search failed.</p>';
            }
        }

        async function renderPosts(posts, container = document.getElementById('feed-container'), clear = true) {
            if (clear) container.innerHTML = '';
            if (!posts.length && clear) {
                container.innerHTML = '<p style="color: #666; padding: 12px;">No posts recorded.</p>';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const highlightPostId = urlParams.get('highlight');

            for (const post of posts) {
                const isOwner = post.user_email.toLowerCase() === currentUser.email.toLowerCase();
                const rxRes = await fetch(`${WORKER_ORIGIN}/api/reactions/get?postId=${post.id}&email=${encodeURIComponent(currentUser.email)}`);
                const rxData = await rxRes.json();

                const isHighlighted = highlightPostId === post.id;
                const postEl = document.createElement('div');
                postEl.className = `post-box ${isHighlighted ? 'highlighted' : ''}`;
                postEl.id = `post-${post.id}`;
                
                // Format text with clickable @mentions
                const formattedContent = escapeHtml(post.content).replace(/@([a-zA-Z0-9_]+)/g, '<a href="profile.html?user=$1" style="font-weight:600; color:#000; text-decoration:underline;">@$1</a>');

                postEl.innerHTML = `
                    <div class="post-header-line">
                        <img class="post-avatar" src="${post.pfp_url || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'36\' height=\'36\'><rect width=\'100%\' height=\'100%\' fill=\'%23f0f0f0\'/></svg>'}">
                        <div style="flex-grow: 1;">
                            <a href="profile.html?user=${encodeURIComponent(post.username || post.user_email)}" class="post-meta">${post.username ? '@' + escapeHtml(post.username) : escapeHtml(post.user_email)}</a>
                            <br><span class="post-timestamp">${new Date(post.created_at).toLocaleString()}</span>
                        </div>
                        ${isOwner ? `<button onclick="deletePost('${post.id}')" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:11px; font-weight:600;">Delete</button>` : ''}
                    </div>
                    ${post.content ? `<div class="post-text">${formattedContent}</div>` : ''}
                    ${post.media_url ? `<img class="post-media" src="${post.media_url}">` : ''}
                    <div class="post-actions">
                        <button class="reaction-btn ${rxData.userReaction === 'like' ? 'active-like' : ''}" onclick="toggleReaction('${post.id}', 'like')">
                            ${LIKE_SVG} <span id="likes-${post.id}">${rxData.likes}</span>
                        </button>
                        <button class="reaction-btn ${rxData.userReaction === 'dislike' ? 'active-dislike' : ''}" onclick="toggleReaction('${post.id}', 'dislike')">
                            ${DISLIKE_SVG} <span id="dislikes-${post.id}">${rxData.dislikes}</span>
                        </button>
                    </div>
                `;
                container.appendChild(postEl);
            }

            if (highlightPostId) {
                const target = document.getElementById(`post-${highlightPostId}`);
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        async function toggleReaction(postId, reactionType) {
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/reactions/toggle`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ postId, email: currentUser.email, reaction: reactionType })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                document.getElementById(`likes-${postId}`).innerText = data.likes;
                document.getElementById(`dislikes-${postId}`).innerText = data.dislikes;

                const parent = document.getElementById(`post-${postId}`);
                const buttons = parent.querySelectorAll('.reaction-btn');
                buttons[0].className = `reaction-btn ${data.userReaction === 'like' ? 'active-like' : ''}`;
                buttons[1].className = `reaction-btn ${data.userReaction === 'dislike' ? 'active-dislike' : ''}`;
            } catch (err) {
                alert(err.message);
            }
        }

        async function deletePost(postId) {
            if (!confirm("Delete post?")) return;
            await fetch(`${WORKER_ORIGIN}/api/posts/delete`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ postId, email: currentUser.email })
            });
            document.getElementById(`post-${postId}`)?.remove();
        }

        loadFeed();
    </script>
</body>
</html>
