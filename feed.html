<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nvaritia - Home Feed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #fff; color: #111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; padding-top: 48px; padding-bottom: 54px; overflow-x: hidden; }
        header { position: fixed; top: 0; left: 0; width: 100%; height: 48px; background: #fff; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; z-index: 100; gap: 8px; }
        .brand { font-size: 18px; font-weight: 800; color: #000; text-decoration: none; flex-shrink: 0; }
        .header-right { display: flex; align-items: center; gap: 6px; margin-left: auto; }
        .btn-app { display: inline-block; background: #000; color: #fff; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; }

        /* Stories & Friends Music Notes Strip */
        .social-strip-wrap { display: none; width: 100%; border-bottom: 1px solid #ececec; background: #fff; padding: 10px 12px; }
        .social-strip-wrap.visible { display: block; }
        .social-strip-scroll { display: flex; align-items: flex-start; gap: 14px; overflow-x: auto; scrollbar-width: none; padding-top: 2px; }
        .social-strip-scroll::-webkit-scrollbar { display: none; }
        .social-story-item { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 64px; flex-shrink: 0; cursor: pointer; user-select: none; }
        .social-story-ring { width: 54px; height: 54px; border-radius: 50%; padding: 2px; background: conic-gradient(#111, #777, #111); display: flex; align-items: center; justify-content: center; }
        .social-story-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #fff; background: #f0f0f0; }
        .social-story-name { font-size: 11px; font-weight: 600; color: #333; max-width: 64px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }

        .social-note-item { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 88px; flex-shrink: 0; cursor: pointer; user-select: none; }
        .social-note-bubble-wrap { position: relative; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; margin-top: 14px; }
        .social-note-bubble { position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%); background: #111; color: #fff; border: 1px solid #333; border-radius: 10px; padding: 4px 7px; font-size: 10px; font-weight: 600; max-width: 112px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 3px 8px rgba(0,0,0,0.18); z-index: 2; }
        .social-note-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #22c55e; background: #f0f0f0; }
        .social-note-track { font-size: 10.5px; font-weight: 700; color: #111; max-width: 88px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
        .social-note-artist { font-size: 10px; color: #666; max-width: 88px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; margin-top: -3px; }

        html.dark .social-strip-wrap { background: #121212; border-bottom-color: #2a2a2a; }
        html.dark .social-story-name { color: #ddd; }
        html.dark .social-story-ring { background: conic-gradient(#fff, #666, #fff); }
        html.dark .social-story-ring img, html.dark .social-note-avatar { border-color: #121212; }
        html.dark .social-note-bubble { background: #262626; color: #fff; border-color: #444; }
        html.dark .social-note-track { color: #eee; }
        html.dark .social-note-artist { color: #aaa; }

        /* Story Viewer Modal */
        #story-viewer-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9600; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
        #story-viewer-modal.open { display: flex; }
        .story-viewer-card { width: 100%; max-width: 420px; background: #000; border: 1px solid #2a2a2a; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
        .story-viewer-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; color: #fff; background: rgba(0,0,0,0.7); }
        .story-viewer-user { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; }
        .story-viewer-user img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
        .story-viewer-media { width: 100%; max-height: 70vh; object-fit: contain; background: #000; }
        .story-reply-form { display: flex; gap: 8px; padding: 10px 12px; background: #141414; border-top: 1px solid #262626; }
        .story-reply-input { flex: 1; background: #222; color: #fff; border: 1px solid #3a3a3a; border-radius: 18px; padding: 8px 12px; font-size: 13px; }
        .story-reply-btn { background: #fff; color: #000; border: none; border-radius: 18px; padding: 0 14px; font-size: 12px; font-weight: 700; cursor: pointer; }

        /* Feed */
        .feed-wrapper { width: 100%; max-width: 600px; margin: 0 auto; padding: 8px 12px; }
        .post-box { border: 1px solid #e5e5e5; border-radius: 6px; padding: 12px; margin-bottom: 10px; background: #fff; }
        .post-box.highlighted { background: #f9f9f9; border: 1px solid #000; }
        .post-header-line { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .feed-avatar-container { position: relative; width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .feed-avatar-container.has-story { padding: 2px; background: conic-gradient(#000, #888, #000); }
        html.dark .feed-avatar-container.has-story { background: conic-gradient(#fff, #666, #fff); }
        .post-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 1px solid #ddd; background: #f0f0f0; }
        .feed-avatar-container.has-story .post-avatar { border: 2px solid #fff; }
        html.dark .feed-avatar-container.has-story .post-avatar { border-color: #121212; }
        .post-meta { font-weight: 700; font-size: 13px; color: #111; text-decoration: none; }
        .post-meta:hover { text-decoration: underline; }
        .post-timestamp { font-size: 11px; color: #666; }
        .post-text { margin: 6px 0 8px 0; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
        .post-media { max-width: 100%; max-height: 400px; border-radius: 6px; border: 1px solid #e5e5e5; margin-bottom: 4px; display: block; }
        .delete-btn { color: #ef4444; font-size: 12px; font-weight: 600; cursor: pointer; margin-left: auto; }
        .safety-actions { display: flex; gap: 6px; margin-left: auto; }
        .safety-btn { font-size: 11px; font-weight: 600; color: #666; cursor: pointer; padding: 2px 6px; border: 1px solid #ddd; border-radius: 4px; }
        .safety-btn:hover { color: #000; border-color: #999; }

        .load-more-btn { width: 100%; padding: 10px; background: #f5f5f5; color: #111; border: 1px solid #ddd; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; margin: 10px 0 20px 0; text-align: center; }

        /* Search Drawer */
        .search-drawer { position: fixed; top: 0; right: -100%; width: 100%; height: 100vh; background: #fff; z-index: 1500; transition: right 0.25s ease; display: flex; flex-direction: column; }
        .search-drawer.open { right: 0; }
        .search-drawer-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #e5e5e5; height: 48px; }
        .search-drawer-header input { flex-grow: 1; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .search-filters { display: flex; border-bottom: 1px solid #e5e5e5; background: #f5f5f5; }
        .filter-tab { flex: 1; text-align: center; padding: 8px; font-size: 12px; font-weight: 700; cursor: pointer; color: #666; }
        .filter-tab.active { color: #000; background: #fff; border-bottom: 2px solid #000; }
        .search-results-area { flex-grow: 1; overflow-y: auto; padding: 12px; }
        .user-result-box { display: flex; align-items: center; justify-content: space-between; padding: 10px; border: 1px solid #e5e5e5; border-radius: 6px; margin-bottom: 8px; cursor: pointer; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1px solid #ddd; }

        /* Footer */
        footer { position: fixed; bottom: 0; left: 0; width: 100%; height: 50px; background: #fff; border-top: 1px solid #e5e5e5; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .footer-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; flex: 1; color: #666; text-decoration: none; font-size: 10px; font-weight: 600; height: 100%; cursor: pointer; }
        .footer-tab.active { color: #000; }
        .footer-icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .footer-tab.active .footer-icon { stroke: #000; }
        .footer-icon.icon-filled { fill: currentColor; stroke: none; }
    </style>
</head>
<body>
    <header>
        <a href="feed.html" class="brand">Nvaritia</a>
        <div class="header-right">
            <div class="btn-app" onclick="openSearchDrawer()">Search</div>
            <div id="auth-header-btn" class="btn-app" style="display: none;" onclick="window.location.href='index.html'">Sign Up / Login</div>
        </div>
    </header>

    <div id="friends-social-strip" class="social-strip-wrap">
        <div id="friends-social-scroll" class="social-strip-scroll"></div>
    </div>

    <div class="feed-wrapper">
        <div id="feed-container">Loading feed...</div>
        <div id="load-more-btn" class="load-more-btn" style="display: none;" onclick="loadMorePosts()">Load more posts</div>
    </div>

    <div id="story-viewer-modal">
        <div class="story-viewer-card">
            <div class="story-viewer-top">
                <div class="story-viewer-user">
                    <img id="story-viewer-pfp" src="" alt="">
                    <span id="story-viewer-username">@user</span>
                </div>
                <span style="cursor:pointer; font-size:18px; padding:0 6px;" onclick="closeStoryViewer()">✕</span>
            </div>
            <video id="story-viewer-video" class="story-viewer-media" controls autoplay playsinline></video>
            <form id="story-reply-form" class="story-reply-form" onsubmit="submitStoryReply(event)">
                <input type="text" id="story-reply-input" class="story-reply-input" placeholder="Reply to story..." maxlength="300" required>
                <button type="submit" id="story-reply-submit" class="story-reply-btn">Send</button>
            </form>
        </div>
    </div>

    <div id="search-drawer" class="search-drawer">
        <div class="search-drawer-header">
            <input type="text" id="drawer-search-input" placeholder="Search users or posts..." oninput="performSearch()">
            <span style="cursor:pointer; font-size:18px; font-weight:bold; padding: 0 6px;" onclick="closeSearchDrawer()">✕</span>
        </div>
        <div class="search-filters">
            <div class="filter-tab active" id="tab-all" onclick="switchSearchTab('all')">All</div>
            <div class="filter-tab" id="tab-users" onclick="switchSearchTab('users')">Users</div>
            <div class="filter-tab" id="tab-posts" onclick="switchSearchTab('posts')">Posts</div>
        </div>
        <div class="search-results-area" id="drawer-search-results">Type at least 2 characters to search...</div>
    </div>

    <footer>
        <a href="feed.html" class="footer-tab active">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Home
        </a>
        <a href="create-post.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Post
        </a>
        <a href="messages.html" class="footer-tab">
            <svg id="Layer_1" data-name="Layer 1" class="footer-icon icon-filled" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122.56 122.88"><title>sent</title><path d="M112.27,10.31l-99,38.07,30,14.37L89.21,33.18,60.44,80.53l14,29.06,37.81-99.28ZM2.42,44.49,117.16.37a3.73,3.73,0,0,1,3-.12,3.78,3.78,0,0,1,2.19,4.87L78.4,120.45a3.78,3.78,0,0,1-6.92.3l-22.67-47L2.14,51.39a3.76,3.76,0,0,1,.28-6.9Z"/></svg>
            Messages
        </a>
        <a href="profile.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Profile
        </a>
    </footer>

    <script src="app.js?v=6"></script>
    <script>
        const currentUser = requireAuth(true);
        const isGuest = !!(currentUser && currentUser.guest);
        if (isGuest) {
            const authBtn = document.getElementById('auth-header-btn');
            if (authBtn) authBtn.style.display = 'inline-block';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const highlightPostId = urlParams.get('post');
        const activeTagFilter = (urlParams.get('tag') || '').replace(/^#/, '').toLowerCase();

        let currentOffset = 0;
        const limit = 25;
        let feedSeed = null;
        const shownPostIds = new Set();
        let searchTimeout = null;
        let activeSearchTab = 'all';
        let activeStoryOwnerEmail = null;
        let activeNoteAudio = null;
        let activeNoteTimer = null;

        const activeViewTimers = new Map();
        const postObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const postId = entry.target.getAttribute('data-post-id');
                if (!postId) return;

                const vid = entry.target.querySelector('.nv-video-el');

                if (entry.isIntersecting && entry.intersectionRatio >= 0.75) {
                    if (!activeViewTimers.has(postId)) {
                        activeViewTimers.set(postId, {
                            startTime: Date.now(),
                            timer: setTimeout(() => {
                                recordPostView(postId, 3000, true);
                            }, 3000)
                        });
                    }
                } else {
                    if (vid && !vid.paused) {
                        vid.pause();
                    }
                    if (activeViewTimers.has(postId)) {
                        const data = activeViewTimers.get(postId);
                        clearTimeout(data.timer);
                        const durationMs = Date.now() - data.startTime;
                        if (durationMs > 500) {
                            recordPostView(postId, durationMs, durationMs >= 3000);
                        }
                        activeViewTimers.delete(postId);
                    }
                }
            });
        }, { threshold: [0.75] });

        const VIEW_QUEUE_KEY = 'nvaritia_view_queue';
        function getViewQueue() {
            try { return JSON.parse(localStorage.getItem(VIEW_QUEUE_KEY) || '[]'); } catch (e) { return []; }
        }
        function saveViewQueue(q) {
            try { localStorage.setItem(VIEW_QUEUE_KEY, JSON.stringify(q.slice(-100))); } catch (e) {}
        }
        let flushTimer = null;
        function scheduleViewFlush(delay = 1500) {
            if (flushTimer) return;
            flushTimer = setTimeout(() => { flushTimer = null; flushViewQueue(); }, delay);
        }
        async function flushViewQueue() {
            if (!navigator.onLine) return;
            const q = getViewQueue();
            if (!q.length) return;
            const batch = q.slice(0, 25);
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/posts/view`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ views: batch })
                });
                if (!res.ok) return;
                const sentIds = new Set(batch.map(b => b._qid));
                saveViewQueue(getViewQueue().filter(x => !sentIds.has(x._qid)));
                if (getViewQueue().length) scheduleViewFlush(500);
            } catch (e) {}
        }
        function recordPostView(postId, durationMs, completed) {
            const q = getViewQueue();
            q.push({ _qid: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`, email: isGuest ? null : currentUser.email, postId, durationMs, completed });
            saveViewQueue(q);
            if (q.length >= 10) flushViewQueue(); else scheduleViewFlush(2000);
        }
        window.addEventListener('online', () => flushViewQueue());
        window.addEventListener('pagehide', () => {
            activeViewTimers.forEach((data, postId) => {
                clearTimeout(data.timer);
                const durationMs = Date.now() - data.startTime;
                if (durationMs > 500) {
                    recordPostView(postId, durationMs, durationMs >= 3000);
                }
            });
            activeViewTimers.clear();
            const q = getViewQueue();
            if (q.length && navigator.sendBeacon) {
                navigator.sendBeacon(`${WORKER_ORIGIN}/api/posts/view`, new Blob([JSON.stringify({ views: q.slice(-25) })], { type: 'application/json' }));
            }
        });

        function stopActiveNoteAudio() {
            if (activeNoteTimer) {
                clearTimeout(activeNoteTimer);
                activeNoteTimer = null;
            }
            if (activeNoteAudio) {
                try { activeNoteAudio.pause(); } catch (e) {}
                activeNoteAudio = null;
            }
        }

        function playFriendNoteClip(noteObj) {
            stopActiveNoteAudio();
            if (!noteObj || !noteObj.preview_url) {
                if (noteObj && noteObj.track_view_url) window.open(noteObj.track_view_url, '_blank');
                return;
            }
            const audio = new Audio(noteObj.preview_url);
            activeNoteAudio = audio;
            const startSec = Math.max(0, Number(noteObj.clip_start) || 0);
            const durSec = Math.max(3, Math.min(30, Number(noteObj.clip_duration) || 15));

            const startPlayback = () => {
                try {
                    if (startSec > 0 && audio.duration && startSec < audio.duration) {
                        audio.currentTime = startSec;
                    }
                } catch (e) {}
                audio.play().catch(() => {});
                activeNoteTimer = setTimeout(() => {
                    stopActiveNoteAudio();
                }, durSec * 1000);
            };

            audio.addEventListener('loadedmetadata', startPlayback, { once: true });
            audio.addEventListener('ended', stopActiveNoteAudio, { once: true });
            audio.load();
            showToast(`Playing ${noteObj.track_name} — ${noteObj.artist_name}`);
        }

        async function openStoryViewer(ownerEmail, username, pfpUrl, mediaUrl) {
            stopActiveNoteAudio();
            activeStoryOwnerEmail = ownerEmail;
            const modal = document.getElementById('story-viewer-modal');
            const vid = document.getElementById('story-viewer-video');
            const pfp = document.getElementById('story-viewer-pfp');
            const uname = document.getElementById('story-viewer-username');
            const replyForm = document.getElementById('story-reply-form');

            pfp.src = pfpUrl || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28'><rect width='100%' height='100%' fill='%23f0f0f0'/></svg>";
            uname.innerText = `@${username || ownerEmail}`;
            vid.src = mediaUrl;
            if (replyForm) replyForm.style.display = isGuest ? 'none' : 'flex';
            modal.classList.add('open');
            try { await vid.play(); } catch (e) {}
        }

        function closeStoryViewer() {
            const modal = document.getElementById('story-viewer-modal');
            const vid = document.getElementById('story-viewer-video');
            if (vid) {
                vid.pause();
                vid.removeAttribute('src');
            }
            if (modal) modal.classList.remove('open');
            activeStoryOwnerEmail = null;
        }

        async function submitStoryReply(e) {
            e.preventDefault();
            if (isGuest) return promptSignup('reply to stories');
            const input = document.getElementById('story-reply-input');
            const btn = document.getElementById('story-reply-submit');
            const content = (input.value || '').trim();
            if (!content || !activeStoryOwnerEmail) return;

            btn.disabled = true;
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/stories/reply`, {
                    method: 'POST',
                    headers: authHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ ownerEmail: activeStoryOwnerEmail, content })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Could not send reply');
                input.value = '';
                showToast('Story reply sent');
            } catch (err) {
                showToast(err.message);
            } finally {
                btn.disabled = false;
            }
        }

        async function loadFriendsStoriesAndNotes() {
            const wrap = document.getElementById('friends-social-strip');
            const scroll = document.getElementById('friends-social-scroll');
            if (!wrap || !scroll || isGuest || !currentUser || !currentUser.email) return;

            try {
                const [storiesRes, notesRes] = await Promise.all([
                    fetch(`${WORKER_ORIGIN}/api/stories/friends`, { headers: authHeaders() }),
                    fetch(`${WORKER_ORIGIN}/api/notes/friends`, { headers: authHeaders() })
                ]);

                const storiesData = storiesRes.ok ? await storiesRes.json() : { stories: [] };
                const notesData = notesRes.ok ? await notesRes.json() : { notes: [] };

                const stories = Array.isArray(storiesData.stories) ? storiesData.stories : [];
                const notes = Array.isArray(notesData.notes) ? notesData.notes : [];

                if (!stories.length && !notes.length) {
                    wrap.classList.remove('visible');
                    scroll.innerHTML = '';
                    return;
                }

                const defaultPfp = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='54' height='54'><rect width='100%' height='100%' fill='%23f0f0f0'/></svg>";
                scroll.innerHTML = '';

                for (const st of stories) {
                    const item = document.createElement('div');
                    item.className = 'social-story-item';
                    item.title = `Story by @${st.username}`;
                    item.innerHTML = `
                        <div class="social-story-ring">
                            <img src="${st.pfp_url || defaultPfp}" alt="">
                        </div>
                        <span class="social-story-name">@${escapeHtml(st.username)}</span>
                    `;
                    item.onclick = () => openStoryViewer(st.user_email, st.username, st.pfp_url || defaultPfp, st.media_url);
                    scroll.appendChild(item);
                }

                for (const nt of notes) {
                    const item = document.createElement('div');
                    item.className = 'social-note-item';
                    item.title = `${nt.track_name} — ${nt.artist_name}`;
                    const bubbleHtml = nt.note_text
                        ? `<div class="social-note-bubble">${escapeHtml(nt.note_text)}</div>`
                        : '';
                    item.innerHTML = `
                        <div class="social-note-bubble-wrap">
                            ${bubbleHtml}
                            <img class="social-note-avatar" src="${nt.pfp_url || defaultPfp}" alt="">
                        </div>
                        <span class="social-note-track">${escapeHtml(nt.track_name)}</span>
                        <span class="social-note-artist">${escapeHtml(nt.artist_name)}</span>
                    `;
                    item.onclick = () => playFriendNoteClip(nt);
                    scroll.appendChild(item);
                }

                wrap.classList.add('visible');
            } catch (e) {
                wrap.classList.remove('visible');
            }
        }

        async function loadPosts(isMore = false) {
            const container = document.getElementById('feed-container');
            const loadMoreBtn = document.getElementById('load-more-btn');

            if (!isMore) {
                currentOffset = 0;
                shownPostIds.clear();
                feedSeed = `${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
                container.innerHTML = '<div style="text-align:center; padding:30px; color:#666; font-weight:600;">Curating your feed...</div>';
            } else {
                loadMoreBtn.innerText = 'Loading more...';
            }

            try {
                const emailParam = isGuest ? '' : encodeURIComponent(currentUser.email);
                const excl = isMore ? `&exclude=${encodeURIComponent([...shownPostIds].slice(-80).join(','))}` : '';
                const tagParam = activeTagFilter ? `&tag=${encodeURIComponent(activeTagFilter)}` : '';
                const res = await fetch(`${WORKER_ORIGIN}/api/posts/feed?email=${emailParam}&limit=${limit}&offset=${currentOffset}&seed=${encodeURIComponent(feedSeed)}${excl}${tagParam}`, { cache: 'no-store' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to load feed');

                const freshPosts = (data.posts || []).filter(p => !shownPostIds.has(p.id));
                freshPosts.forEach(p => shownPostIds.add(p.id));

                await renderPosts(freshPosts, container, {
                    clear: !isMore,
                    highlightPostId,
                    observer: postObserver
                });

                if ((data.posts || []).length === limit) {
                    loadMoreBtn.style.display = 'block';
                    loadMoreBtn.innerText = 'Load more posts';
                    currentOffset += limit;
                } else {
                    loadMoreBtn.style.display = 'none';
                }
            } catch (err) {
                if (!isMore) {
                    container.innerHTML = `<p style="color:#ef4444; text-align:center; padding:20px;">Error loading feed: ${escapeHtml(err.message)}</p>`;
                } else {
                    loadMoreBtn.innerText = 'Error loading more. Try again.';
                }
            }
        }

        function loadMorePosts() {
            loadPosts(true);
        }

        function openSearchDrawer() {
            document.getElementById('search-drawer').classList.add('open');
            const input = document.getElementById('drawer-search-input');
            input.focus();
            if (input.value.trim().length >= 2) performSearch();
        }

        function closeSearchDrawer() {
            document.getElementById('search-drawer').classList.remove('open');
        }

        function switchSearchTab(tab) {
            activeSearchTab = tab;
            ['all', 'users', 'posts'].forEach(t => document.getElementById(`tab-${t}`).classList.toggle('active', t === tab));
            performSearch();
        }

        async function performSearch() {
            const q = document.getElementById('drawer-search-input').value.trim();
            const resultsDiv = document.getElementById('drawer-search-results');
            if (q.length < 2) {
                resultsDiv.innerHTML = 'Type at least 2 characters to search...';
                return;
            }
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(async () => {
                resultsDiv.innerHTML = '<p style="color:#666;">Searching...</p>';
                try {
                    const emailParam = isGuest ? '' : encodeURIComponent(currentUser.email);
                    const res = await fetch(`${WORKER_ORIGIN}/api/search?q=${encodeURIComponent(q)}&email=${emailParam}`);
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error);

                    resultsDiv.innerHTML = '';
                    const users = data.users || [];
                    const posts = data.posts || [];

                    if ((activeSearchTab === 'all' || activeSearchTab === 'users') && users.length > 0) {
                        resultsDiv.innerHTML += '<div style="font-weight:700; font-size:12px; margin-bottom:6px; color:#666;">USERS</div>';
                        users.forEach(u => {
                            const div = document.createElement('div');
                            div.className = 'user-result-box';
                            const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='38' height='38'><rect width='100%' height='100%' fill='%23f0f0f0'/></svg>";
                            div.innerHTML = `
                                <div style="display:flex; align-items:center; gap:10px;">
                                    <img class="avatar" src="${u.pfp_url || defaultAvatar}">
                                    <div>
                                        <div style="font-weight:700;">@${escapeHtml(u.username)}${renderVerifiedBadge(u.verified)}</div>
                                        <div style="font-size:12px; color:#666;">${escapeHtml(u.bio || '')}</div>
                                    </div>
                                </div>
                            `;
                            const targetProfileUrl = `profile.html?user=${encodeURIComponent(u.username || u.email)}`;
                            div.onclick = () => goToProfile(targetProfileUrl);
                            resultsDiv.appendChild(div);
                        });
                    }

                    if ((activeSearchTab === 'all' || activeSearchTab === 'posts') && posts.length > 0) {
                        resultsDiv.innerHTML += '<div style="font-weight:700; font-size:12px; margin:12px 0 6px 0; color:#666;">POSTS</div>';
                        await renderPosts(posts, resultsDiv, { clear: false });
                    }

                    if (resultsDiv.innerHTML === '') {
                        resultsDiv.innerHTML = '<p style="color:#666; text-align:center; padding:20px;">No results found.</p>';
                    }
                } catch (err) {
                    resultsDiv.innerHTML = `<p style="color:#ef4444;">Error: ${escapeHtml(err.message)}</p>`;
                }
            }, 300);
        }

        loadFriendsStoriesAndNotes();
        loadPosts(false);
        flushViewQueue();
    </script>
</body>
</html>
