<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rprofiles - Home Feed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #ffffff; color: #111; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; display: flex; flex-direction: column; min-height: 100vh; padding-top: 48px; padding-bottom: 50px; }
        header, footer { background: #ffffff; border-color: #e5e5e5; position: fixed; left: 0; width: 100%; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
        header { border-bottom: 1px solid #e5e5e5; height: 48px; top: 0; }
        footer { border-top: 1px solid #e5e5e5; height: 44px; bottom: 0; }
        .brand { font-size: 18px; font-weight: bold; color: #111; text-decoration: none; cursor: pointer; }
        .wrapper { width: 100%; max-width: 680px; margin: 0 auto; padding: 16px; flex-grow: 1; }
        .post-box { border-top: 1px solid #e5e5e5; padding: 12px 0; }
        .post-box:first-child { border-top: none; }
        .post-header-line { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .post-avatar { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #e5e5e5; object-fit: cover; }
        .post-meta { font-weight: 600; color: #111; text-decoration: none; cursor: pointer; }
        .post-meta:hover { text-decoration: underline; }
        .post-timestamp { color: #666; font-size: 10px; }
        .post-text { font-size: 13px; margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; }
        .post-media { max-width: 100%; max-height: 400px; border-radius: 6px; border: 1px solid #e5e5e5; margin-top: 6px; }
        
        /* Reaction Button Styles & SVGs */
        .post-actions { display: flex; gap: 10px; margin-top: 8px; align-items: center; font-size: 12px; }
        .reaction-btn { background: #ffffff; border: 1px solid #cccccc; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: #111111; transition: background-color 0.15s; }
        .reaction-btn:hover { background: #f5f5f5; }
        .reaction-icon { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        
        .reaction-btn.active-like { background: #000000; color: #ffffff; border-color: #000000; }
        .reaction-btn.active-like .reaction-icon { fill: #ffffff; stroke: #ffffff; }
        
        .reaction-btn.active-dislike { background: #ef4444; color: #ffffff; border-color: #ef4444; }
        .reaction-btn.active-dislike .reaction-icon { fill: #ffffff; stroke: #ffffff; }

        .btn-app { background: #000; border: 1px solid #000; border-radius: 4px; color: #fff; font-weight: 600; padding: 6px 12px; cursor: pointer; }
        .footer-tab { padding: 6px 14px; border: 1px solid #ccc; border-radius: 4px; background: #fff; color: #111; font-weight: 600; cursor: pointer; text-decoration: none; }
        .footer-tab.active { background: #000; color: #fff; border-color: #000; }
        .loading-spinner { text-align: center; padding: 20px; color: #666; font-weight: 600; }
        .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 14px; }
        .modal-window { width: 100%; max-width: 440px; background: #fff; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
        .modal-header { background: #f0f0f0; padding: 10px 14px; font-weight: bold; display: flex; justify-content: space-between; border-bottom: 1px solid #e5e5e5; }
        .modal-body { padding: 14px; }
        .form-row { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
        .form-row textarea, .form-row input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .progress-container { width: 100%; background: #f0f0f0; height: 6px; border-radius: 3px; margin-top: 8px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; background: #000; width: 0%; transition: width 0.2s; }
        .error-msg { background: #fee2e2; border: 1px solid #ef4444; color: #b91c1c; padding: 8px; border-radius: 4px; margin-bottom: 12px; font-weight: 600; display: none; }
    </style>
</head>
<body>
    <header>
        <a href="feed.html" class="brand">rprofiles</a>
        <button class="btn-app" onclick="openModal('post-modal')">+ Create Post</button>
    </header>

    <div class="wrapper">
        <div id="feed-container"><div class="loading-spinner">Loading posts...</div></div>
    </div>

    <footer>
        <div style="display: flex; gap: 6px;">
            <a href="feed.html" class="footer-tab active">Home Feed</a>
            <a href="profile.html" class="footer-tab">Profile</a>
        </div>
        <div style="color: #666; font-size: 11px;">rprofiles © 2026</div>
    </footer>

    <!-- CREATE POST MODAL -->
    <div id="post-modal" class="modal">
        <div class="modal-window">
            <div class="modal-header">
                <span>Create Post</span>
                <span style="cursor: pointer;" onclick="closeModal('post-modal')">✕</span>
            </div>
            <div class="modal-body">
                <div id="post-modal-error" class="error-msg"></div>
                <form id="create-post-form" onsubmit="submitPost(event)">
                    <div class="form-row">
                        <label>Text Content:</label>
                        <textarea id="post-text" placeholder="What's on your mind?"></textarea>
                    </div>
                    <div class="form-row">
                        <label>Media Attachment (Max 25MB):</label>
                        <input type="file" id="post-media" accept="image/*" onchange="checkFileSize(this)">
                    </div>
                    <div class="progress-container" id="progress-container">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>
                    <div id="status-text" style="font-size: 11px; color: #666; margin-top: 4px; display: none;">Uploading post...</div>
                    <div style="display: flex; gap: 8px; margin-top: 12px;">
                        <button type="submit" class="btn-app" id="pub-btn" style="flex: 1;">Publish</button>
                        <button type="button" class="footer-tab" onclick="closeModal('post-modal')">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const currentUser = requireAuth();
        let isPublishing = false;

        const LIKE_SVG = `<svg class="reaction-icon" viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>`;
        const DISLIKE_SVG = `<svg class="reaction-icon" viewBox="0 0 24 24"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg>`;

        async function loadFeed() {
            const container = document.getElementById('feed-container');
            container.innerHTML = '<div class="loading-spinner">Loading posts...</div>';
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/posts/feed`);
                const data = await res.json();
                if (!data.posts.length) {
                    container.innerHTML = '<p style="color: #666; padding: 12px;">No posts recorded.</p>';
                    return;
                }

                container.innerHTML = '';
                for (const post of data.posts) {
                    const isOwner = post.user_email.toLowerCase() === currentUser.email.toLowerCase();
                    const rxRes = await fetch(`${WORKER_ORIGIN}/api/reactions/get?postId=${post.id}&email=${encodeURIComponent(currentUser.email)}`);
                    const rxData = await rxRes.json();

                    const postEl = document.createElement('div');
                    postEl.className = 'post-box';
                    postEl.id = `post-${post.id}`;
                    postEl.innerHTML = `
                        <div class="post-header-line">
                            <img class="post-avatar" src="${post.pfp_url || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'36\' height=\'36\'><rect width=\'100%\' height=\'100%\' fill=\'%23f0f0f0\'/></svg>'}">
                            <div style="flex-grow: 1;">
                                <a href="profile.html?user=${encodeURIComponent(post.username || post.user_email)}" class="post-meta">${post.username ? '@' + escapeHtml(post.username) : escapeHtml(post.user_email)}</a>
                                <br><span class="post-timestamp">${new Date(post.created_at).toLocaleString()}</span>
                            </div>
                            ${isOwner ? `<button onclick="deletePost('${post.id}')" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:11px; font-weight:600;">Delete</button>` : ''}
                        </div>
                        ${post.content ? `<div class="post-text">${escapeHtml(post.content)}</div>` : ''}
                        ${post.media_url ? `<img class="post-media" src="${post.media_url}">` : ''}
                        <div class="post-actions">
                            <button class="reaction-btn ${rxData.userReaction === 'like' ? 'active-like' : ''}" onclick="toggleReaction('${post.id}', 'like')">
                                ${LIKE_SVG} <span id="likes-${post.id}">${rxData.likes}</span>
                            </button>
                            <button class="reaction-btn ${rxData.userReaction === 'dislike' ? 'active-dislike' : ''}" onclick="toggleReaction('${post.id}', 'dislike')">
                                ${DISLIKE_SVG} <span id="dislikes-${post.id}">${rxData.dislikes}</span>
                            </button>
                        </div>
                    `;
                    container.appendChild(postEl);
                }
            } catch (e) {
                container.innerHTML = '<p style="color: red; padding: 12px;">Failed to load posts.</p>';
            }
        }

        async function toggleReaction(postId, reactionType) {
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/reactions/toggle`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ postId, email: currentUser.email, reaction: reactionType })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                document.getElementById(`likes-${postId}`).innerText = data.likes;
                document.getElementById(`dislikes-${postId}`).innerText = data.dislikes;

                const parent = document.getElementById(`post-${postId}`);
                const buttons = parent.querySelectorAll('.reaction-btn');
                buttons[0].className = `reaction-btn ${data.userReaction === 'like' ? 'active-like' : ''}`;
                buttons[1].className = `reaction-btn ${data.userReaction === 'dislike' ? 'active-dislike' : ''}`;
            } catch (err) {
                alert(err.message);
            }
        }

        async function submitPost(event) {
            event.preventDefault();
            if (isPublishing) return;

            const text = document.getElementById('post-text').value.trim();
            const media = document.getElementById('post-media').files[0];
            if (!text && !media) {
                showError('Post must contain text or an attachment.');
                return;
            }

            isPublishing = true;
            const btn = document.getElementById('pub-btn');
            btn.disabled = true;
            btn.innerText = "Publishing...";

            document.getElementById('progress-container').style.display = 'block';
            document.getElementById('status-text').style.display = 'block';
            document.getElementById('progress-bar').style.width = '40%';

            const formData = new FormData();
            formData.append('email', currentUser.email);
            formData.append('content', text);
            if (media) formData.append('media', media);

            try {
                document.getElementById('progress-bar').style.width = '80%';
                const res = await fetch(`${WORKER_ORIGIN}/api/posts/create`, { method: 'POST', body: formData });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Upload failed');

                document.getElementById('progress-bar').style.width = '100%';
                setTimeout(() => {
                    closeModal('post-modal');
                    document.getElementById('create-post-form').reset();
                    document.getElementById('progress-container').style.display = 'none';
                    document.getElementById('status-text').style.display = 'none';
                    document.getElementById('progress-bar').style.width = '0%';
                    isPublishing = false;
                    btn.disabled = false;
                    btn.innerText = "Publish";
                    loadFeed();
                }, 300);
            } catch (err) {
                showError(err.message);
                document.getElementById('progress-container').style.display = 'none';
                document.getElementById('status-text').style.display = 'none';
                document.getElementById('progress-bar').style.width = '0%';
                isPublishing = false;
                btn.disabled = false;
                btn.innerText = "Publish";
            }
        }

        async function deletePost(postId) {
            if (!confirm("Are you sure you want to delete this post?")) return;
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/posts/delete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ postId, email: currentUser.email })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to delete');
                const el = document.getElementById(`post-${postId}`);
                if (el) el.remove();
            } catch (err) {
                alert(err.message);
            }
        }

        function checkFileSize(input) {
            if (input.files && input.files[0] && input.files[0].size > 25 * 1024 * 1024) {
                alert('File exceeds 25MB limit.');
                input.value = '';
            }
        }

        function showError(msg) {
            const el = document.getElementById('post-modal-error');
            el.innerText = msg;
            el.style.display = 'block';
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { if (!isPublishing) document.getElementById(id).style.display = 'none'; }
        loadFeed();
    </script>
</body>
</html>
