<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nvaritia - Feed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #ffffff; color: #111; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; display: flex; flex-direction: column; min-height: 100vh; padding-top: 48px; padding-bottom: 54px; }
        header, footer { background: #ffffff; border-color: #e5e5e5; position: fixed; left: 0; width: 100%; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
        header { border-bottom: 1px solid #e5e5e5; height: 48px; top: 0; }
        footer { border-top: 1px solid #e5e5e5; height: 50px; bottom: 0; justify-content: space-around; }
        .brand { font-size: 18px; font-weight: bold; color: #111; text-decoration: none; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .icon-btn { background: none; border: none; cursor: pointer; font-size: 18px; padding: 4px; color: inherit; position: relative; }
        .wrapper { width: 100%; max-width: 680px; margin: 0 auto; padding: 16px; flex-grow: 1; }

        .footer-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; text-decoration: none; font-size: 10px; font-weight: 600; gap: 2px; }
        .footer-tab.active { color: #000; }
        .footer-icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .footer-icon.icon-filled { fill: currentColor; stroke: none; }
        .footer-tab.active .footer-icon { stroke: #000; }
        .footer-tab.active .footer-icon.icon-filled { fill: #000; stroke: none; }

        .post-box { border: 1px solid #e5e5e5; padding: 14px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; border-radius: 6px; overflow: hidden; }
        .post-box.highlighted { border: 2px solid #000; background: #fafafa; }
        .post-header-line { display: flex; align-items: center; gap: 10px; min-width: 0; }

        /* Story indicator ring & post author avatar */
        .feed-avatar-container { position: relative; width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .feed-avatar-container.has-story { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); padding: 2px; cursor: pointer; }
        .feed-avatar, .post-avatar { width: 100%; height: 100%; min-width: 0; min-height: 0; border-radius: 50%; border: 1px solid #ccc; object-fit: cover; background: #f0f0f0; cursor: pointer; display: block; flex-shrink: 0; }
        .feed-avatar-container.has-story .post-avatar,
        .feed-avatar-container.has-story .feed-avatar { border: 2px solid #fff; }
        html.dark .feed-avatar-container.has-story .post-avatar,
        html.dark .feed-avatar-container.has-story .feed-avatar { border-color: #121212; }

        .post-meta { font-weight: bold; font-size: 13px; color: #000; text-decoration: none; cursor: pointer; }
        .post-meta:hover { text-decoration: underline; }
        .post-timestamp { font-size: 11px; color: #666; }
        .post-text { font-size: 13px; line-height: 1.4; word-break: break-word; }

        /* Post media framing */
        .post-media { display: block; width: 100%; max-width: 100%; max-height: 520px; border: 1px solid #ccc; border-radius: 4px; object-fit: contain; background: #fafafa; }
        html.dark .post-media { background: #181818; }

        .delete-btn { background: #ef4444; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; user-select: none; flex-shrink: 0; }
        .safety-actions { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }
        .safety-btn { background: #f0f0f0; color: #333; border: none; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; user-select: none; }

        /* Reaction SVG icons */
        .reaction-group { display: flex; gap: 16px; align-items: center; }
        .reaction-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; cursor: pointer; color: #555; user-select: none; }
        .reaction-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .reaction-btn.active-like { color: #000; font-weight: bold; }
        .reaction-btn.active-like svg { stroke: #000; fill: #000; }
        .reaction-btn.active-dislike { color: #ef4444; font-weight: bold; }
        .reaction-btn.active-dislike svg { stroke: #ef4444; fill: #ef4444; }
        html.dark .reaction-btn { color: #aaa; }
        html.dark .reaction-btn.active-like { color: #fff; }
        html.dark .reaction-btn.active-like svg { stroke: #fff; fill: #fff; }

        .load-more-btn { background: #000; color: #fff; padding: 10px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; margin: 12px auto; display: block; width: fit-content; user-select: none; }
        .loading-spinner { text-align: center; padding: 20px; color: #666; font-weight: 600; }

        /* Full-Page Search Drawer (Slides from Right) */
        .search-drawer { position: fixed; top: 0; right: -100%; width: 100%; height: 100vh; background: #fff; z-index: 1500; transition: right 0.3s ease-in-out; display: flex; flex-direction: column; }
        .search-drawer.open { right: 0; }
        .search-drawer-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #e5e5e5; background: #fff; }
        .search-back-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px 8px; color: inherit; font-weight: bold; }
        .search-drawer-input { flex-grow: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
        .search-filters { display: flex; border-bottom: 1px solid #e5e5e5; background: #fafafa; }
        .filter-tab { flex: 1; text-align: center; padding: 10px; font-size: 12px; font-weight: 700; cursor: pointer; color: #666; border-bottom: 2px solid transparent; }
        .filter-tab.active { color: #000; border-bottom: 2px solid #000; background: #fff; }
        .search-results-area { flex-grow: 1; overflow-y: auto; padding: 16px; max-width: 680px; width: 100%; margin: 0 auto; }
        .user-result-box { display: flex; align-items: center; gap: 12px; padding: 10px; border: 1px solid #e5e5e5; border-radius: 6px; margin-bottom: 10px; text-decoration: none; color: inherit; cursor: pointer; }
        .user-result-box:hover { background: #fafafa; }
        html.dark .user-result-box:hover { background: #1c1c1c; }
        .user-result-avatar { width: 42px; height: 42px; flex-shrink: 0; border-radius: 50%; border: 1px solid #ccc; object-fit: cover; background: #f0f0f0; display: block; }

        /* Activity Notifications Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
        .modal-window { width: 100%; max-width: 450px; background: #fff; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; max-height: 75vh; }
        .modal-header { background: #f5f5f5; padding: 10px 14px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e5e5; }
        .modal-body { padding: 12px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 8px; }
        .activity-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #eee; font-size: 12px; cursor: pointer; }
        .activity-item:hover { background: #fafafa; }
        .activity-avatar { width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; border: 1px solid #ccc; object-fit: cover; background: #f0f0f0; display: block; }
    </style>
</head>
<body>
    <header>
        <a href="feed.html" class="brand">Nvaritia</a>
        <div class="header-actions">
            <button class="icon-btn" onclick="openSearchDrawer()" title="Search" aria-label="Search">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <button class="icon-btn" onclick="openActivityModal()" title="Activity & Notifications" aria-label="Notifications">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </button>
        </div>
    </header>

    <div class="wrapper">
        <div id="feed-container"><div class="loading-spinner">Loading posts...</div></div>
        <div id="load-more-container"></div>
    </div>

    <!-- Full-Page Search Drawer (Slides from Right) -->
    <div id="search-drawer" class="search-drawer">
        <div class="search-drawer-header">
            <button class="search-back-btn" onclick="closeSearchDrawer()" aria-label="Back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            <input type="text" id="drawer-search-input" class="search-drawer-input" placeholder="Search users or posts..." oninput="handleDrawerSearch()">
        </div>
        <div class="search-filters">
            <div id="tab-all" class="filter-tab active" onclick="switchSearchFilter('all')">All</div>
            <div id="tab-accounts" class="filter-tab" onclick="switchSearchFilter('accounts')">Accounts</div>
            <div id="tab-posts" class="filter-tab" onclick="switchSearchFilter('posts')">Posts</div>
        </div>
        <div id="drawer-search-results" class="search-results-area">
            <p style="color: #666; text-align: center; margin-top: 30px; font-size: 12px;">Type at least 2 characters to search users or posts.</p>
        </div>
    </div>

    <!-- Activity Notifications Modal -->
    <div id="activity-modal" class="modal-overlay">
        <div class="modal-window">
            <div class="modal-header">
                <span>Activity</span>
                <span style="cursor: pointer;" onclick="closeActivityModal()">✕</span>
            </div>
            <div class="modal-body" id="activity-list">Loading...</div>
        </div>
    </div>

    <footer>
        <a href="feed.html" class="footer-tab active">
            <svg class="footer-icon icon-filled" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Home
        </a>
        <a href="create-post.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Post
        </a>
        <a href="messages.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            Messages
        </a>
        <a href="profile.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Profile
        </a>
    </footer>

    <script src="app.js"></script>
    <script>
        const currentUser = requireAuth(true);
        let currentOffset = 0;
        const pageSize = 30;
        let feedSeed = null;
        const shownPostIds = new Set();
        let activeSearchFilter = 'all';
        let searchDebounceTimer = null;
        let cachedSearchData = { users: [], posts: [] };

        // View active story for a user from the feed
        async function viewUserStory(userEmail, fallbackCreatedAt) {
            if (!userEmail) return;
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/stories/get?email=${encodeURIComponent(userEmail)}`);
                const data = await res.json();
                if (res.ok && data.story && data.story.media_url) {
                    openStory({
                        mediaUrl: data.story.media_url,
                        createdAt: data.story.created_at || fallbackCreatedAt,
                        ownerEmail: userEmail,
                        onDeleted: () => {
                            document.querySelectorAll(`[data-author="${userEmail.toLowerCase()}"] .feed-avatar-container`).forEach(el => {
                                el.classList.remove('has-story');
                            });
                        }
                    });
                } else {
                    showToast("Story has expired");
                }
            } catch (e) {
                showToast("Could not load story");
            }
        }

        // Batch watch-time & view logger (D1 write-friendly)
        const pendingViews = new Map();
        const postTimers = new Map();
        const visiblePosts = new Set();
        const completedPosts = new Set();
        let lastFlushAt = 0;

        function recordView(postId, durationMs, completed) {
            if (!postId) return;
            const prev = pendingViews.get(postId) || { postId, durationMs: 0, completed: 0 };
            prev.durationMs += Math.max(0, durationMs || 0);
            if (completed) prev.completed = 1;
            pendingViews.set(postId, prev);
            if (pendingViews.size >= 15) flushViews(true);
        }

        function flushViews(force = false) {
            if (!pendingViews.size) return;
            const now = Date.now();
            if (!force && now - lastFlushAt < 8000) return;
            lastFlushAt = now;
            const batch = [...pendingViews.values()];
            pendingViews.clear();
            const payload = JSON.stringify({ email: currentUser.email || '', views: batch });
            if (force && navigator.sendBeacon) {
                const ok = navigator.sendBeacon(`${WORKER_ORIGIN}/api/posts/view`, new Blob([payload], { type: 'application/json' }));
                if (ok) return;
            }
            fetch(`${WORKER_ORIGIN}/api/posts/view`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: payload,
                keepalive: true
            }).catch(() => {});
        }

        setInterval(() => flushViews(false), 10000);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                visiblePosts.forEach(id => stopPostTimer(id));
                flushViews(true);
            } else {
                visiblePosts.forEach(id => startPostTimer(id));
            }
        });
        window.addEventListener('pagehide', () => flushViews(true));

        function startPostTimer(postId) {
            if (postTimers.has(postId)) return;
            const startedAt = Date.now();
            const completionTimer = setTimeout(() => {
                completedPosts.add(postId);
                recordView(postId, Date.now() - startedAt, 1);
            }, 3500);
            postTimers.set(postId, { startedAt, completionTimer });
        }

        function stopPostTimer(postId) {
            const t = postTimers.get(postId);
            if (!t) return;
            clearTimeout(t.completionTimer);
            postTimers.delete(postId);
            const elapsed = Date.now() - t.startedAt;
            if (elapsed >= 400 || completedPosts.has(postId)) {
                recordView(postId, elapsed, completedPosts.has(postId) ? 1 : 0);
            }
        }

        const feedObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const id = entry.target.getAttribute('data-post-id');
                if (!id) return;
                if (entry.isIntersecting) {
                    visiblePosts.add(id);
                    startPostTimer(id);
                } else {
                    visiblePosts.delete(id);
                    stopPostTimer(id);
                }
            });
        }, { threshold: 0.5 });

        async function loadFeed(isLoadMore = false) {
            const container = document.getElementById('feed-container');
            const loadMoreDiv = document.getElementById('load-more-container');

            if (!isLoadMore) {
                container.innerHTML = '<div class="loading-spinner">Loading posts...</div>';
                currentOffset = 0;
                shownPostIds.clear();
                completedPosts.clear();
                feedSeed = `${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
            } else {
                loadMoreDiv.innerHTML = '<div class="loading-spinner">Loading more posts...</div>';
            }

            const params = new URLSearchParams(window.location.search);
            const highlightPostId = params.get('highlight') || params.get('post');

            try {
                const excl = [...shownPostIds].slice(-80).join(',');
                const res = await fetch(`${WORKER_ORIGIN}/api/posts/feed?email=${encodeURIComponent(currentUser.email || '')}&limit=${pageSize}&offset=${currentOffset}&seed=${encodeURIComponent(feedSeed)}&exclude=${encodeURIComponent(excl)}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                if (!isLoadMore) container.innerHTML = '';

                const freshPosts = (data.posts || []).filter(p => !shownPostIds.has(p.id));
                freshPosts.forEach(p => shownPostIds.add(p.id));

                if (!freshPosts.length && !isLoadMore) {
                    container.innerHTML = '<p style="color: #666; padding: 20px; text-align: center;">No posts available.</p>';
                    loadMoreDiv.innerHTML = '';
                    return;
                }

                await renderPosts(freshPosts, container, {
                    clear: false,
                    highlightPostId,
                    observer: feedObserver
                });

                currentOffset += (data.posts || []).length;

                if ((data.posts || []).length >= pageSize) {
                    loadMoreDiv.innerHTML = '<div class="load-more-btn" onclick="loadFeed(true)">Load More Posts</div>';
                } else {
                    loadMoreDiv.innerHTML = '';
                }
            } catch (err) {
                if (!isLoadMore) container.innerHTML = '<p style="color: red; padding: 20px; text-align: center;">Error loading feed.</p>';
                else loadMoreDiv.innerHTML = '';
            }
        }

        // ===== FULL-PAGE SEARCH DRAWER LOGIC =====
        function openSearchDrawer() {
            document.getElementById('search-drawer').classList.add('open');
            setTimeout(() => {
                document.getElementById('drawer-search-input').focus();
            }, 100);
        }

        function closeSearchDrawer() {
            document.getElementById('search-drawer').classList.remove('open');
        }

        function switchSearchFilter(filterType) {
            activeSearchFilter = filterType;
            document.getElementById('tab-all').className = `filter-tab ${filterType === 'all' ? 'active' : ''}`;
            document.getElementById('tab-accounts').className = `filter-tab ${filterType === 'accounts' ? 'active' : ''}`;
            document.getElementById('tab-posts').className = `filter-tab ${filterType === 'posts' ? 'active' : ''}`;
            renderDrawerSearchResults();
        }

        function handleDrawerSearch() {
            clearTimeout(searchDebounceTimer);
            const q = document.getElementById('drawer-search-input').value.trim();
            const resultsArea = document.getElementById('drawer-search-results');

            if (q.length < 2) {
                resultsArea.innerHTML = '<p style="color: #666; text-align: center; margin-top: 30px; font-size: 12px;">Type at least 2 characters to search users or posts.</p>';
                return;
            }

            resultsArea.innerHTML = '<div class="loading-spinner">Searching...</div>';

            searchDebounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`${WORKER_ORIGIN}/api/search?q=${encodeURIComponent(q)}&email=${encodeURIComponent(currentUser.email || '')}`);
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error);

                    cachedSearchData = data;
                    renderDrawerSearchResults();
                } catch (err) {
                    resultsArea.innerHTML = '<p style="color: red; text-align: center; margin-top: 20px;">Search failed.</p>';
                }
            }, 250);
        }

        async function renderDrawerSearchResults() {
            const resultsArea = document.getElementById('drawer-search-results');
            const { users, posts } = cachedSearchData;
            resultsArea.innerHTML = '';

            const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='42' height='42'><rect width='100%' height='100%' fill='%23f0f0f0'/></svg>";

            if (activeSearchFilter === 'all' || activeSearchFilter === 'accounts') {
                if (users && users.length > 0) {
                    const accHeading = document.createElement('div');
                    accHeading.innerHTML = `<h4 style="margin-bottom: 10px; font-size: 13px; color: #333;">Accounts</h4>`;
                    resultsArea.appendChild(accHeading);

                    for (const u of users) {
                        const accBox = document.createElement('a');
                        accBox.className = 'user-result-box';
                        accBox.href = `profile.html?user=${encodeURIComponent(u.username)}`;
                        accBox.onclick = (e) => {
                            goToProfile(`profile.html?user=${encodeURIComponent(u.username)}`, e);
                        };
                        accBox.innerHTML = `
                            <img class="user-result-avatar" src="${u.pfp_url || defaultAvatar}">
                            <div>
                                <div style="font-weight: bold; font-size: 13px;">@${escapeHtml(u.username)}${renderVerifiedBadge(u.verified)}</div>
                                <div style="font-size: 11px; color: #666;">${escapeHtml(u.bio || 'No bio')}</div>
                            </div>
                        `;
                        resultsArea.appendChild(accBox);
                    }
                }
            }

            if (activeSearchFilter === 'all' || activeSearchFilter === 'posts') {
                if (posts && posts.length > 0) {
                    const postHeading = document.createElement('div');
                    postHeading.innerHTML = `<h4 style="margin: 14px 0 10px 0; font-size: 13px; color: #333;">Posts</h4>`;
                    resultsArea.appendChild(postHeading);

                    await renderPosts(posts, resultsArea, { clear: false });
                }
            }

            if ((!users || !users.length) && (!posts || !posts.length)) {
                resultsArea.innerHTML = '<p style="color: #666; text-align: center; margin-top: 30px; font-size: 12px;">No matching users or posts found.</p>';
            }
        }

        // ===== ACTIVITY NOTIFICATIONS MODAL =====
        async function openActivityModal() {
            if (!currentUser || !currentUser.email) return promptSignup('view notifications');
            document.getElementById('activity-modal').style.display = 'flex';
            const listEl = document.getElementById('activity-list');
            listEl.innerHTML = '<div class="loading-spinner">Loading activity...</div>';

            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/notifications`, { headers: authHeaders() });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                if (!data.notifications.length) {
                    listEl.innerHTML = '<p style="color: #666; text-align: center; font-size: 12px;">No activity yet.</p>';
                    return;
                }

                const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><rect width='100%' height='100%' fill='%23f0f0f0'/></svg>";

                function formatNotificationText(n) {
                    if (n.type === 'tag') return 'tagged you in a post';
                    if (n.type === 'like') return 'liked your post';
                    if (n.type === 'comment') return 'commented on your post';
                    if (n.type === 'comment_reply') return 'replied to your comment';
                    if (n.type === 'follow') return 'started following you';
                    if (n.type === 'post_share') return n.message ? `shared a post: "${n.message}"` : 'shared a post with you';
                    if (n.type === 'story_reply') return n.message ? `replied to your story: "${n.message}"` : 'replied to your story';
                    return 'interacted with your post';
                }

                listEl.innerHTML = '';
                for (const n of data.notifications) {
                    const actionText = formatNotificationText(n);
                    const item = document.createElement('div');
                    item.className = 'activity-item';
                    item.innerHTML = `
                        <img class="activity-avatar" src="${n.actor_pfp || defaultAvatar}">
                        <div style="flex-grow: 1;">
                            <strong>@${escapeHtml(n.actor_username)}</strong>${renderVerifiedBadge(n.actor_verified)} ${escapeHtml(actionText)}
                            <br><span style="color: #666; font-size: 10px;">${new Date(n.created_at).toLocaleString()}</span>
                        </div>
                    `;
                    item.onclick = () => {
                        if (n.type === 'post_share' && n.post_id) {
                            window.location.href = `feed.html?post=${encodeURIComponent(n.post_id)}`;
                        } else if (n.post_id) {
                            window.location.href = `feed.html?highlight=${encodeURIComponent(n.post_id)}`;
                        } else if (n.type === 'follow' || n.type === 'story_reply') {
                            window.location.href = `profile.html?user=${encodeURIComponent(n.actor_username)}`;
                        }
                    };
                    listEl.appendChild(item);
                }
            } catch (err) {
                listEl.innerHTML = '<p style="color: red; font-size: 12px;">Failed to load notifications.</p>';
            }
        }

        function closeActivityModal() {
            document.getElementById('activity-modal').style.display = 'none';
        }

        loadFeed();
    </script>
</body>
</html>
