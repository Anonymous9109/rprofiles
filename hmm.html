<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nvaritia - Video Player Preview</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #f6f6f7;
            color: #111113;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.45;
            padding-top: 52px;
            padding-bottom: 40px;
        }
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 52px;
            padding: 0 16px;
            background: #ffffff;
            border-bottom: 1px solid #e6e6ea;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }
        .brand {
            font-size: 18px;
            font-weight: 800;
            color: #111113;
            text-decoration: none;
        }
        .wrapper {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 18px 16px;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e6e6ea;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .card-sub {
            font-size: 12px;
            color: #6b6b73;
            margin-bottom: 12px;
        }
        .url-row {
            display: flex;
            gap: 8px;
        }
        .url-input {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            border: 1px solid #e6e6ea;
            border-radius: 10px;
            font-size: 13px;
            background: #f6f6f7;
            color: #111113;
        }
        .btn {
            background: #111113;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        #player-slot {
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <header>
        <a href="feed.html" class="brand">Nvaritia</a>
        <span style="font-size: 12px; color: #6b6b73; font-weight: 600;">Player Test</span>
    </header>

    <div class="wrapper">
        <div class="card">
            <div class="card-title">Test Video URL</div>
            <div class="card-sub">Paste a direct `.mp4` or `.webm` URL to preview the player controls and auto-hide timer.</div>
            <div class="url-row">
                <input type="url" id="video-url-input" class="url-input" placeholder="https://example.com/sample.mp4">
                <button type="button" class="btn" onclick="loadTestVideo()">Load</button>
            </div>
            <div id="player-slot"></div>
        </div>
    </div>

    <script src="video-player.js?v=11"></script>
    <script>
        function loadTestVideo() {
            const input = document.getElementById('video-url-input');
            const slot = document.getElementById('player-slot');
            const url = (input.value || '').trim();
            if (!url || !window.NvaritiaVideoPlayer) return;
            slot.innerHTML = '';
            slot.appendChild(window.NvaritiaVideoPlayer.createVideoPlayer(url));
        }
    </script>
</body>
</html>
