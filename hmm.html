<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nvaritia - Reels</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #121214;
            --text: #ffffff;
            --muted: #b3b3bc;
            --line: rgba(255, 255, 255, 0.14);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        button { font: inherit; color: inherit; }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 52px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0));
            z-index: 40;
            pointer-events: none;
        }
        .top-bar > * { pointer-events: auto; }
        .brand {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
            text-decoration: none;
        }
        .pill-link {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.24);
            color: #ffffff;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 999px;
        }

        .reels-feed {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }
        .reels-feed::-webkit-scrollbar { display: none; }

        .reel-item {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            overflow: hidden;
        }

        .reel-media-layer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reel-media-layer .nv-video-wrap {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            border: none;
            border-radius: 0;
            margin-bottom: 0;
            background: #000;
        }
        .reel-media-layer .nv-video-wrap .nv-video-el {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .double-tap-burst {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.22);
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.26s ease;
        }
        .double-tap-burst.show {
            transform: translate(-50%, -50%) scale(1.08);
            opacity: 1;
        }
        .double-tap-burst svg {
            width: 40px;
            height: 40px;
            fill: #ffffff;
            stroke: #ffffff;
            stroke-width: 2;
        }

        .reel-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 64px;
            padding: 28px 16px 16px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0));
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 14px;
            z-index: 15;
            pointer-events: none;
        }
        .reel-overlay > * { pointer-events: auto; }

        .reel-meta { flex: 1; min-width: 0; }
        .reel-author-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .reel-avatar-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .reel-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--surface);
            border: 1px solid var(--line);
            display: block;
            cursor: pointer;
        }
        .reel-author {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
        }
        .reel-caption {
            font-size: 13px;
            line-height: 1.4;
            color: #f4f4f6;
            max-height: 56px;
            overflow-y: auto;
            word-break: break-word;
        }

        .reel-side-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }
        .side-action-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        button.side-btn,
        button.side-btn.reaction-btn {
            background: rgba(0, 0, 0, 0.28) !important;
            border: 1.5px solid #ffffff !important;
            border-radius: 50% !important;
            width: 44px !important;
            height: 44px !important;
            padding: 0 !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer;
            transition: background-color 0.16s ease, border-color 0.16s ease;
        }
        button.side-btn svg {
            width: 19px;
            height: 19px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: fill 0.16s ease, stroke 0.16s ease;
        }
        button.side-btn.active-like,
        button.side-btn.reaction-btn.active-like,
        html.dark button.side-btn.active-like,
        html.dark button.side-btn.reaction-btn.active-like {
            background: #ffffff !important;
            border-color: #ffffff !important;
            color: #000000 !important;
        }
        button.side-btn.active-like svg,
        html.dark button.side-btn.active-like svg {
            fill: #000000 !important;
            stroke: #000000 !important;
        }
        .side-count {
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            margin-top: 3px;
            text-align: center;
        }

        .state-box {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 24px;
            text-align: center;
            color: var(--muted);
        }
        .state-detail {
            font-size: 12px;
            color: #848490;
            max-width: 340px;
            word-break: break-word;
        }
        .retry-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        footer {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 56px;
            background: rgba(0, 0, 0, 0.92);
            border-top: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding-bottom: env(safe-area-inset-bottom, 0);
            z-index: 40;
        }
        .footer-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #9b9ba6;
            text-decoration: none;
            font-size: 10px;
            font-weight: 600;
        }
        .footer-tab.active { color: #ffffff; }
        .footer-icon {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Outside tap backdrop & half-screen bottom sheet for comments */
        #reels-comments-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2050;
        }
        #reels-comments-backdrop.open {
            display: block;
        }

        #comments-drawer.comments-drawer {
            top: auto !important;
            left: 0 !important;
            right: 0 !important;
            bottom: -55dvh !important;
            width: 100% !important;
            height: 50dvh !important;
            max-height: 50dvh !important;
            border-radius: 16px 16px 0 0;
            border-top: 1px solid #d4d4d8;
            box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.35);
            transition: bottom 0.26s cubic-bezier(0.22, 1, 0.36, 1), transform 0.2s ease !important;
            z-index: 2100;
        }
        #comments-drawer.comments-drawer.open {
            bottom: 0 !important;
            right: 0 !important;
        }
        #comments-drawer.comments-drawer.dragging {
            transition: none !important;
        }
        html.dark #comments-drawer.comments-drawer {
            border-top-color: #2f2f35;
        }

        .reels-drag-handle-wrap {
            width: 100%;
            padding: 8px 0 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            touch-action: none;
            user-select: none;
            flex-shrink: 0;
        }
        .reels-drag-handle-wrap:active {
            cursor: grabbing;
        }
        .reels-drag-handle-pill {
            width: 42px;
            height: 5px;
            border-radius: 999px;
            background: rgba(120, 120, 130, 0.55);
        }
        html.dark .reels-drag-handle-pill {
            background: rgba(255, 255, 255, 0.32);
        }

        #comments-drawer .drawer-header {
            padding: 6px 14px 10px;
            font-size: 14px;
            touch-action: none;
            user-select: none;
        }
        #comments-drawer .drawer-body {
            padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
        }
        #comments-drawer .comments-container {
            padding: 10px;
            gap: 10px;
            font-size: 14px;
        }
        #comments-drawer #comment-input {
            padding: 8px 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <a href="feed.html" class="brand">Nvaritia</a>
        <a href="create-post.html" class="pill-link">+ Post Video</a>
    </header>

    <main id="reels-feed" class="reels-feed" aria-live="polite">
        <div class="state-box">
            <div>Loading feed videos...</div>
        </div>
    </main>

    <div id="reels-comments-backdrop" aria-hidden="true"></div>

    <footer>
        <a href="feed.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Home
        </a>
        <a href="reels.html" class="footer-tab active">
            <svg class="footer-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            Reels
        </a>
        <a href="create-post.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Post
        </a>
        <a href="profile.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Profile
        </a>
    </footer>

    <script src="app.js?v=5"></script>
    <script>
        const loggedUser = typeof requireAuth === 'function' ? requireAuth(true) : { guest: true };
        const feedEl = document.getElementById('reels-feed');
        const backdropEl = document.getElementById('reels-comments-backdrop');

        const THUMBS_UP_SVG = `<svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>`;

        let activeWatch = null;

        function checkIsVideo(url) {
            if (!url || typeof url !== 'string') return false;
            if (typeof isVideoMediaUrl === 'function' && isVideoMediaUrl(url)) return true;
            return /\.(mp4|webm|mov|m4v|ogg|3gp)(\?|#|$)/i.test(url) || url.startsWith('data:video/');
        }

        function logReelWatch(postId, durationMs, completed) {
            if (!postId || (durationMs <= 0 && !completed)) return;
            const viewerEmail = (loggedUser && !loggedUser.guest && loggedUser.email) ? loggedUser.email : '';
            fetch(`${WORKER_ORIGIN}/api/posts/view`, {
                method: 'POST',
                headers: authHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({
                    email: viewerEmail,
                    postId,
                    durationMs: Math.round(durationMs),
                    completed: Boolean(completed)
                })
            }).catch(() => {});
        }

        function flushActiveWatch(completed = false) {
            if (!activeWatch) return;
            const elapsed = Math.max(0, performance.now() - activeWatch.startedAt);
            logReelWatch(activeWatch.postId, elapsed, completed);
            activeWatch = null;
        }

        function enforceSoundOnVideo(vid) {
            if (!vid) return;
            vid.muted = false;
            vid.defaultMuted = false;
            vid.volume = 1;
        }

        async function playReelAlwaysSound(vid) {
            if (!vid) return;
            document.querySelectorAll('.nv-video-el').forEach(other => {
                if (other !== vid && !other.paused) other.pause();
            });
            enforceSoundOnVideo(vid);
            try {
                await vid.play();
                enforceSoundOnVideo(vid);
            } catch (err) {
                vid.muted = true;
                try {
                    await vid.play();
                    vid.muted = false;
                    vid.volume = 1;
                } catch (e2) {}
            }
        }

        function showDoubleTapLikeFeedback(slide, isLiked) {
            if (!slide) return;
            let burst = slide.querySelector('.double-tap-burst');
            if (!burst) {
                burst = document.createElement('div');
                burst.className = 'double-tap-burst';
                burst.innerHTML = THUMBS_UP_SVG;
                slide.appendChild(burst);
            }
            burst.classList.toggle('unliked', !isLiked);
            burst.classList.remove('show');
            void burst.offsetWidth;
            burst.classList.add('show');
            clearTimeout(burst._hideTimer);
            burst._hideTimer = setTimeout(() => burst.classList.remove('show'), 480);
        }

        function bindDoubleTapLike(slide, postId) {
            let lastTapTime = 0;
            const target = slide.querySelector('.reel-media-layer') || slide;
            target.addEventListener('click', (e) => {
                if (e.target.closest('button, a, .nv-video-hud, .nv-video-center-btn')) return;
                const now = Date.now();
                if (now - lastTapTime < 320) {
                    lastTapTime = 0;
                    const likeBtn = slide.querySelector('.like-toggle-btn');
                    const willBeLiked = likeBtn ? !likeBtn.classList.contains('active-like') : true;
                    if (typeof toggleReaction === 'function') {
                        toggleReaction(postId, 'like', likeBtn);
                    }
                    showDoubleTapLikeFeedback(slide, willBeLiked);
                } else {
                    lastTapTime = now;
                }
            });
        }

        // Keep .side-btn intact whenever app.js's toggleReaction updates reaction-btn classes
        function patchToggleReactionForReels() {
            const origToggle = window.toggleReaction;
            if (typeof origToggle !== 'function' || origToggle._reelsPatched) return;

            const wrappedToggle = async function(postId, reactionType, buttonEl = null) {
                const res = await origToggle.apply(this, arguments);
                document.querySelectorAll(`.post-box[data-post-id="${postId}"] .side-btn.reaction-btn`).forEach(btn => {
                    btn.classList.add('side-btn');
                });
                if (buttonEl && buttonEl.classList.contains('side-btn')) {
                    buttonEl.classList.add('reaction-btn');
                }
                return res;
            };
            wrappedToggle._reelsPatched = true;
            window.toggleReaction = wrappedToggle;
        }

        function ensureDragHandleOnDrawer() {
            const drawer = document.getElementById('comments-drawer');
            if (!drawer) return;
            if (!drawer.querySelector('.reels-drag-handle-wrap')) {
                const handleWrap = document.createElement('div');
                handleWrap.className = 'reels-drag-handle-wrap';
                handleWrap.id = 'reels-sheet-handle';
                handleWrap.title = 'Drag down to close comments';
                handleWrap.setAttribute('aria-label', 'Drag down to close comments');
                handleWrap.innerHTML = `<div class="reels-drag-handle-pill"></div>`;
                drawer.insertBefore(handleWrap, drawer.firstChild);
            }
        }

        function syncBackdropState() {
            const drawer = document.getElementById('comments-drawer');
            const isOpen = Boolean(drawer && drawer.classList.contains('open'));
            if (backdropEl) backdropEl.classList.toggle('open', isOpen);
        }

        function setupCommentsSheetGestures() {
            if (backdropEl && !backdropEl.dataset.bound) {
                backdropEl.dataset.bound = '1';
                backdropEl.addEventListener('click', () => {
                    if (typeof closeCommentsDrawer === 'function') closeCommentsDrawer();
                    syncBackdropState();
                });
            }

            const origOpen = window.openCommentsDrawer;
            if (typeof origOpen === 'function' && !origOpen._reelsWrapped) {
                const wrappedOpen = function(postId) {
                    const res = origOpen.apply(this, arguments);
                    ensureDragHandleOnDrawer();
                    syncBackdropState();
                    bindDrawerDragToDismiss();
                    return res;
                };
                wrappedOpen._reelsWrapped = true;
                window.openCommentsDrawer = wrappedOpen;
            }

            const origClose = window.closeCommentsDrawer;
            if (typeof origClose === 'function' && !origClose._reelsWrapped) {
                const wrappedClose = function() {
                    const drawer = document.getElementById('comments-drawer');
                    if (drawer) drawer.style.transform = '';
                    const res = origClose.apply(this, arguments);
                    syncBackdropState();
                    return res;
                };
                wrappedClose._reelsWrapped = true;
                window.closeCommentsDrawer = wrappedClose;
            }
        }

        function bindDrawerDragToDismiss() {
            const drawer = document.getElementById('comments-drawer');
            const commentsList = document.getElementById('comments-list');
            if (!drawer || drawer.dataset.dragBound === '1') return;
            drawer.dataset.dragBound = '1';

            let startY = 0;
            let currentDeltaY = 0;
            let tracking = false;

            const onStart = (clientY, target) => {
                if (!drawer.classList.contains('open')) return;
                if (target && target.closest('input, textarea, button, form, #comment-sticker-panel')) return;
                const onHandleOrHeader = Boolean(target && target.closest('.reels-drag-handle-wrap, .drawer-header'));
                if (!onHandleOrHeader && commentsList && commentsList.contains(target) && commentsList.scrollTop > 2) {
                    return;
                }
                startY = clientY;
                currentDeltaY = 0;
                tracking = true;
                drawer.classList.add('dragging');
            };

            const onMove = (clientY, e) => {
                if (!tracking) return;
                const delta = clientY - startY;
                if (delta > 0) {
                    currentDeltaY = delta;
                    if (e && e.cancelable) e.preventDefault();
                    drawer.style.transform = `translateY(${Math.min(delta, drawer.offsetHeight || 400)}px)`;
                } else {
                    currentDeltaY = 0;
                    drawer.style.transform = '';
                }
            };

            const onEnd = () => {
                if (!tracking) return;
                tracking = false;
                drawer.classList.remove('dragging');
                const threshold = Math.max(60, (drawer.offsetHeight || 300) * 0.25);
                const shouldDismiss = currentDeltaY >= threshold;
                drawer.style.transform = '';
                currentDeltaY = 0;
                if (shouldDismiss) {
                    if (typeof closeCommentsDrawer === 'function') closeCommentsDrawer();
                    syncBackdropState();
                }
            };

            drawer.addEventListener('touchstart', (e) => {
                if (e.touches && e.touches.length === 1) {
                    onStart(e.touches[0].clientY, e.target);
                }
            }, { passive: true });

            drawer.addEventListener('touchmove', (e) => {
                if (e.touches && e.touches.length === 1) {
                    onMove(e.touches[0].clientY, e);
                }
            }, { passive: false });

            drawer.addEventListener('touchend', onEnd);
            drawer.addEventListener('touchcancel', onEnd);

            drawer.addEventListener('pointerdown', (e) => {
                if (e.pointerType === 'touch') return;
                onStart(e.clientY, e.target);
            });

            window.addEventListener('pointermove', (e) => {
                if (!tracking || e.pointerType === 'touch') return;
                onMove(e.clientY, e);
            });

            window.addEventListener('pointerup', (e) => {
                if (!tracking || e.pointerType === 'touch') return;
                onEnd();
            });
        }

        async function fetchFeedVideos() {
            const headers = typeof authHeaders === 'function' ? authHeaders() : {};
            const email = (loggedUser && !loggedUser.guest && loggedUser.email) ? loggedUser.email : '';
            const params = new URLSearchParams({ limit: '50' });
            if (email) params.set('email', email);

            const endpoint = `${WORKER_ORIGIN}/api/posts/feed?${params.toString()}`;
            const res = await fetch(endpoint, { headers });
            const data = await res.json();
            if (!res.ok) {
                throw new Error(data.error || `HTTP ${res.status}`);
            }

            const posts = Array.isArray(data.posts) ? data.posts : [];
            const videos = posts
                .filter(post => post && checkIsVideo(post.media_url))
                .map(post => ({ post, videoUrl: post.media_url }));

            return { videos, totalPosts: posts.length };
        }

        function renderState(title, detail, canRetry) {
            feedEl.innerHTML = `
                <div class="state-box">
                    <div>${escapeHtml(title)}</div>
                    ${detail ? `<div class="state-detail">${escapeHtml(detail)}</div>` : ''}
                    ${canRetry ? '<button type="button" class="retry-btn" onclick="initReels()">Retry</button>' : ''}
                </div>
            `;
        }

        function setupReelObserver() {
            const items = feedEl.querySelectorAll('.reel-item');
            if (!items.length || !('IntersectionObserver' in window)) return;

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const item = entry.target;
                    const vid = item.querySelector('.nv-video-el');
                    const postId = item.getAttribute('data-post-id');
                    if (!vid) return;

                    if (entry.isIntersecting && entry.intersectionRatio >= 0.65) {
                        item.classList.add('is-active');
                        if (!activeWatch || activeWatch.postId !== postId) {
                            flushActiveWatch(false);
                            activeWatch = { postId, startedAt: performance.now() };
                        }
                        playReelAlwaysSound(vid);
                    } else {
                        item.classList.remove('is-active');
                        if (activeWatch && activeWatch.postId === postId) {
                            flushActiveWatch(false);
                        }
                        if (!vid.paused) {
                            vid.pause();
                        }
                    }
                });
            }, { threshold: [0.65] });

            items.forEach(item => observer.observe(item));
        }

        async function initReels() {
            renderState('Loading feed videos...', '', false);
            patchToggleReactionForReels();
            try {
                const { videos, totalPosts } = await fetchFeedVideos();

                if (!videos.length) {
                    renderState(
                        'No feed videos found',
                        `Loaded ${totalPosts} feed post(s), none had a video attachment.`,
                        true
                    );
                    return;
                }

                feedEl.innerHTML = '';
                const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='34' height='34'><rect width='100%' height='100%' fill='%23222226'/></svg>";
                const viewerEmail = (loggedUser && !loggedUser.guest && loggedUser.email) ? loggedUser.email : '';

                for (let i = 0; i < videos.length; i++) {
                    const { post, videoUrl } = videos[i];
                    const username = post.username || 'user';
                    const authorEmail = post.user_email || '';
                    const pfp = post.pfp_url || defaultAvatar;
                    const verified = Boolean(post.verified);
                    const caption = post.content || '';
                    const postId = post.id;
                    const commentsCount = post.comments_count ?? 0;

                    if (typeof _sharedPostCache !== 'undefined' && postId) {
                        _sharedPostCache.set(postId, {
                            id: postId,
                            user_email: authorEmail,
                            username,
                            content: caption,
                            media_url: videoUrl
                        });
                    }

                    let rxData = { likes: post.likes_count || 0, dislikes: post.dislikes_count || 0, userReaction: null };
                    if (postId) {
                        try {
                            const rxRes = await fetch(`${WORKER_ORIGIN}/api/reactions/get?postId=${encodeURIComponent(postId)}&email=${encodeURIComponent(viewerEmail)}`);
                            if (rxRes.ok) rxData = await rxRes.json();
                        } catch (e) {}
                    }

                    const slide = document.createElement('section');
                    slide.className = 'reel-item post-box';
                    slide.setAttribute('data-post-id', String(postId ?? i));
                    slide.setAttribute('data-reel-idx', String(i));

                    const mediaLayer = document.createElement('div');
                    mediaLayer.className = 'reel-media-layer';
                    mediaLayer.innerHTML = renderPostMediaHtml(videoUrl);

                    const vid = mediaLayer.querySelector('.nv-video-el');
                    if (vid) {
                        enforceSoundOnVideo(vid);
                        vid.addEventListener('volumechange', () => {
                            if (vid.muted && !vid.paused) {
                                vid.muted = false;
                                vid.volume = 1;
                            }
                        });
                        vid.addEventListener('ended', () => {
                            flushActiveWatch(true);
                        });
                    }

                    const profileUrl = `profile.html?user=${encodeURIComponent(username || authorEmail)}`;
                    const overlay = document.createElement('div');
                    overlay.className = 'reel-overlay';
                    overlay.innerHTML = `
                        <div class="reel-meta">
                            <div class="reel-author-row">
                                <a class="reel-avatar-link" href="${profileUrl}" onclick="goToProfile('${profileUrl}', event)" aria-label="View @${escapeHtml(username)}'s profile">
                                    <img class="reel-avatar" src="${escapeHtml(pfp)}" alt="@${escapeHtml(username)}">
                                </a>
                                <a class="reel-author" href="${profileUrl}" onclick="goToProfile('${profileUrl}', event)">@${escapeHtml(username)}${renderVerifiedBadge(verified)}</a>
                            </div>
                            ${caption ? `<div class="reel-caption">${escapeHtml(caption)}</div>` : ''}
                        </div>
                        <div class="reel-side-actions">
                            <div class="side-action-group">
                                <button type="button" class="side-btn reaction-btn like-toggle-btn ${rxData.userReaction === 'like' ? 'active-like' : ''}" aria-label="Like reel" onclick="event.stopPropagation(); toggleReaction('${escapeHtml(String(postId))}', 'like', this)">
                                    ${THUMBS_UP_SVG}
                                </button>
                                <div class="side-count likes-count">${rxData.likes}</div>
                            </div>
                            <div class="side-action-group">
                                <button type="button" class="side-btn" aria-label="Comments" onclick="event.stopPropagation(); openCommentsDrawer('${escapeHtml(String(postId))}')">
                                    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                                </button>
                                <div class="side-count comments-count">${commentsCount}</div>
                            </div>
                            <div class="side-action-group">
                                <button type="button" class="side-btn" aria-label="Share reel" onclick="event.stopPropagation(); sharePost('${escapeHtml(String(postId))}')">
                                    <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                                </button>
                                <div class="side-count">Share</div>
                            </div>
                        </div>
                    `;

                    slide.appendChild(mediaLayer);
                    slide.appendChild(overlay);
                    feedEl.appendChild(slide);
                    bindDoubleTapLike(slide, String(postId ?? i));
                }

                if (typeof bindCustomVideoPlayers === 'function') {
                    bindCustomVideoPlayers(feedEl);
                }
                setupCommentsSheetGestures();
                setupReelObserver();
            } catch (err) {
                renderState(
                    'Could not load feed videos',
                    err && err.message ? err.message : 'Request failed',
                    true
                );
            }
        }

        window.addEventListener('pagehide', () => flushActiveWatch(false));
        initReels();
    </script>
</body>
</html>
