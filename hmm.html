<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nvaritia - Reels</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #121214;
            --text: #ffffff;
            --muted: #b3b3bc;
            --line: rgba(255, 255, 255, 0.14);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        button { font: inherit; color: inherit; }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 52px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0));
            z-index: 40;
            pointer-events: none;
        }
        .top-bar > * { pointer-events: auto; }
        .brand {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
            text-decoration: none;
        }
        .pill-link {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.24);
            color: #ffffff;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 999px;
        }

        .reels-feed {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }
        .reels-feed::-webkit-scrollbar { display: none; }

        .reel-item {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            overflow: hidden;
        }

        .reel-media-layer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reel-media-layer .nv-video-wrap {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            border: none;
            border-radius: 0;
            margin-bottom: 0;
            background: #000;
        }
        .reel-media-layer .nv-video-wrap .nv-video-el {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .reel-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 64px;
            padding: 28px 16px 16px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0));
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 14px;
            z-index: 15;
            pointer-events: none;
        }
        .reel-overlay > * { pointer-events: auto; }

        .reel-meta { flex: 1; min-width: 0; }
        .reel-author-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .reel-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--surface);
            border: 1px solid var(--line);
            flex-shrink: 0;
        }
        .reel-author {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
        }
        .reel-caption {
            font-size: 13px;
            line-height: 1.4;
            color: #f4f4f6;
            max-height: 56px;
            overflow-y: auto;
            word-break: break-word;
        }

        .reel-side-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }
        .side-action-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .side-btn {
            background: rgba(20, 20, 24, 0.78);
            border: 1px solid var(--line);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .side-btn svg {
            width: 19px;
            height: 19px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .side-btn.active-like {
            background: #ffffff;
            border-color: #ffffff;
        }
        .side-btn.active-like svg {
            stroke: #000000;
            fill: #000000;
        }
        .side-count {
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            margin-top: 3px;
            text-align: center;
        }

        .state-box {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 24px;
            text-align: center;
            color: var(--muted);
        }
        .state-detail {
            font-size: 12px;
            color: #848490;
            max-width: 340px;
            word-break: break-word;
        }
        .retry-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        footer {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 56px;
            background: rgba(0, 0, 0, 0.92);
            border-top: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding-bottom: env(safe-area-inset-bottom, 0);
            z-index: 40;
        }
        .footer-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #9b9ba6;
            text-decoration: none;
            font-size: 10px;
            font-weight: 600;
        }
        .footer-tab.active { color: #ffffff; }
        .footer-icon {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <a href="feed.html" class="brand">Nvaritia</a>
        <a href="create-post.html" class="pill-link">+ Post Video</a>
    </header>

    <main id="reels-feed" class="reels-feed" aria-live="polite">
        <div class="state-box">
            <div>Loading feed videos...</div>
        </div>
    </main>

    <footer>
        <a href="feed.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Home
        </a>
        <a href="reels.html" class="footer-tab active">
            <svg class="footer-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            Reels
        </a>
        <a href="create-post.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Post
        </a>
        <a href="profile.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Profile
        </a>
    </footer>

    <script src="app.js?v=5"></script>
    <script>
        const loggedUser = typeof requireAuth === 'function' ? requireAuth(true) : { guest: true };
        const feedEl = document.getElementById('reels-feed');

        function checkIsVideo(url) {
            if (!url || typeof url !== 'string') return false;
            if (typeof isVideoMediaUrl === 'function' && isVideoMediaUrl(url)) return true;
            return /\.(mp4|webm|mov|m4v|ogg|3gp)(\?|#|$)/i.test(url) || url.startsWith('data:video/');
        }

        async function fetchFeedVideos() {
            const headers = typeof authHeaders === 'function' ? authHeaders() : {};
            const email = (loggedUser && !loggedUser.guest && loggedUser.email) ? loggedUser.email : '';
            const params = new URLSearchParams({ limit: '50' });
            if (email) params.set('email', email);

            const endpoint = `${WORKER_ORIGIN}/api/posts/feed?${params.toString()}`;
            const res = await fetch(endpoint, { headers });
            const data = await res.json();
            if (!res.ok) {
                throw new Error(data.error || `HTTP ${res.status}`);
            }

            const posts = Array.isArray(data.posts) ? data.posts : [];
            const videos = posts
                .filter(post => post && checkIsVideo(post.media_url))
                .map(post => ({ post, videoUrl: post.media_url }));

            return { videos, totalPosts: posts.length };
        }

        function renderState(title, detail, canRetry) {
            feedEl.innerHTML = `
                <div class="state-box">
                    <div>${escapeHtml(title)}</div>
                    ${detail ? `<div class="state-detail">${escapeHtml(detail)}</div>` : ''}
                    ${canRetry ? '<button type="button" class="retry-btn" onclick="initReels()">Retry</button>' : ''}
                </div>
            `;
        }

        function setupReelObserver() {
            const items = feedEl.querySelectorAll('.reel-item');
            if (!items.length || !('IntersectionObserver' in window)) return;

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const vid = entry.target.querySelector('.nv-video-el');
                    if (!vid) return;
                    if (entry.isIntersecting && entry.intersectionRatio >= 0.65) {
                        vid.muted = true;
                        vid.play().catch(() => {});
                    } else if (!vid.paused) {
                        vid.pause();
                    }
                });
            }, { threshold: [0.65] });

            items.forEach(item => observer.observe(item));
        }

        async function initReels() {
            renderState('Loading feed videos...', '', false);
            try {
                const { videos, totalPosts } = await fetchFeedVideos();

                if (!videos.length) {
                    renderState(
                        'No feed videos found',
                        `Loaded ${totalPosts} feed post(s), none had a video attachment.`,
                        true
                    );
                    return;
                }

                feedEl.innerHTML = '';
                const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='34' height='34'><rect width='100%' height='100%' fill='%23222226'/></svg>";
                const viewerEmail = (loggedUser && !loggedUser.guest && loggedUser.email) ? loggedUser.email : '';

                for (let i = 0; i < videos.length; i++) {
                    const { post, videoUrl } = videos[i];
                    const username = post.username || 'user';
                    const pfp = post.pfp_url || defaultAvatar;
                    const verified = Boolean(post.verified);
                    const caption = post.content || '';
                    const postId = post.id;
                    const commentsCount = post.comments_count ?? 0;

                    if (typeof _sharedPostCache !== 'undefined' && postId) {
                        _sharedPostCache.set(postId, {
                            id: postId,
                            user_email: post.user_email || '',
                            username,
                            content: caption,
                            media_url: videoUrl
                        });
                    }

                    let rxData = { likes: post.likes_count || 0, dislikes: post.dislikes_count || 0, userReaction: null };
                    if (postId) {
                        try {
                            const rxRes = await fetch(`${WORKER_ORIGIN}/api/reactions/get?postId=${encodeURIComponent(postId)}&email=${encodeURIComponent(viewerEmail)}`);
                            if (rxRes.ok) rxData = await rxRes.json();
                        } catch (e) {}
                    }

                    const slide = document.createElement('section');
                    slide.className = 'reel-item post-box';
                    slide.setAttribute('data-post-id', String(postId ?? i));

                    const mediaLayer = document.createElement('div');
                    mediaLayer.className = 'reel-media-layer';
                    mediaLayer.innerHTML = renderPostMediaHtml(videoUrl);

                    const profileUrl = `profile.html?user=${encodeURIComponent(username)}`;
                    const overlay = document.createElement('div');
                    overlay.className = 'reel-overlay';
                    overlay.innerHTML = `
                        <div class="reel-meta">
                            <div class="reel-author-row">
                                <img class="reel-avatar" src="${escapeHtml(pfp)}" alt="">
                                <a class="reel-author" href="${profileUrl}" onclick="goToProfile('${profileUrl}', event)">@${escapeHtml(username)}${renderVerifiedBadge(verified)}</a>
                            </div>
                            ${caption ? `<div class="reel-caption">${escapeHtml(caption)}</div>` : ''}
                        </div>
                        <div class="reel-side-actions">
                            <div class="side-action-group">
                                <button type="button" class="side-btn reaction-btn ${rxData.userReaction === 'like' ? 'active-like' : ''}" aria-label="Like reel" onclick="event.stopPropagation(); toggleReaction('${escapeHtml(String(postId))}', 'like', this)">
                                    <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                </button>
                                <div class="side-count likes-count">${rxData.likes}</div>
                            </div>
                            <div class="side-action-group">
                                <button type="button" class="side-btn" aria-label="Comments" onclick="event.stopPropagation(); openCommentsDrawer('${escapeHtml(String(postId))}')">
                                    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                                </button>
                                <div class="side-count comments-count">${commentsCount}</div>
                            </div>
                            <div class="side-action-group">
                                <button type="button" class="side-btn" aria-label="Share reel" onclick="event.stopPropagation(); sharePost('${escapeHtml(String(postId))}')">
                                    <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                                </button>
                                <div class="side-count">Share</div>
                            </div>
                        </div>
                    `;

                    slide.appendChild(mediaLayer);
                    slide.appendChild(overlay);
                    feedEl.appendChild(slide);
                }

                if (typeof bindCustomVideoPlayers === 'function') {
                    bindCustomVideoPlayers(feedEl);
                }
                setupReelObserver();
            } catch (err) {
                renderState(
                    'Could not load feed videos',
                    err && err.message ? err.message : 'Request failed',
                    true
                );
            }
        }

        initReels();
    </script>
</body>
</html>
