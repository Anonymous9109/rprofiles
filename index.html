<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rprofiles - Welcome</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #ffffff; color: #111; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; display: flex; flex-direction: column; min-height: 100vh; padding-top: 48px; }
        header { background: #ffffff; border-bottom: 1px solid #e5e5e5; padding: 0 16px; height: 48px; display: flex; align-items: center; position: fixed; top: 0; left: 0; width: 100%; z-index: 100; }
        .brand { font-size: 18px; font-weight: bold; color: #111; text-decoration: none; }
        .auth-wrapper { width: 90%; max-width: 380px; margin: 60px auto; border: 1px solid #e5e5e5; background: #fafafa; border-radius: 8px; overflow: hidden; }
        .auth-header { background: #f0f0f0; border-bottom: 1px solid #e5e5e5; padding: 12px 16px; font-weight: bold; }
        .auth-body { padding: 16px; }
        .form-row { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
        .form-row label { font-weight: 600; color: #666; font-size: 11px; }
        .form-row input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
        .btn-app { background: #000; border: 1px solid #000; border-radius: 4px; color: #fff; font-weight: 600; padding: 8px 14px; cursor: pointer; }
        .btn-app-secondary { background: #fff; border: 1px solid #ccc; border-radius: 4px; color: #111; padding: 8px 12px; cursor: pointer; }
        .error-msg { background: #fee2e2; border: 1px solid #ef4444; color: #b91c1c; padding: 8px; border-radius: 4px; margin-bottom: 12px; font-weight: 600; display: none; }
    </style>
</head>
<body>
    <header><a href="index.html" class="brand">rprofiles</a></header>
    <div class="auth-wrapper">
        <div class="auth-header" id="auth-title">Welcome to rprofiles</div>
        <div class="auth-body">
            <div id="auth-error" class="error-msg"></div>
            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="form-row">
                    <label>Email:</label>
                    <input type="email" id="auth-email" required>
                </div>
                <div class="form-row">
                    <label>Password:</label>
                    <input type="password" id="auth-password" required>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 14px;">
                    <button type="submit" class="btn-app" id="auth-submit-btn" style="flex: 1;">Login</button>
                    <button type="button" class="btn-app-secondary" id="auth-toggle-btn" onclick="toggleAuth()">Register</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if (getSessionUser()) window.location.href = 'feed.html';
        let isRegister = false;

        function toggleAuth() {
            isRegister = !isRegister;
            document.getElementById('auth-title').innerText = isRegister ? 'Register for rprofiles' : 'Welcome to rprofiles';
            document.getElementById('auth-submit-btn').innerText = isRegister ? 'Register' : 'Login';
            document.getElementById('auth-toggle-btn').innerText = isRegister ? 'Back to Login' : 'Register';
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const endpoint = isRegister ? '/api/signup' : '/api/login';

            try {
                const res = await fetch(`${WORKER_ORIGIN}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Auth failed');

                if (isRegister) {
                    alert('Registration complete! Logging in...');
                    toggleAuth();
                } else {
                    setSessionUser(data.user);
                    window.location.href = 'feed.html';
                }
            } catch (err) {
                const el = document.getElementById('auth-error');
                el.innerText = err.message;
                el.style.display = 'block';
            }
        }
    </script>
</body>
</html>
