<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rprofiles</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-top: 48px;
            padding-bottom: 50px;
        }

        /* Fixed Header Navigation */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            color: #111111;
            padding: 0 16px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        .brand {
            font-size: 18px;
            font-weight: bold;
            color: #111111;
            text-decoration: none;
            letter-spacing: -0.5px;
            cursor: pointer;
        }

        .header-links button {
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            background: #000000;
            border: 1px solid #000000;
            border-radius: 4px;
            cursor: pointer;
            padding: 6px 12px;
            margin-left: 6px;
        }

        .header-links button:hover {
            background-color: #333333;
        }

        /* Responsive Wrapper */
        #app-wrapper {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        /* Auth Screen */
        .auth-wrapper {
            width: 90%;
            max-width: 380px;
            margin: 40px auto;
            border: 1px solid #e5e5e5;
            background: #fafafa;
            border-radius: 8px;
            overflow: hidden;
        }

        .auth-header {
            background-color: #f0f0f0;
            border-bottom: 1px solid #e5e5e5;
            color: #111111;
            padding: 12px 16px;
            font-weight: bold;
            font-size: 14px;
        }

        .auth-body {
            padding: 16px;
        }

        /* Content Panels */
        .panel {
            border: 1px solid #e5e5e5;
            background-color: #ffffff;
            border-radius: 6px;
            margin-bottom: 14px;
            overflow: hidden;
        }

        .panel-header {
            background-color: #fafafa;
            border-bottom: 1px solid #e5e5e5;
            padding: 8px 12px;
            font-weight: bold;
            color: #111111;
            font-size: 12px;
        }

        .panel-content {
            padding: 12px;
        }

        /* Forms & Inputs */
        .form-row {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-row label {
            font-weight: 600;
            color: #666666;
            font-size: 11px;
        }

        .form-row input[type="text"],
        .form-row input[type="email"],
        .form-row input[type="password"],
        .form-row textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
            background: #ffffff;
            color: #111111;
            outline: none;
        }

        .form-row input:focus, .form-row textarea:focus {
            border-color: #000000;
        }

        .form-row textarea {
            height: 70px;
            resize: vertical;
        }

        .btn-app {
            background-color: #000000;
            border: 1px solid #000000;
            border-radius: 4px;
            color: white;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 8px 14px;
            cursor: pointer;
        }

        .btn-app:hover {
            background-color: #333333;
        }

        .btn-app-secondary {
            background-color: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 4px;
            color: #111111;
            font-family: inherit;
            font-size: 12px;
            padding: 8px 12px;
            cursor: pointer;
        }

        .btn-app-secondary:hover {
            background-color: #f0f0f0;
        }

        /* Profile Layout */
        .profile-grid {
            display: flex;
            flex-direction: row;
            gap: 16px;
        }

        .profile-col-left {
            width: 140px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .profile-col-right {
            flex-grow: 1;
            min-width: 0;
        }

        .profile-picture-box {
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            padding: 4px;
            background: #ffffff;
            text-align: center;
        }

        .profile-picture-box img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 4px;
            display: block;
            background: #f0f0f0;
        }

        .profile-name {
            font-size: 18px;
            font-weight: bold;
            color: #111111;
            border-bottom: 1px solid #e5e5e5;
            padding-bottom: 6px;
            margin-bottom: 12px;
        }

        /* Post Items */
        .post-box {
            border-top: 1px solid #e5e5e5;
            padding: 12px 0;
        }

        .post-box:first-child {
            border-top: none;
        }

        .post-header-line {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .post-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid #e5e5e5;
            object-fit: cover;
        }

        .post-meta {
            font-weight: 600;
            color: #111111;
            cursor: pointer;
        }

        .post-meta:hover {
            text-decoration: underline;
        }

        .post-timestamp {
            color: #666666;
            font-size: 10px;
        }

        .post-text {
            font-size: 13px;
            margin-bottom: 8px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .post-media {
            max-width: 100%;
            max-height: 400px;
            border-radius: 6px;
            border: 1px solid #e5e5e5;
            margin-top: 6px;
        }

        /* Loading & Progress Bar */
        .loading-spinner {
            text-align: center;
            padding: 20px;
            color: #666666;
            font-weight: 600;
        }

        .progress-container {
            width: 100%;
            background-color: #f0f0f0;
            border-radius: 4px;
            height: 8px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #000000;
            transition: width 0.2s ease;
        }

        /* Error Banner */
        .error-msg {
            background-color: #fee2e2;
            border: 1px solid #ef4444;
            color: #b91c1c;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-weight: 600;
            display: none;
        }

        /* Fixed Footer Navigation bar */
        footer {
            border-top: 1px solid #e5e5e5;
            background-color: #ffffff;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        .footer-tabs {
            display: flex;
            gap: 6px;
        }

        .footer-tab {
            padding: 6px 14px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            background: #ffffff;
            color: #111111;
            font-weight: 600;
            cursor: pointer;
        }

        .footer-tab.active {
            background: #000000;
            color: #ffffff;
            border-color: #000000;
        }

        /* Modal Overlay */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 14px;
        }

        .modal-window {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 8px;
            overflow: hidden;
        }

        .modal-header {
            background: #f0f0f0;
            color: #111111;
            padding: 10px 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #e5e5e5;
        }

        .modal-body {
            padding: 14px;
        }

        .hidden { display: none !important; }

        @media (max-width: 640px) {
            .profile-grid {
                flex-direction: column;
            }
            .profile-col-left {
                width: 100%;
                flex-direction: row;
                align-items: center;
            }
            .profile-picture-box {
                width: 90px;
                flex-shrink: 0;
            }
            .profile-picture-box img {
                height: 90px;
            }
            .profile-col-left div {
                flex-grow: 1;
            }
        }
    </style>
</head>
<body>

    <header>
        <a class="brand" onclick="switchTab('home')">rprofiles</a>
        <div id="header-user-nav" class="header-links hidden">
            <button onclick="openModal('post-modal')">+ Create Post</button>
        </div>
    </header>

    <div id="app-wrapper">

        <!-- AUTHENTICATION FORM -->
        <div id="view-auth" class="auth-wrapper">
            <div class="auth-header" id="auth-title">Welcome to rprofiles</div>
            <div class="auth-body">
                <div id="auth-error" class="error-msg"></div>
                <form id="auth-form" onsubmit="handleAuth(event)">
                    <div class="form-row">
                        <label for="auth-email">Email:</label>
                        <input type="email" id="auth-email" required>
                    </div>
                    <div class="form-row">
                        <label for="auth-password">Password:</label>
                        <input type="password" id="auth-password" required>
                    </div>
                    <div style="display: flex; gap: 8px; margin-top: 14px;">
                        <button type="submit" class="btn-app" id="auth-submit-btn" style="flex: 1;">Login</button>
                        <button type="button" class="btn-app-secondary" id="auth-toggle-btn" onclick="toggleAuthMode()">Register</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- MAIN APP INTERFACE -->
        <div id="view-main" class="hidden" style="width: 100%;">
            
            <!-- HOME FEED SECTION -->
            <section id="section-home">
                <div id="home-feed-container">
                    <div class="loading-spinner">Loading posts...</div>
                </div>
            </section>

            <!-- PROFILE SECTION (Reusable for any user profile) -->
            <section id="section-profile" class="hidden">
                <div class="profile-grid">
                    
                    <div class="profile-col-left">
                        <div class="profile-picture-box">
                            <img id="profile-pfp-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%23f0f0f0'/></svg>" alt="Profile Picture">
                        </div>
                        <div id="profile-owner-actions" style="display: flex; flex-direction: column; gap: 6px; width: 100%;">
                            <button class="btn-app-secondary" onclick="openModal('profile-modal')">Edit Profile</button>
                            <button class="btn-app-secondary" onclick="openModal('settings-modal')">Settings</button>
                        </div>
                    </div>

                    <div class="profile-col-right">
                        <div class="profile-name" id="profile-username-display">User Profile</div>
                        
                        <div class="panel">
                            <div class="panel-header">Bio</div>
                            <div class="panel-content" id="profile-bio-display">
                                No bio provided.
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header" id="profile-posts-header">User Posts</div>
                            <div class="panel-content" id="profile-posts-container">
                                <div class="loading-spinner">Loading posts...</div>
                            </div>
                        </div>

                    </div>
                </div>
            </section>

        </div>

    </div>

    <!-- FIXED FOOTER NAVIGATION -->
    <footer id="app-footer" class="hidden">
        <div class="footer-tabs">
            <button class="footer-tab active" id="tab-btn-home" onclick="switchTab('home')">Home Feed</button>
            <button class="footer-tab" id="tab-btn-profile" onclick="openMyProfile()">Profile</button>
        </div>
        <div style="color: #666666; font-size: 11px;">rprofiles © 2026</div>
    </footer>

    <!-- EDIT PROFILE MODAL -->
    <div id="profile-modal" class="modal">
        <div class="modal-window">
            <div class="modal-header">
                <span>Edit Profile</span>
                <span style="cursor: pointer;" onclick="closeModal('profile-modal')">✕</span>
            </div>
            <div class="modal-body">
                <div id="profile-modal-error" class="error-msg"></div>
                <form onsubmit="saveProfile(event)">
                    <div class="form-row">
                        <label for="edit-username">Username:</label>
                        <input type="text" id="edit-username" required>
                    </div>
                    <div class="form-row">
                        <label for="edit-bio">Bio:</label>
                        <textarea id="edit-bio"></textarea>
                    </div>
                    <div class="form-row">
                        <label for="edit-pfp">Profile Picture (Max 25MB):</label>
                        <input type="file" id="edit-pfp" accept="image/*" onchange="checkFileSize(this)">
                    </div>
                    <div style="display: flex; gap: 8px; margin-top: 12px;">
                        <button type="submit" class="btn-app" style="flex: 1;">Save Changes</button>
                        <button type="button" class="btn-app-secondary" onclick="closeModal('profile-modal')">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="modal">
        <div class="modal-window">
            <div class="modal-header">
                <span>Account Settings</span>
                <span style="cursor: pointer;" onclick="closeModal('settings-modal')">✕</span>
            </div>
            <div class="modal-body">
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <p style="color: #666666; font-size: 12px;">Manage your session options.</p>
                    <button class="btn-app" style="background-color: #ef4444; border-color: #ef4444;" onclick="logout()">Logout</button>
                    <button class="btn-app-secondary" onclick="closeModal('settings-modal')">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CREATE POST MODAL -->
    <div id="post-modal" class="modal">
        <div class="modal-window">
            <div class="modal-header">
                <span>Create Post</span>
                <span style="cursor: pointer;" onclick="closeModal('post-modal')">✕</span>
            </div>
            <div class="modal-body">
                <div id="post-modal-error" class="error-msg"></div>
                <form id="create-post-form" onsubmit="createPost(event)">
                    <div class="form-row">
                        <label for="post-text">Text Content:</label>
                        <textarea id="post-text" placeholder="What's on your mind?"></textarea>
                    </div>
                    <div class="form-row">
                        <label for="post-media">Media Attachment (Max 25MB):</label>
                        <input type="file" id="post-media" accept="image/*" onchange="checkFileSize(this)">
                    </div>
                    
                    <div class="progress-container" id="post-progress-container">
                        <div class="progress-bar" id="post-progress-bar"></div>
                    </div>
                    <div id="post-status-text" style="font-size: 11px; color: #666666; margin-top: 4px; display: none;">Uploading post...</div>

                    <div style="display: flex; gap: 8px; margin-top: 12px;">
                        <button type="submit" class="btn-app" id="publish-btn" style="flex: 1;">Publish</button>
                        <button type="button" class="btn-app-secondary" onclick="closeModal('post-modal')">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const WORKER_ORIGIN = "https://icy-glitter-5cd3.socials-73a.workers.dev";

        let authState = {
            isRegister: false,
            user: null
        };

        let isPublishing = false;

        document.addEventListener('DOMContentLoaded', () => {
            const stored = localStorage.getItem('rprofiles_session');
            if (stored) {
                try {
                    authState.user = JSON.parse(stored);
                    initSession();
                } catch(e) {
                    localStorage.removeItem('rprofiles_session');
                }
            }
        });

        function toggleAuthMode() {
            authState.isRegister = !authState.isRegister;
            document.getElementById('auth-title').innerText = authState.isRegister ? 'Register for rprofiles' : 'Welcome to rprofiles';
            document.getElementById('auth-submit-btn').innerText = authState.isRegister ? 'Register' : 'Login';
            document.getElementById('auth-toggle-btn').innerText = authState.isRegister ? 'Back to Login' : 'Register';
            clearErrors();
        }

        async function handleAuth(event) {
            event.preventDefault();
            clearErrors();

            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const endpoint = authState.isRegister ? '/api/signup' : '/api/login';

            try {
                const response = await fetch(`${WORKER_ORIGIN}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Authentication error.');

                if (authState.isRegister) {
                    alert('Registration complete. Please log in.');
                    toggleAuthMode();
                } else {
                    authState.user = data.user;
                    localStorage.setItem('rprofiles_session', JSON.stringify(data.user));
                    initSession();
                }
            } catch (err) {
                showError('auth-error', err.message);
            }
        }

        function initSession() {
            document.getElementById('view-auth').classList.add('hidden');
            document.getElementById('view-main').classList.remove('hidden');
            document.getElementById('app-footer').classList.remove('hidden');
            document.getElementById('header-user-nav').classList.remove('hidden');

            if (!authState.user.username) {
                openModal('profile-modal');
            }

            switchTab('home');
        }

        function logout() {
            localStorage.removeItem('rprofiles_session');
            authState.user = null;
            document.getElementById('view-main').classList.add('hidden');
            document.getElementById('app-footer').classList.add('hidden');
            document.getElementById('header-user-nav').classList.add('hidden');
            document.getElementById('view-auth').classList.remove('hidden');
            closeModal('settings-modal');
        }

        function switchTab(tab) {
            const homeSec = document.getElementById('section-home');
            const profileSec = document.getElementById('section-profile');
            const btnHome = document.getElementById('tab-btn-home');
            const btnProfile = document.getElementById('tab-btn-profile');

            if (tab === 'home') {
                homeSec.classList.remove('hidden');
                profileSec.classList.add('hidden');
                btnHome.classList.add('active');
                btnProfile.classList.remove('active');
                fetchFeed();
            }
        }

        function openMyProfile() {
            fetchUserProfile(authState.user.email);
        }

        async function viewUserProfile(email) {
            fetchUserProfile(email);
        }

        async function fetchFeed() {
            const container = document.getElementById('home-feed-container');
            container.innerHTML = '<div class="loading-spinner">Loading posts...</div>';
            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/posts/feed`);
                const data = await res.json();
                renderPostList(container, data.posts || []);
            } catch (err) {
                container.innerHTML = '<span style="color:#ef4444; padding: 12px; display:block;">Failed to load feed items.</span>';
            }
        }

        async function fetchUserProfile(email) {
            const homeSec = document.getElementById('section-home');
            const profileSec = document.getElementById('section-profile');
            const btnHome = document.getElementById('tab-btn-home');
            const btnProfile = document.getElementById('tab-btn-profile');

            homeSec.classList.add('hidden');
            profileSec.classList.remove('hidden');
            btnHome.classList.remove('active');
            btnProfile.classList.add('active');

            const container = document.getElementById('profile-posts-container');
            container.innerHTML = '<div class="loading-spinner">Loading profile posts...</div>';

            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/profile/${encodeURIComponent(email)}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'User not found');

                const user = data.user;
                document.getElementById('profile-username-display').innerText = user.username ? `@${user.username}` : user.email;
                document.getElementById('profile-bio-display').innerText = user.bio || 'No bio provided.';
                document.getElementById('profile-pfp-img').src = user.pfp_url || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><rect width=\'100%\' height=\'100%\' fill=\'%23f0f0f0\'/></svg>';
                
                // Show edit/settings buttons only if viewing your own profile
                const isOwner = (user.email.toLowerCase() === authState.user.email.toLowerCase());
                document.getElementById('profile-owner-actions').style.display = isOwner ? 'flex' : 'none';
                document.getElementById('profile-posts-header').innerText = isOwner ? 'My Posts' : `${user.username || 'User'}'s Posts`;

                renderPostList(container, data.posts || []);
            } catch (err) {
                container.innerHTML = `<span style="color:#ef4444; padding: 12px; display:block;">${err.message}</span>`;
            }
        }

        async function saveProfile(event) {
            event.preventDefault();
            clearErrors();

            const username = document.getElementById('edit-username').value.trim();
            const bio = document.getElementById('edit-bio').value.trim();
            const pfpFile = document.getElementById('edit-pfp').files[0];

            const formData = new FormData();
            formData.append('email', authState.user.email);
            formData.append('username', username);
            formData.append('bio', bio);
            if (pfpFile) formData.append('pfp', pfpFile);

            try {
                const res = await fetch(`${WORKER_ORIGIN}/api/profile/update`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Update failed.');

                authState.user = data.user;
                localStorage.setItem('rprofiles_session', JSON.stringify(data.user));
                closeModal('profile-modal');
                fetchUserProfile(authState.user.email);
            } catch (err) {
                showError('profile-modal-error', err.message);
            }
        }

        async function createPost(event) {
            event.preventDefault();
            if (isPublishing) return;

            clearErrors();
            const text = document.getElementById('post-text').value.trim();
            const media = document.getElementById('post-media').files[0];

            if (!text && !media) {
                showError('post-modal-error', 'Post must contain text or an attachment.');
                return;
            }

            isPublishing = true;
            const publishBtn = document.getElementById('publish-btn');
            publishBtn.disabled = true;
            publishBtn.innerText = "Publishing...";

            const progressContainer = document.getElementById('post-progress-container');
            const progressBar = document.getElementById('post-progress-bar');
            const statusText = document.getElementById('post-status-text');
            progressContainer.style.display = 'block';
            statusText.style.display = 'block';
            progressBar.style.width = '30%';

            const formData = new FormData();
            formData.append('email', authState.user.email);
            formData.append('content', text);
            if (media) formData.append('media', media);

            try {
                progressBar.style.width = '70%';
                const res = await fetch(`${WORKER_ORIGIN}/api/posts/create`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to publish post.');

                progressBar.style.width = '100%';
                setTimeout(() => {
                    closeModal('post-modal');
                    document.getElementById('create-post-form').reset();
                    progressContainer.style.display = 'none';
                    statusText.style.display = 'none';
                    progressBar.style.width = '0%';
                    isPublishing = false;
                    publishBtn.disabled = false;
                    publishBtn.innerText = "Publish";
                    fetchFeed();
                }, 400);

            } catch (err) {
                showError('post-modal-error', err.message);
                progressContainer.style.display = 'none';
                statusText.style.display = 'none';
                progressBar.style.width = '0%';
                isPublishing = false;
                publishBtn.disabled = false;
                publishBtn.innerText = "Publish";
            }
        }

        function renderPostList(targetElement, posts) {
            if (!posts.length) {
                targetElement.innerHTML = '<p style="color: #666666; padding: 12px;">No posts recorded.</p>';
                return;
            }

            targetElement.innerHTML = posts.map(post => `
                <div class="post-box">
                    <div class="post-header-line">
                        <img class="post-avatar" src="${post.pfp_url || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'36\' height=\'36\'><rect width=\'100%\' height=\'100%\' fill=\'%23f0f0f0\'/></svg>'}" alt="Avatar">
                        <div>
                            <span class="post-meta" onclick="viewUserProfile('${escapeHtml(post.user_email)}')">${post.username ? '@' + escapeHtml(post.username) : escapeHtml(post.user_email)}</span>
                            <br>
                            <span class="post-timestamp">${new Date(post.created_at).toLocaleString()}</span>
                        </div>
                    </div>
                    ${post.content ? `<div class="post-text">${escapeHtml(post.content)}</div>` : ''}
                    ${post.media_url ? `<img class="post-media" src="${post.media_url}" alt="Attachment">` : ''}
                </div>
            `).join('');
        }

        function checkFileSize(input) {
            if (input.files && input.files[0]) {
                const maxBytes = 25 * 1024 * 1024;
                if (input.files[0].size > maxBytes) {
                    alert('Selected file exceeds the 25MB attachment limit.');
                    input.value = '';
                }
            }
        }

        function openModal(id) {
            if (id === 'profile-modal') {
                document.getElementById('edit-username').value = authState.user.username || '';
                document.getElementById('edit-bio').value = authState.user.bio || '';
            }
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            if (isPublishing && id === 'post-modal') return;
            document.getElementById(id).style.display = 'none';
        }

        function showError(id, message) {
            const el = document.getElementById(id);
            el.innerText = message;
            el.style.display = 'block';
        }

        function clearErrors() {
            document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function (match) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[match];
            });
        }
    </script>
</body>
</html>
