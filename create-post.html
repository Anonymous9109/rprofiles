<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nvaritia - Create Post</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #ffffff; color: #111; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; display: flex; flex-direction: column; min-height: 100vh; padding-top: 48px; padding-bottom: 54px; }
        header, footer { background: #ffffff; border-color: #e5e5e5; position: fixed; left: 0; width: 100%; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
        header { border-bottom: 1px solid #e5e5e5; height: 48px; top: 0; }
        footer { border-top: 1px solid #e5e5e5; height: 50px; bottom: 0; justify-content: space-around; }
        .brand { font-size: 18px; font-weight: bold; color: #111; text-decoration: none; }
        .wrapper { width: 100%; max-width: 680px; margin: 0 auto; padding: 16px; flex-grow: 1; }
        
        .footer-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; text-decoration: none; font-size: 10px; font-weight: 600; gap: 2px; }
        .footer-tab.active { color: #000; }
        .footer-icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .footer-tab.active .footer-icon { stroke: #000; }

        .form-row { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        .form-row label { font-weight: 600; color: #555; font-size: 12px; }
        .form-row textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; min-height: 120px; resize: vertical; }
        
        /* Custom File Button */
        .custom-file-upload { display: inline-block; padding: 10px 14px; background: #fafafa; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; font-weight: 600; text-align: center; color: #111; }
        .custom-file-upload:hover { background: #f0f0f0; }
        input[type="file"] { display: none; }

        .btn-app { background: #000; border: 1px solid #000; border-radius: 6px; color: #fff; font-weight: 600; padding: 12px 14px; font-size: 14px; cursor: pointer; width: 100%; }
        .btn-app:disabled { opacity: 0.6; }
        .error-msg { background: #fee2e2; border: 1px solid #ef4444; color: #b91c1c; padding: 10px; border-radius: 6px; margin-bottom: 14px; font-weight: 600; display: none; }
        .preview-img { max-width: 100%; max-height: 200px; border-radius: 6px; margin-top: 8px; display: none; object-fit: cover; }
    </style>
</head>
<body>
    <header><a href="feed.html" class="brand">Nvaritia</a></header>

    <div class="wrapper">
        <div style="font-size: 16px; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid #e5e5e5; padding-bottom: 6px;">Create New Post</div>
        <div id="post-error" class="error-msg"></div>
        <form onsubmit="submitPost(event)">
            <div class="form-row">
                <label>What's on your mind? (Use @username to tag people)</label>
                <textarea id="post-text" placeholder="Type your post here..."></textarea>
            </div>
            <div class="form-row">
                <label>Attach Media</label>
                <label class="custom-file-upload">
                    <input type="file" id="post-media" accept="image/*" onchange="previewFile(this)">
                    Choose Image
                </label>
                <img id="img-preview" class="preview-img">
                <span id="file-name" style="font-size: 11px; color: #666; margin-top: 4px;"></span>
            </div>
            <button type="submit" class="btn-app" id="pub-btn">Publish Post</button>
        </form>
    </div>

    <footer>
        <a href="feed.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Home
        </a>
        <a href="create-post.html" class="footer-tab active">
            <svg class="footer-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Post
        </a>
        <a href="messages.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Messages
        </a>
        <a href="profile.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Profile
        </a>
    </footer>

    <script src="app.js"></script>
    <script>
        const currentUser = requireAuth();

        function previewFile(input) {
            const file = input.files[0];
            if (file) {
                document.getElementById('file-name').innerText = file.name;
                const reader = new FileReader();
                reader.onload = e => {
                    const img = document.getElementById('img-preview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        async function submitPost(e) {
            e.preventDefault();
            const text = document.getElementById('post-text').value.trim();
            const media = document.getElementById('post-media').files[0];
            if (!text && !media) {
                showError('Post must have text or media.');
                return;
            }

            const btn = document.getElementById('pub-btn');
            btn.disabled = true;
            btn.innerText = media ? "Optimizing image..." : "Publishing...";

            try {
                const formData = new FormData();
                formData.append('email', currentUser.email);
                formData.append('content', text);
                if (media) {
                    // compressImage lives in app.js; falls back to the original file if it's missing
                    const toUpload = (typeof compressImage === 'function') ? await compressImage(media) : media;
                    formData.append('media', toUpload);
                }

                btn.innerText = "Publishing...";
                const res = await fetch(`${WORKER_ORIGIN}/api/posts/create`, { method: 'POST', body: formData });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to publish');
                window.location.href = 'feed.html';
            } catch (err) {
                showError(err.message);
                btn.disabled = false;
                btn.innerText = "Publish Post";
            }
        }

        function showError(msg) {
            const el = document.getElementById('post-error');
            el.innerText = msg;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
