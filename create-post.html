<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nvaritia - Create Post</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #ffffff; color: #111; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; display: flex; flex-direction: column; min-height: 100vh; padding-top: 48px; padding-bottom: 54px; }
        header, footer { background: #ffffff; border-color: #e5e5e5; position: fixed; left: 0; width: 100%; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
        header { border-bottom: 1px solid #e5e5e5; height: 48px; top: 0; }
        footer { border-top: 1px solid #e5e5e5; height: 50px; bottom: 0; justify-content: space-around; }
        .brand { font-size: 18px; font-weight: bold; color: #111; text-decoration: none; }
        .wrapper { width: 100%; max-width: 680px; margin: 0 auto; padding: 16px; flex-grow: 1; }

        .footer-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; text-decoration: none; font-size: 10px; font-weight: 600; gap: 2px; }
        .footer-tab.active { color: #000; }
        .footer-icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .footer-icon.icon-filled { fill: currentColor; stroke: none; }
        .footer-tab.active .footer-icon { stroke: #000; }
        .footer-tab.active .footer-icon.icon-filled { fill: #000; stroke: none; }

        .form-row { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        .form-row label { font-weight: 600; color: #555; font-size: 12px; }
        .form-row textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; min-height: 120px; resize: vertical; }

        .tag-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 2px; }
        .tag-input-wrap { display: flex; gap: 6px; width: 100%; }
        .tag-input { flex: 1; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 12px; }
        .tag-add-btn { background: #111; color: #fff; border: 1px solid #111; border-radius: 6px; padding: 8px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .tag-chip { background: #f3f4f6; border: 1px solid #d1d5db; color: #111; border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 600; cursor: pointer; }
        .tag-chip:hover { background: #e5e7eb; }
        .tag-meta { font-size: 11px; color: #666; }

        .custom-file-upload { display: inline-block; padding: 10px 14px; background: #fafafa; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; font-weight: 600; text-align: center; color: #111; }
        .custom-file-upload:hover { background: #f0f0f0; }
        input[type="file"] { display: none; }

        .btn-app { background: #000; border: 1px solid #000; border-radius: 6px; color: #fff; font-weight: 600; padding: 12px 14px; font-size: 14px; cursor: pointer; width: 100%; }
        .btn-app:disabled { opacity: 0.6; }
        .error-msg { background: #fee2e2; border: 1px solid #ef4444; color: #b91c1c; padding: 10px; border-radius: 6px; margin-bottom: 14px; font-weight: 600; display: none; }
        .preview-img { max-width: 100%; max-height: 200px; border-radius: 6px; margin-top: 8px; display: none; object-fit: cover; }
    </style>
</head>
<body>
    <header><a href="feed.html" class="brand">Nvaritia</a></header>

    <div class="wrapper">
        <div style="font-size: 16px; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid #e5e5e5; padding-bottom: 6px;">Create New Post</div>
        <div id="post-error" class="error-msg"></div>
        <form onsubmit="submitPost(event)">
            <div class="form-row">
                <label>What's on your mind? (Use @username to tag people and #tags for topics)</label>
                <textarea id="post-text" placeholder="Type your post here... e.g. Shipped a new build today #coding #buildinpublic" oninput="updateTagCount()"></textarea>
                <div class="tag-input-wrap">
                    <input type="text" id="hashtag-input" class="tag-input" placeholder="Add a hashtag (e.g. gaming, tech, art)" onkeydown="if(event.key==='Enter'){event.preventDefault();addHashtag();}">
                    <button type="button" class="tag-add-btn" onclick="addHashtag()">+ Tag</button>
                </div>
                <div class="tag-bar" id="quick-tags">
                    <button type="button" class="tag-chip" onclick="insertTag('trending')">#trending</button>
                    <button type="button" class="tag-chip" onclick="insertTag('tech')">#tech</button>
                    <button type="button" class="tag-chip" onclick="insertTag('gaming')">#gaming</button>
                    <button type="button" class="tag-chip" onclick="insertTag('life')">#life</button>
                    <button type="button" class="tag-chip" onclick="insertTag('creative')">#creative</button>
                </div>
                <div class="tag-meta" id="tag-counter">0 / 6 hashtags used</div>
            </div>
            <div class="form-row">
                <label>Attach Media</label>
                <label class="custom-file-upload">
                    <input type="file" id="post-media" accept="image/*" onchange="previewFile(this)">
                    Choose Image
                </label>
                <img id="img-preview" class="preview-img">
                <span id="file-name" style="font-size: 11px; color: #666; margin-top: 4px;"></span>
            </div>
            <button type="submit" class="btn-app" id="pub-btn">Publish Post</button>
        </form>
    </div>

    <footer>
        <a href="feed.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Home
        </a>
        <a href="create-post.html" class="footer-tab active">
            <svg class="footer-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Post
        </a>
        <a href="messages.html" class="footer-tab">
            <svg id="Layer_1" data-name="Layer 1" class="footer-icon icon-filled" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122.56 122.88"><title>sent</title><path d="M112.27,10.31l-99,38.07,30,14.37L89.21,33.18,60.44,80.53l14,29.06,37.81-99.28ZM2.42,44.49,117.16.37a3.73,3.73,0,0,1,3-.12,3.78,3.78,0,0,1,2.19,4.87L78.4,120.45a3.78,3.78,0,0,1-6.92.3l-22.67-47L2.14,51.39a3.76,3.76,0,0,1,.28-6.9Z"/></svg>
            Messages
        </a>
        <a href="profile.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Profile
        </a>
    </footer>

    <script src="app.js"></script>
    <script>
        const currentUser = requireAuth();
        const MAX_HASHTAGS = 6;

        function extractTags(text) {
            const matches = (text || "").match(/#[a-zA-Z0-9_]{1,32}/g) || [];
            return [...new Set(matches.map(t => t.toLowerCase()))];
        }

        function updateTagCount() {
            const textarea = document.getElementById('post-text');
            const tags = extractTags(textarea.value);
            const counter = document.getElementById('tag-counter');
            counter.innerText = `${tags.length} / ${MAX_HASHTAGS} hashtags used`;
            counter.style.color = tags.length > MAX_HASHTAGS ? '#b91c1c' : '#666';
        }

        function insertTag(rawTag) {
            const clean = String(rawTag || '').replace(/^#+/, '').toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 32);
            if (!clean) return;

            const textarea = document.getElementById('post-text');
            const tag = `#${clean}`;
            const currentTags = extractTags(textarea.value);

            if (currentTags.includes(tag)) {
                updateTagCount();
                return;
            }
            if (currentTags.length >= MAX_HASHTAGS) {
                showError(`Maximum of ${MAX_HASHTAGS} hashtags per post keeps feeds fair for everyone.`);
                return;
            }

            const needsSpace = textarea.value.length > 0 && !/\s$/.test(textarea.value);
            textarea.value = `${textarea.value}${needsSpace ? ' ' : ''}${tag}`;
            textarea.focus();
            updateTagCount();
        }

        function addHashtag() {
            const input = document.getElementById('hashtag-input');
            const val = input.value.trim();
            if (!val) return;
            insertTag(val);
            input.value = '';
        }

        function previewFile(input) {
            const file = input.files[0];
            if (file) {
                document.getElementById('file-name').innerText = file.name;
                const reader = new FileReader();
                reader.onload = e => {
                    const img = document.getElementById('img-preview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        async function submitPost(e) {
            e.preventDefault();
            const text = document.getElementById('post-text').value.trim();
            const media = document.getElementById('post-media').files[0];
            if (!text && !media) {
                showError('Post must have text or media.');
                return;
            }

            const tags = extractTags(text);
            if (tags.length > MAX_HASHTAGS) {
                showError(`Please use at most ${MAX_HASHTAGS} hashtags per post.`);
                return;
            }

            const btn = document.getElementById('pub-btn');
            btn.disabled = true;
            btn.innerText = media ? "Optimizing image..." : "Publishing...";

            try {
                const formData = new FormData();
                formData.append('content', text);
                if (media) {
                    const toUpload = (typeof compressImage === 'function') ? await compressImage(media) : media;
                    formData.append('media', toUpload);
                }

                btn.innerText = "Publishing...";
                const res = await fetch(`${WORKER_ORIGIN}/api/posts/create`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: formData
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to publish');
                window.location.href = 'feed.html';
            } catch (err) {
                showError(err.message);
                btn.disabled = false;
                btn.innerText = "Publish Post";
            }
        }

        function showError(msg) {
            const el = document.getElementById('post-error');
            el.innerText = msg;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
