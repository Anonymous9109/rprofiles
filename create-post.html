<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nvaritia - Create Post</title>
    <style>
        :root {
            --bg: #f6f6f7;
            --surface: #ffffff;
            --text: #111113;
            --muted: #6b6b73;
            --line: #e6e6ea;
            --accent: #111113;
            --danger: #c0262d;
            --danger-bg: #fdecec;
            --radius: 14px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            line-height: 1.45;
            min-height: 100vh;
            padding-top: 52px;
            padding-bottom: 72px;
        }
        button, input, textarea { font: inherit; color: inherit; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* Header + footer */
        header, footer {
            position: fixed; left: 0; width: 100%; z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
            display: flex; align-items: center;
        }
        header { top: 0; height: 52px; padding: 0 16px; border-bottom: 1px solid var(--line); }
        footer { bottom: 0; height: 60px; justify-content: space-around; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0); }
        .brand { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); text-decoration: none; }

        .footer-tab { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; color: var(--muted); text-decoration: none; font-size: 10.5px; font-weight: 600; padding: 6px 0; }
        .footer-tab.active { color: var(--text); }
        .footer-icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .footer-icon.icon-filled { fill: currentColor; stroke: none; }

        /* Layout */
        .wrapper { width: 100%; max-width: 640px; margin: 0 auto; padding: 20px 16px; }
        .page-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 14px; }

        .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
        .card-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        .card-hint { font-size: 12px; color: var(--muted); margin-bottom: 10px; }

        /* Error */
        .error-msg { display: none; background: var(--danger-bg); border: 1px solid #f3b8bb; color: var(--danger); padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; font-size: 13.5px; font-weight: 600; }

        /* Composer */
        textarea#post-text {
            display: block; width: 100%; min-height: 150px; resize: vertical;
            border: none; outline: none; background: transparent;
            font-size: 16px; line-height: 1.5; padding: 0;
        }
        textarea#post-text::placeholder { color: #a0a0a8; }
        .composer-foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
        .tag-meta { font-size: 12px; color: var(--muted); font-weight: 600; }

        /* Tags */
        .tag-input-wrap { display: flex; gap: 8px; margin-bottom: 10px; }
        .tag-input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; background: var(--bg); }
        .tag-input:focus { background: var(--surface); border-color: var(--text); outline: none; }
        .tag-add-btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 0 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .tag-add-btn:active { transform: scale(0.97); }
        .tag-bar { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag-chip { background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .tag-chip:hover { background: #ececef; }

        /* Media */
        .custom-file-upload {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
            padding: 22px 14px; border: 1.5px dashed #c9c9d0; border-radius: 12px;
            background: var(--bg); color: var(--muted); font-size: 14px; font-weight: 600; text-align: center; cursor: pointer;
        }
        .custom-file-upload:hover { background: #ececef; color: var(--text); }
        .custom-file-upload svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        input[type="file"] { display: none; }
        .preview-wrap { position: relative; display: none; margin-top: 12px; }
        .preview-img { display: block; width: 100%; max-height: 360px; border-radius: 12px; object-fit: cover; }
        .remove-img { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; border: none; background: rgba(17, 17, 19, 0.75); color: #fff; font-size: 18px; line-height: 1; cursor: pointer; z-index: 10; }
        #file-name { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; }

        /* Publish */
        .btn-app { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .btn-app:active { transform: scale(0.99); }
        .btn-app:disabled { opacity: 0.55; cursor: default; }
    </style>
</head>
<body>
    <header><a href="feed.html" class="brand">Nvaritia</a></header>

    <div class="wrapper">
        <h1 class="page-title">New post</h1>
        <div id="post-error" class="error-msg" role="alert"></div>
        <form onsubmit="submitPost(event)">
            <div class="card">
                <textarea id="post-text" aria-label="Post text" placeholder="What's on your mind? Use @username to tag people and #tags for topics." oninput="updateTagCount()"></textarea>
                <div class="composer-foot">
                    <span class="tag-meta" id="tag-counter">0 / 6 hashtags used</span>
                </div>
            </div>

            <div class="card">
                <span class="card-label">Hashtags</span>
                <div class="tag-input-wrap">
                    <input type="text" id="hashtag-input" class="tag-input" placeholder="Add a hashtag, e.g. gaming" aria-label="Add a hashtag" onkeydown="if(event.key==='Enter'){event.preventDefault();addHashtag();}">
                    <button type="button" class="tag-add-btn" onclick="addHashtag()">Add</button>
                </div>
                <div class="tag-bar" id="quick-tags">
                    <button type="button" class="tag-chip" onclick="insertTag('trending')">#trending</button>
                    <button type="button" class="tag-chip" onclick="insertTag('tech')">#tech</button>
                    <button type="button" class="tag-chip" onclick="insertTag('gaming')">#gaming</button>
                    <button type="button" class="tag-chip" onclick="insertTag('life')">#life</button>
                    <button type="button" class="tag-chip" onclick="insertTag('creative')">#creative</button>
                </div>
            </div>

            <div class="card">
                <span class="card-label">Image or Video</span>
                <p class="card-hint">Videos are capped at 2 minutes (60MB max).</p>
                <label class="custom-file-upload">
                    <input type="file" id="post-media" accept="image/*,video/*" onchange="previewFile(this)">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
                    Choose an image or video
                </label>

                <div class="preview-wrap" id="preview-wrap">
                    <img id="img-preview" class="preview-img" alt="Selected image preview" style="display: none;">
                    <div class="nv-video-wrap" id="video-preview-wrap" style="display: none; margin-bottom: 0;">
                        <video id="video-preview" class="nv-video-el" playsinline preload="metadata"></video>
                        <button type="button" class="nv-video-center-btn" aria-label="Play video">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="#ffffff" stroke="none" style="margin-left:2px;"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
                        </button>
                        <div class="nv-video-hud">
                            <div class="nv-video-timer-row">
                                <span class="nv-video-timer">0:00 / 0:00</span>
                            </div>
                            <div class="nv-video-progress-hit" role="slider" aria-label="Seek video">
                                <div class="nv-video-progress-track">
                                    <div class="nv-video-progress-fill"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="remove-img" onclick="removeMedia()" aria-label="Remove media">&times;</button>
                </div>
                <span id="file-name"></span>
            </div>

            <button type="submit" class="btn-app" id="pub-btn">Publish post</button>
        </form>
    </div>

    <footer>
        <a href="feed.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Home
        </a>
        <a href="create-post.html" class="footer-tab active">
            <svg class="footer-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Post
        </a>
        <a href="messages.html" class="footer-tab">
            <svg id="Layer_1" data-name="Layer 1" class="footer-icon icon-filled" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122.56 122.88"><title>sent</title><path d="M112.27,10.31l-99,38.07,30,14.37L89.21,33.18,60.44,80.53l14,29.06,37.81-99.28ZM2.42,44.49,117.16.37a3.73,3.73,0,0,1,3-.12,3.78,3.78,0,0,1,2.19,4.87L78.4,120.45a3.78,3.78,0,0,1-6.92.3l-22.67-47L2.14,51.39a3.76,3.76,0,0,1,.28-6.9Z"/></svg>
            Messages
        </a>
        <a href="profile.html" class="footer-tab">
            <svg class="footer-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Profile
        </a>
    </footer>

    <script src="app.js"></script>
    <script>
        const currentUser = requireAuth();
        const MAX_HASHTAGS = 6;
        const MAX_VIDEO_SECONDS = 120; // 2 minutes
        const MAX_MEDIA_BYTES = 60 * 1024 * 1024; // 60MB
        let _previewBlobUrl = null;

        if (typeof bindCustomVideoPlayers === 'function') {
            bindCustomVideoPlayers(document);
        }

        function extractTags(text) {
            const matches = (text || "").match(/#[a-zA-Z0-9_]{1,32}/g) || [];
            return [...new Set(matches.map(t => t.toLowerCase()))];
        }

        function updateTagCount() {
            const textarea = document.getElementById('post-text');
            const tags = extractTags(textarea.value);
            const counter = document.getElementById('tag-counter');
            counter.innerText = `${tags.length} / ${MAX_HASHTAGS} hashtags used`;
            counter.style.color = tags.length > MAX_HASHTAGS ? '#c0262d' : '';
        }

        function insertTag(rawTag) {
            const clean = String(rawTag || '').replace(/^#+/, '').toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 32);
            if (!clean) return;

            const textarea = document.getElementById('post-text');
            const tag = `#${clean}`;
            const currentTags = extractTags(textarea.value);

            if (currentTags.includes(tag)) {
                updateTagCount();
                return;
            }
            if (currentTags.length >= MAX_HASHTAGS) {
                showError(`Maximum of ${MAX_HASHTAGS} hashtags per post keeps feeds fair for everyone.`);
                return;
            }

            const needsSpace = textarea.value.length > 0 && !/\s$/.test(textarea.value);
            textarea.value = `${textarea.value}${needsSpace ? ' ' : ''}${tag}`;
            textarea.focus();
            updateTagCount();
        }

        function addHashtag() {
            const input = document.getElementById('hashtag-input');
            const val = input.value.trim();
            if (!val) return;
            insertTag(val);
            input.value = '';
        }

        function getVideoDurationSeconds(file) {
            return new Promise((resolve, reject) => {
                const probe = document.createElement('video');
                const url = URL.createObjectURL(file);
                probe.preload = 'metadata';
                probe.onloadedmetadata = () => {
                    const dur = probe.duration;
                    URL.revokeObjectURL(url);
                    resolve(dur);
                };
                probe.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('Could not read video metadata. Please choose a valid MP4 or WebM video.'));
                };
                probe.src = url;
            });
        }

        async function previewFile(input) {
            const file = input.files[0];
            if (!file) return;

            hideError();

            if (file.size > MAX_MEDIA_BYTES) {
                removeMedia();
                showError('File exceeds the 60MB limit.');
                return;
            }

            const imgEl = document.getElementById('img-preview');
            const vidWrap = document.getElementById('video-preview-wrap');
            const vidEl = document.getElementById('video-preview');
            const wrapEl = document.getElementById('preview-wrap');

            if (_previewBlobUrl) {
                URL.revokeObjectURL(_previewBlobUrl);
                _previewBlobUrl = null;
            }

            if (file.type.startsWith('video/')) {
                try {
                    const duration = await getVideoDurationSeconds(file);
                    if (!isFinite(duration) || duration <= 0) {
                        removeMedia();
                        showError('Unable to verify video length. Please try another video file.');
                        return;
                    }
                    if (duration > MAX_VIDEO_SECONDS) {
                        removeMedia();
                        const mins = Math.floor(duration / 60);
                        const secs = Math.round(duration % 60);
                        showError(`Video is ${mins}:${String(secs).padStart(2, '0')}. Videos must be 2 minutes (2:00) or shorter.`);
                        return;
                    }
                } catch (err) {
                    removeMedia();
                    showError(err.message);
                    return;
                }

                imgEl.style.display = 'none';
                imgEl.removeAttribute('src');
                _previewBlobUrl = URL.createObjectURL(file);
                vidEl.src = _previewBlobUrl;
                vidWrap.style.display = 'flex';
                wrapEl.style.display = 'block';
                document.getElementById('file-name').innerText = file.name;
            } else if (file.type.startsWith('image/')) {
                vidEl.pause();
                vidEl.removeAttribute('src');
                vidWrap.style.display = 'none';
                document.getElementById('file-name').innerText = file.name;
                const reader = new FileReader();
                reader.onload = e => {
                    imgEl.src = e.target.result;
                    imgEl.style.display = 'block';
                    wrapEl.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                removeMedia();
                showError('Unsupported file format. Please choose an image or video.');
            }
        }

        function removeMedia() {
            const input = document.getElementById('post-media');
            const imgEl = document.getElementById('img-preview');
            const vidWrap = document.getElementById('video-preview-wrap');
            const vidEl = document.getElementById('video-preview');

            input.value = '';
            imgEl.removeAttribute('src');
            imgEl.style.display = 'none';

            vidEl.pause();
            vidEl.removeAttribute('src');
            vidEl.load();
            vidWrap.style.display = 'none';
            vidWrap.classList.remove('is-playing', 'show-hud');

            if (_previewBlobUrl) {
                URL.revokeObjectURL(_previewBlobUrl);
                _previewBlobUrl = null;
            }

            document.getElementById('preview-wrap').style.display = 'none';
            document.getElementById('file-name').innerText = '';
        }

        async function submitPost(e) {
            e.preventDefault();
            hideError();
            const text = document.getElementById('post-text').value.trim();
            const media = document.getElementById('post-media').files[0];
            if (!text && !media) {
                showError('Post must have text or media.');
                return;
            }

            const tags = extractTags(text);
            if (tags.length > MAX_HASHTAGS) {
                showError(`Please use at most ${MAX_HASHTAGS} hashtags per post.`);
                return;
            }

            const btn = document.getElementById('pub-btn');
            btn.disabled = true;

            try {
                if (media && media.size > MAX_MEDIA_BYTES) {
                    throw new Error('File exceeds the 60MB limit.');
                }

                let toUpload = media;
                if (media) {
                    const isVideo = media.type.startsWith('video/');
                    if (isVideo) {
                        const dur = await getVideoDurationSeconds(media);
                        if (dur > MAX_VIDEO_SECONDS) {
                            throw new Error('Videos cannot exceed 2 minutes (2:00).');
                        }
                        btn.innerText = "Preparing video...";
                        toUpload = (typeof compressVideo === 'function') ? await compressVideo(media) : media;
                    } else {
                        btn.innerText = "Optimizing image...";
                        toUpload = (typeof compressImage === 'function') ? await compressImage(media) : media;
                    }
                }

                const formData = new FormData();
                formData.append('content', text);
                if (toUpload) formData.append('media', toUpload);

                btn.innerText = "Publishing...";
                const res = await fetch(`${WORKER_ORIGIN}/api/posts/create`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: formData
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to publish');
                window.location.href = 'feed.html';
            } catch (err) {
                showError(err.message);
                btn.disabled = false;
                btn.innerText = "Publish post";
            }
        }

        function showError(msg) {
            const el = document.getElementById('post-error');
            el.innerText = msg;
            el.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function hideError() {
            const el = document.getElementById('post-error');
            el.style.display = 'none';
            el.innerText = '';
        }
    </script>
</body>
</html>
